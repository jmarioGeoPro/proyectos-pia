<script id="piaCss" type="text/plain">/* ==========================================================================
   SOMOS Potencialidades — hoja de estilos
   PIA 2026 · I.E. Lola González · Grado 10° · Grupo 10°05
   --------------------------------------------------------------------------
   Estilo: 04-somos
   Este archivo se arma con dos partes:
     1. el carácter del proyecto (colores, tipografía, formas, detalles)
     2. la base estructural que comparten los nueve proyectos
   Cambiando las variables de :root cambia todo el aspecto sin tocar el resto.
   ========================================================================== */
/* ==========================================================================
   BASE ESTRUCTURAL — la comparten los nueve proyectos.
   Aquí va solo la ESTRUCTURA y los componentes. Los colores, la tipografía,
   las formas y el menú los pone el tema de cada proyecto.
   ========================================================================== */

/* ---- 1. reinicio ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; font-family: var(--fuente); color: var(--tinta); background: var(--fondo); line-height: 1.6; }
img { max-width: 100%; display: block; }
a { color: var(--acento-texto, var(--primario)); text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- 2. armazón: cuatro formas de organizar la página ---- */
/* Cada proyecto usa una: barra arriba, menú lateral, pestañas abajo o mixto. */
.armazon { display: grid; min-height: 100vh; grid-template-columns: 1fr; }

/* (a) barra arriba: el menú va debajo de la cabecera */
.layout-top .armazon {
  grid-template-areas: 'cab' 'menu' 'con' 'pie';
  grid-template-rows: auto auto 1fr auto;
}

/* (b) menú lateral: una columna fija a la izquierda */
.layout-sidebar .armazon {
  grid-template-areas: 'cab cab' 'menu con' 'pie pie';
  grid-template-columns: var(--ancho-menu) 1fr;
  grid-template-rows: auto 1fr auto;
}

/* (c) pestañas abajo: como una aplicación de teléfono */
.layout-tabs .armazon {
  grid-template-areas: 'cab' 'con' 'tabs';
  grid-template-rows: auto 1fr auto;
}

.barra-sup { grid-area: cab; }
.menu { grid-area: menu; }
.contenido { grid-area: con; }
.pie { grid-area: pie; }
.menu-tabs { grid-area: tabs; }

/* ---- 3. barra superior ---- */
.barra-sup { display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 60; background: var(--barra-fondo); color: var(--barra-tinta); backdrop-filter: blur(8px); }
.layout-sidebar .barra-sup, .layout-split .barra-sup { grid-column: 1 / -1; }
.marca { display: flex; align-items: center; gap: 12px; color: inherit; }
.marca-logo { width: 46px; height: 46px; object-fit: contain; border-radius: var(--radio-logo); background: var(--logo-fondo); padding: 4px; flex: none; }
.marca-texto b { display: block; font-size: 15.5px; line-height: 1.15; letter-spacing: var(--letra-titulo); }
.marca-texto span { font-size: 11px; opacity: .72; }

/* ---- 4. menú ---- */
/* (a) y (c): barra horizontal bajo la cabecera */
.layout-top .menu { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px clamp(14px, 3vw, 34px); background: var(--barra-fondo); border-bottom: 1px solid var(--linea); }

/* (b) menú lateral: columna completa */
.layout-sidebar .menu { display: flex; flex-direction: column; gap: 3px; padding: 16px 12px; background: var(--superficie); border-right: 1px solid var(--linea); }
.menu a { padding: 8px 14px; border-radius: var(--radio-boton); font-size: var(--menu-tam); font-weight: var(--menu-peso); color: inherit; opacity: .74; white-space: nowrap; transition: background .18s, opacity .18s, transform .18s; }
.menu a:hover { opacity: 1; background: var(--menu-hover); }
.menu a.activo { opacity: 1; background: var(--menu-activo-fondo); color: var(--menu-activo-tinta); box-shadow: var(--menu-activo-sombra); }

/* el menú lateral ocupa todo el ancho de su columna */
.layout-sidebar .menu a { width: 100%; }

/* menú inferior tipo aplicación */
.menu-tabs { position: sticky; bottom: 0; z-index: 60; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--barra-fondo); border-top: 1px solid var(--linea); }
.menu-tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px; border-radius: 12px; font-size: 10.5px; color: var(--barra-tinta); opacity: .6; }
.menu-tabs a b { font-size: 17px; font-weight: 400; line-height: 1; }
.menu-tabs a.activo { opacity: 1; background: var(--menu-activo-fondo); color: var(--menu-activo-tinta); }

/* ---- 5. contenido ---- */
.contenido { padding: var(--espacio) clamp(14px, 3vw, 34px) calc(var(--espacio) * 2); max-width: var(--ancho-contenido); width: 100%; margin: 0 auto; }
.volanta { display: flex; align-items: center; gap: 10px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--acento-texto); margin-bottom: 8px; }
.volanta::before { content: ''; width: 26px; height: 2px; background: currentColor; border-radius: 2px; }

/* ---- 6. pie ---- */
.pie { padding: 26px 20px; text-align: center; font-size: 12px; color: var(--pie-tinta); background: var(--pie-fondo); border-top: 1px solid var(--linea); }
.pie .equipo { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.pie .equipo span { background: var(--chip-fondo); padding: 3px 11px; border-radius: 20px; font-size: 11px; }
.pie .linea { margin-top: 5px; opacity: .82; }

/* ---- 7. tarjetas ---- */
.tarjeta { background: var(--superficie); border: var(--borde-tarjeta); border-radius: var(--radio-tarjeta); box-shadow: var(--sombra); padding: clamp(16px, 2vw, 24px); margin-bottom: 18px; position: relative; transition: box-shadow .2s, transform .2s; }
.tarjeta:hover { box-shadow: var(--sombra-alta); }
.tarjeta > h2 { font-size: var(--h2); margin-bottom: 4px; letter-spacing: var(--letra-titulo); }
.tarjeta > h2 + .ayuda { margin-top: 0; }
.tarjeta .ayuda { font-size: 13.5px; color: var(--gris); margin-bottom: 16px; }
.tarjeta h3 { font-size: 14.5px; margin: 18px 0 8px; }
.tarjeta.destacada { border: var(--borde-destacado); }

/* ---- 8. rejillas ---- */
.rejilla { display: grid; gap: var(--hueco); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }

/* ---- 9. formularios ---- */
.campo { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
.campo label { font-size: 12.5px; font-weight: var(--label-peso); color: var(--label-color); letter-spacing: .01em; }
.campo label .req { color: var(--peligro); }
.campo input, .campo select, .campo textarea { width: 100%; border: var(--borde-campo); border-radius: var(--radio-campo); padding: 10px 13px; background: var(--campo-fondo); color: var(--tinta); transition: border-color .16s, box-shadow .16s; }
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--primario); box-shadow: 0 0 0 3px var(--foco); }
.campo textarea { min-height: 92px; resize: vertical; }
.campo .pista { font-size: 11.5px; color: var(--gris); }

/* ---- 10. botones ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: var(--borde-boton); background: var(--boton-fondo); color: var(--boton-tinta); border-radius: var(--radio-boton); padding: 10px 18px; font-size: 13.5px; font-weight: var(--boton-peso); cursor: pointer; text-decoration: none; transition: transform .14s, box-shadow .14s, background .14s, border-color .14s; letter-spacing: var(--letra-boton); }
.btn:hover { transform: var(--boton-hover); box-shadow: var(--sombra); }
.btn:active { transform: translateY(0) scale(.985); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.p { background: var(--primario); border-color: var(--primario); color: var(--primario-tinta); }
.btn.a { background: var(--acento); border-color: var(--acento); color: var(--acento-tinta); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.pel { background: var(--peligro); border-color: var(--peligro); color: #fff; }
.btn.fantasma { background: transparent; border-color: var(--linea-fuerte); }
.btn.pq { padding: 5px 11px; font-size: 12px; }
.btn.gr { width: 100%; }

/* ---- 11. tablas ---- */
.tabla-envoltura { overflow-x: auto; border-radius: var(--radio-tabla); border: 1px solid var(--linea); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--superficie); }
th, td { padding: 10px 13px; text-align: left; border-bottom: 1px solid var(--linea); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--th-tinta); background: var(--th-fondo); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .12s; }
tbody tr:hover td { background: var(--fila-hover); }
td .acciones { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---- 12. etiquetas de estado ---- */
.badge { display: inline-block; padding: 2px 10px; border-radius: var(--radio-badge); font-size: 11.5px; font-weight: 700; white-space: nowrap; letter-spacing: .01em; }
.badge.ok, .badge.ok { background: var(--ok-suave); color: var(--ok-texto); }
/* todos los semáforos en verde */
.badge.warn, .badge.mal, .badge.malo, .badge.info, .badge.neutro,
.badge.warn, .badge.mal, .badge.malo {
  background: var(--ok-suave); color: var(--ok-texto); border: 1px solid var(--ok);
}
.badge.warn::before, .badge.mal::before, .badge.malo::before {
  content: '● '; color: var(--ok); font-size: 9px; vertical-align: middle;
}

/* ---- 13. avisos ---- */
.aviso { border-left: var(--aviso-grosor) solid var(--info); background: var(--info-suave); padding: 12px 16px; border-radius: 0 var(--radio-campo) var(--radio-campo) 0; font-size: 13.5px; margin-bottom: 15px; }
.aviso.ok { border-color: var(--ok); background: var(--ok-suave); color: var(--ok-texto); }
.aviso.mal { border-color: var(--peligro); background: var(--peligro-suave); color: var(--peligro-texto); }
.aviso.warn { border-color: var(--alerta); background: var(--alerta-suave); color: var(--alerta-texto); }

/* ---- 14. indicadores ---- */
.indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: var(--hueco); margin-bottom: 20px; }
.indicador { background: var(--superficie); border-radius: var(--radio-tarjeta); padding: 16px 18px; border: var(--borde-tarjeta); box-shadow: var(--sombra); position: relative; overflow: hidden; }
.indicador b { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--gris); font-weight: 700; }
.indicador strong { display: block; font-size: clamp(24px, 3vw, 32px); color: var(--primario); line-height: 1.15; letter-spacing: -0.02em; }
.indicador span { font-size: 11.5px; color: var(--gris); }

/* ---- 15. aviso flotante ---- */
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 900; background: var(--ok); color: #fff; padding: 13px 20px; border-radius: var(--radio-toast); font-size: 13.5px; box-shadow: var(--sombra-alta); max-width: min(380px, calc(100vw - 40px)); animation: toastEntra .26s cubic-bezier(.2,.9,.3,1.2); }
.toast.mal { background: var(--peligro); }
.toast.warn { background: var(--alerta); }
@keyframes toastEntra { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }

/* ---- 16. ventana ---- */
.modal-fondo { position: fixed; inset: 0; background: rgba(8, 12, 22, .55); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; backdrop-filter: blur(3px); animation: funde .18s; }
@keyframes funde { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--superficie); border-radius: var(--radio-modal); width: 100%; max-width: 640px; box-shadow: var(--sombra-alta); animation: sube .22s cubic-bezier(.2,.9,.3,1.1); }
@keyframes sube { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
.modal .cabeza { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--linea); }
.modal .cabeza h3 { font-size: 16px; margin: 0; }
.modal .cuerpo { padding: 18px 20px; max-height: 66vh; overflow-y: auto; }
.modal .pie2 { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 20px; border-top: 1px solid var(--linea); background: var(--fondo); border-radius: 0 0 var(--radio-modal) var(--radio-modal); }
.cerrar { border: 0; background: transparent; font-size: 16px; cursor: pointer; color: var(--gris); padding: 5px 9px; border-radius: 8px; }
.cerrar:hover { background: var(--fila-hover); }

/* ---- 17. barra de progreso ---- */
.barra { height: 9px; background: var(--linea); border-radius: 20px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--primario); border-radius: 20px; transition: width .5s cubic-bezier(.3,.9,.3,1); }

/* ---- 18. utilidades ---- */
.fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.derecha { margin-left: auto; }
.centro { text-align: center; }
.gris { color: var(--gris); }
.pequeno { font-size: 12px; }
.mono { font-family: var(--fuente-mono); letter-spacing: .04em; }
.vacio { text-align: center; color: var(--gris); padding: 30px 20px; font-size: 13.5px; }
.vacio::before { content: '○'; display: block; font-size: 30px; opacity: .4; margin-bottom: 6px; }
.oculto-impresion { }

/* ---- 18b. bloque de pseudocódigo ---- */
.codigo {
  background: var(--superficie); border: var(--borde-tarjeta); border-radius: var(--radio-tarjeta);
  padding: 16px 18px; overflow-x: auto; margin: 0;
  font-family: var(--fuente-mono); font-size: 12.5px; line-height: 1.7;
  white-space: pre; color: var(--tinta); tab-size: 2;
}

/* ---- 19. animaciones de entrada ---- */
@keyframes aparece { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.anim { animation: aparece .34s ease-out both; }

/* ---- 20. adaptación ---- */
@media (max-width: 900px) {
  /* en pantallas pequeñas el menú lateral se vuelve una barra arriba */
  .layout-sidebar .armazon { grid-template-areas: 'cab' 'menu' 'con' 'pie'; grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
  .layout-sidebar .menu { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--linea); padding: 8px 12px; }
  .layout-sidebar .menu a { width: auto; padding: 8px 13px; white-space: nowrap; }
}
@media (max-width: 640px) {
  .contenido { padding: 16px 13px 46px; }
  .barra-sup { padding: 9px 13px; gap: 9px; }
  .marca-logo { width: 38px; height: 38px; }
  .marca-texto b { font-size: 14px; }
  .menu { width: 100%; margin-left: 0; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 3px; }
  .btn { width: 100%; }
  .fila .btn { width: auto; }
}
@media print {
  .barra-sup, .pie, .menu, .menu-tabs, .btn, .toast, .modal-fondo, .no-impresion { display: none !important; }
  body { background: #fff; }
  .tarjeta { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
}

/* ==========================================================================
   TEMA SOMOS — identidad de la presentación
   --------------------------------------------------------------------------
   Sacado de SOMOS POTENCIALIDADES.pptx:
     · diapositiva 4 — diseño moderno, limpio, formas orgánicas, bordes
       redondeados, iconos minimalistas, navegación en la parte superior
     · diapositiva 5 — la barra azul con la curva amarilla a la izquierda
     · diapositiva 6 — la paleta de colores
   El blanco manda; el azul lleva la navegación y los títulos; el amarillo
   marca la acción. El morado aparece solo como detalle.
   ========================================================================== */
:root {
  /* --- la paleta de la diapositiva 6, tal cual --- */
  --azul: #1B4079;
  --azul-2: #3D6FB6;
  --amarillo: #F4C430;
  --amarillo-claro: #F9DD6C;
  --blanco: #FFFFFF;
  --fondo: #F6F8FB;
  --texto: #1E1E1E;
  --morado: #6D3FA6;

  --fuente: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --fuente-mono: 'Consolas', monospace;
  --tinta: #1E1E1E;
  --superficie: #FFFFFF;
  --gris: #5d6b80;
  --linea: #e3e9f2;
  --linea-fuerte: #cbd7e6;

  --primario: #1B4079;
  --primario-tinta: #FFFFFF;
  --acento: #F4C430;
  --acento-tinta: #2a2100;
  --acento-texto: #8a6400;

  --ok: #15803d;  --ok-suave: #dcfce7;  --ok-texto: #14532d;
  --alerta: #b45309;  --alerta-suave: #fef3c7;  --alerta-texto: #78350f;
  --peligro: #b91c1c;  --peligro-suave: #fee2e2;  --peligro-texto: #7f1d1d;
  --info: #3D6FB6;  --info-suave: #e8f0fb;  --info-texto: #1B4079;
  --neutro-suave: #eef3fa;

  --barra-fondo: #FFFFFF;  --barra-tinta: #1B4079;
  --menu-hover: rgba(255,255,255,.14);
  --menu-activo-fondo: #F4C430;  --menu-activo-tinta: #1B4079;
  --menu-activo-sombra: 0 4px 14px rgba(244,196,48,.45);
  --pie-fondo: #1B4079;  --pie-tinta: #c3d3e8;  --chip-fondo: rgba(255,255,255,.1);

  --radio-tarjeta: 20px;  --radio-boton: 999px;  --radio-campo: 14px;
  --radio-modal: 22px;  --radio-tabla: 16px;  --radio-badge: 999px;
  --radio-toast: 14px;  --radio-logo: 50%;

  --sombra: 0 2px 10px rgba(27,64,121,.06);
  --sombra-alta: 0 20px 50px rgba(27,64,121,.18);
  --borde-tarjeta: 1px solid #e8eef7;
  --borde-destacado: 2px solid #F4C430;
  --borde-campo: 1px solid #d5e0ee;
  --borde-boton: 1px solid #e3e9f2;
  --campo-fondo: #FBFDFF;
  --th-fondo: #F0F5FC;  --th-tinta: #5d6b80;
  --fila-hover: #F7FAFE;
  --foco: rgba(27,64,121,.35);
  --logo-fondo: #FFFFFF;

  --boton-fondo: #FFFFFF;  --boton-tinta: #1B4079;  --boton-peso: 700;
  --boton-hover: translateY(-1px);  --letra-boton: .01em;
  --h2: 19px;  --letra-titulo: -.02em;
  --menu-tam: 13.5px;  --menu-peso: 600;
  --label-peso: 600;  --label-color: #33465e;
  --espacio: 26px;  --hueco: 18px;
  --ancho-contenido: 1180px;  --ancho-menu: 250px;
  --aviso-grosor: 4px;
}

*, *::before, *::after { box-sizing: border-box; }

/* ---- el lienzo: blanco con un velo azul y amarillo muy tenue ---- */
body {
  background: #F6F8FB;
  background-image:
    radial-gradient(900px 520px at 10% -8%, rgba(61,111,182,.10), transparent 62%),
    radial-gradient(760px 460px at 94% 2%, rgba(244,196,48,.14), transparent 60%);
  background-attachment: fixed;
  color: var(--texto);
}

/* ---- 1. cabecera fija ---- */
.barra-sup {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; gap: 12px;
  padding: 9px clamp(14px, 3vw, 30px);
  background: rgba(255,255,255,.86);
  -webkit-backdrop-filter: blur(20px) saturate(170%);
  backdrop-filter: blur(20px) saturate(170%);
  border: 0; border-bottom: 1px solid #e8eef7;
  box-shadow: 0 1px 0 rgba(27,64,121,.04);
}
.marca { display: flex; align-items: center; gap: 11px; min-width: 0; }
.marca-logo { width: 52px; height: 52px; border-radius: 50%; object-fit: contain; flex: none; background: #fff; box-shadow: 0 2px 8px rgba(27,64,121,.12); }

.marca-texto span { color: #6b7686; font-size: 11.5px; letter-spacing: .01em; }

.layout-top .menu {
  position: fixed; top: 78px; left: 50%; transform: translateX(-50%); z-index: 99;
  display: flex; justify-content: space-evenly; align-items: center; gap: 2px; flex-wrap: wrap;
  width: min(calc(100% - 32px), 1080px); margin: 0; padding: 8px 16px 8px 96px;
  background: #1B4079;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 999px;
  box-shadow: 0 12px 34px rgba(27,64,121,.30);
  overflow: hidden;
  transition: top .2s ease, box-shadow .2s ease;
}
/* la curva amarilla que abraza la esquina, como en la presentación */
.layout-top .menu::before {
  content: ''; position: absolute; left: -58px; top: -58px; width: 148px; height: 148px;
  background: #F4C430; border-radius: 50%;
}
.layout-top .menu.flotando { top: 70px; box-shadow: 0 16px 44px rgba(27,64,121,.36); }
.layout-top .menu a {
  color: #cfdcf0; font-size: 13.5px; font-weight: 600; font-family: inherit;
  padding: 9px 18px; border-radius: 999px; position: relative; z-index: 1;
  transition: background .16s ease, color .16s ease, transform .12s ease;
}
.layout-top .menu a:hover { background: rgba(255,255,255,.13); color: #fff; }
.layout-top .menu a:active { transform: scale(.97); }
.layout-top .menu a.activo, .layout-top .menu a.activo:hover {
  background: #F4C430 !important; color: #1B4079 !important;
  font-weight: 700; box-shadow: 0 4px 14px rgba(244,196,48,.45);
}

/* hueco para la cabecera fija y la nube */
.layout-top .armazon { padding-top: 150px; }

/* ---- 3. bienvenida compacta ---- */
.bienvenida {
  min-width: 0; max-width: 100%;
  background: #fff; border: var(--borde-tarjeta); border-radius: 24px;
  padding: clamp(20px, 2.8vw, 28px); margin: 20px 0 18px;
  box-shadow: var(--sombra);
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
}
.bienvenida .saludo { flex: 1; min-width: 250px; }
.bienvenida .lema { font-size: 11.5px; color: #8a6400; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; padding: 0; text-align: left; margin-bottom: 7px; }
.bienvenida h1 { font-size: clamp(24px, 3.4vw, 34px); color: #1B4079; letter-spacing: -.03em; line-height: 1.1; margin-bottom: 7px; }
.bienvenida p { color: #5d6b80; font-size: 14.5px; max-width: 62ch; }
.bienvenida .acciones { display: flex; gap: 9px; flex-wrap: wrap; }

/* ---- 4. accesos a las categorías ---- */
.contenido, .armazon > * { min-width: 0; width: 100%; max-width: 100%; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; scrollbar-width: none; min-width: 0; max-width: 100%; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid #d5e0ee; background: #fff; color: #1B4079;
  font-size: 13px; font-weight: 600; font-family: inherit;
  padding: 8px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  transition: background .16s, color .16s, border-color .16s, transform .12s;
}
.chip:hover { background: #F2F6FC; border-color: #3D6FB6; }
.chip:active { transform: scale(.97); }
.chip[aria-pressed='true'] { background: #1B4079; border-color: #1B4079; color: #fff; box-shadow: 0 4px 14px rgba(27,64,121,.26); }
.chip .cuenta { opacity: .6; font-weight: 500; margin-left: 5px; }

/* ---- 5. la galería ---- */
.galeria-rejilla {
  display: grid; gap: 18px; width: 100%; max-width: 100%;
  grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr));
}
.obra {
  background: #fff; border: var(--borde-tarjeta); border-radius: 20px;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 1px 2px rgba(27,64,121,.04);
  transition: transform .2s ease, box-shadow .2s ease;
}
.obra:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(27,64,121,.15); }
.obra-portada { position: relative; aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; }
.obra-portada .monograma { font-size: clamp(40px, 6vw, 56px); font-weight: 700; color: rgba(27,64,121,.22); line-height: 1; letter-spacing: -.04em; }
.obra-portada .sello { position: absolute; left: 11px; bottom: 9px; font-size: 8.5px; letter-spacing: .1em; color: rgba(27,64,121,.42); text-transform: uppercase; }
.obra-cuerpo { padding: 13px 15px 15px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; flex: 1; }
.obra-cuerpo .obra-titulo, .obra-cuerpo .obra-autor, .obra-cuerpo .obra-pie { width: 100%; }
.obra-titulo { font-size: 15.5px; font-weight: 700; color: #1B4079; line-height: 1.28; }
.obra-autor { font-size: 12px; color: #6b7686; }
.obra-pie { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 8px; }
.obra-cat { align-self: flex-start; font-size: 11px; font-weight: 700; color: #1B4079; background: rgba(27,64,121,.07); padding: 4px 10px; border-radius: 999px; }

/* ---- 6. me gusta, con pulso amarillo ---- */
.gusta {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  border: 1px solid #d5e0ee; background: #fff; color: #1B4079;
  font-family: inherit; font-size: 12px; font-weight: 700;
  padding: 6px 12px; border-radius: 999px; cursor: pointer; position: relative;
  transition: background .16s, border-color .16s, color .16s, transform .12s;
}
.gusta:hover { background: #FFFBF0; border-color: #F4C430; }
.gusta:active { transform: scale(.94); }
.gusta .corazon { font-size: 14px; line-height: 1; transition: transform .18s ease; }
.gusta[aria-pressed='true'] { background: #FFF7DC; border-color: #F4C430; color: #8a6400; }
.gusta[aria-pressed='true'] .corazon { color: #E0A800; }

@keyframes pulsoGusta {
  0%   { box-shadow: 0 0 0 0 rgba(244,196,48,.65); transform: scale(1); }
  45%  { box-shadow: 0 0 0 10px rgba(244,196,48,0); transform: scale(1.09); }
  100% { box-shadow: 0 0 0 0 rgba(244,196,48,0); transform: scale(1); }
}
.gusta.pulso { animation: pulsoGusta .62s cubic-bezier(.3,.9,.3,1); }
.gusta.pulso .corazon { animation: lateCorazon .62s cubic-bezier(.3,.9,.3,1); }
@keyframes lateCorazon { 0% { transform: scale(1); } 35% { transform: scale(1.45); } 100% { transform: scale(1); } }

/* ---- 7. barra inferior del celular ---- */
.barra-movil { display: none; }

@media (max-width: 820px) {
  .layout-top .menu { display: none; }
  .layout-top .armazon { padding-top: 74px; }
  .barra-sup { padding: 8px 14px; flex-wrap: wrap; row-gap: 4px; gap: 8px; }
  .marca { flex: 1 1 auto; }

  .barra-sup .fila { gap: 6px !important; }
  .barra-sup select { max-width: 118px; font-size: 12px !important; }

  .barra-movil {
    display: flex; position: fixed; z-index: 120;
    left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding: 8px 6px;
    background: #1B4079;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 22px;
    box-shadow: 0 12px 32px rgba(27,64,121,.34);
    justify-content: space-around; align-items: center; gap: 2px;

  .barra-movil a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-decoration: none; color: #a8bdd9; font-size: 10px; font-weight: 600;
    padding: 5px 2px; border-radius: 14px;
    transition: color .16s, background .16s, transform .12s;

  .barra-movil a i { font-style: normal; font-size: 18px; line-height: 1; }
  .barra-movil a:active { transform: scale(.94); }
  .barra-movil a.activo { color: #1B4079; background: #F4C430; }

  .armazon { padding-bottom: 96px; }
  .pie { padding-bottom: 104px; }
  .galeria-rejilla { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .obra-titulo { font-size: 14px; }
  .contenido { padding-left: 14px; padding-right: 14px; }

.servicio h3 { color: #1B4079; font-size: 15.5px; margin-bottom: 5px; }
.servicio p { color: #5d6b80; font-size: 13.5px; }

.cifra { text-align: center; padding: 16px 10px; }

.persona { text-align: center; }

.persona b { display: block; color: #1B4079; font-size: 13.5px; }
.persona span { color: #6b7686; font-size: 12px; }

.grafico { display: flex; align-items: flex-end; gap: 12px; height: 210px; padding: 8px 4px 0; }
.grafico .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; height: 100%; min-width: 0; }
.grafico .pista { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.grafico .barra-col { width: 64%; border-radius: 11px 11px 4px 4px; background: linear-gradient(180deg, #3D6FB6, #1B4079); min-height: 8px; transition: height .8s cubic-bezier(.3,.9,.3,1); }

.grafico .etiqueta { font-size: 11px; color: #6b7686; text-align: center; line-height: 1.25; height: 30px; overflow: hidden; }
.grafico .etiqueta b { display: block; color: #1B4079; font-size: 13px; }

.contacto { background: #fff; border: var(--borde-tarjeta); border-radius: 26px; padding: clamp(22px, 3.6vw, 40px); box-shadow: var(--sombra); }
.contacto h2 { color: #1B4079; font-size: clamp(22px, 3vw, 30px); letter-spacing: -.025em; margin-bottom: 7px; }
.contacto p { color: #5d6b80; margin-bottom: 18px; }
.contacto .campo input, .contacto .campo select, .contacto .campo textarea { background: #F9FBFE; }

/* ---- 9. el pie ---- */
.pie { background: #1B4079; color: #c3d3e8; padding-top: 28px; }
.pie b { color: #fff; }
.pie .equipo span { background: rgba(255,255,255,.12); color: #e6eefa; border-radius: 999px; padding: 4px 12px; font-size: 11.5px; }
.pie .linea { color: #9fb4d0; font-size: 11.5px; }
.pie a { color: #F4C430; }

/* ---- 10. accesibilidad ---- */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .chip:focus-visible {

}
#piaEjemplos { left: auto !important; right: 18px !important; width: auto !important; }

/* ---- 11. el morado, solo como detalle ---- */
.bienvenida .lema::before { content: '◆ '; color: #6D3FA6; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {

  .obra:hover, .servicio:hover { transform: none; }
}

    var todo = leerTodo();
    todo[tabla] = filas;

  }

  /** Inserta una fila y le pone un id que no se repite. */
  function insertar(tabla, fila) {
    var filas = listar(tabla);
    var id = filas.reduce(function (m, f) { return Math.max(m, Number(f.id) || 0); }, 0) + 1;
    var nueva = Object.assign({}, fila, { id: id, creado: new Date().toISOString() });

    guardar(tabla, filas);

  }

  function actualizar(tabla, id, cambios) {

        filas[i] = Object.assign({}, filas[i], cambios, { id: Number(id) });

  function fecha(v) {

  function fechaHora(v) {

  });

};

/** Devuelve true si el rol actual puede hacer la acción. */
PIA.puede = function (accion) {
  if (PIA.rol === 'Administrador') return true;
  if (PIA.rol === 'Docente') return ['crear', 'editar', 'exportar', 'imprimir'].indexOf(accion) !== -1;
  return ['crear', 'exportar'].indexOf(accion) !== -1;
};

/* ---------------- 2. EXPORTAR E IMPRIMIR ---------------- */

/** Descarga una tabla en CSV (se abre en Excel). */
PIA.csv = function (tabla, columnas) {
  var filas = PIA.listar(tabla);
  if (!filas.length) { PIA.toast('No hay datos para exportar.', 'warn'); return; }
  var cols = columnas || Object.keys(filas[0]).filter(function (k) { return k !== 'creado'; });
  var lineas = [cols.join(';')];
  filas.forEach(function (f) {
    lineas.push(cols.map(function (c) {
      var v = f[c];
      if (Array.isArray(v)) v = v.join(' | ');
      return String(v == null ? '' : v).replace(/;/g, ',').replace(/[\r\n]+/g, ' ');
    }).join(';'));
  });
  var contenido = '\ufeff' + lineas.join('\r\n');
  var enlace = document.createElement('a');
  enlace.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(contenido);
  enlace.download = 'SOMOS Potencialidades-' + tabla + '-' + PIA.hoy() + '.csv';
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  PIA.toast('Archivo exportado: ' + enlace.download);
};

/** Imprime la página tal como se ve. */
PIA.imprimir = function () { window.print(); };

/** Copia un texto al portapapeles. */
PIA.copiar = function (texto) {
  var t = String(texto || '');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(t).then(function () { PIA.toast('Copiado: ' + t); }, function () { PIA.toast(t); });
  } else { PIA.toast(t); }
};

/* ---------------- 5. BÚSQUEDA Y ORDEN EN TABLAS ---------------- */

var ORDEN_ACTUAL = {};

/** Filtra las filas de una tabla por un texto, en cualquier columna. */
PIA.filtrar = function (filas, texto) {
  var t = PIA.normalizar(texto);
  if (!t) return filas;
  return filas.filter(function (f) { return PIA.normalizar(JSON.stringify(f)).indexOf(t) !== -1; });
};

/** Ordena las filas por una columna (alterna ascendente y descendente). */
PIA.ordenar = function (filas, columna) {
  var clave = ORDEN_ACTUAL.clave === columna && ORDEN_ACTUAL.dir === 'asc' ? 'desc' : 'asc';
  ORDEN_ACTUAL = { clave: columna, dir: clave };
  return filas.slice().sort(function (a, b) {
    var x = a[columna], y = b[columna];
    var num = !isNaN(Number(x)) && !isNaN(Number(y)) && x !== '' && y !== '';
    var r = num ? Number(x) - Number(y) : PIA.normalizar(x).localeCompare(PIA.normalizar(y));
    return clave === 'asc' ? r : -r;
  });
};

/* ---------------- 6. CONTADORES ANIMADOS ---------------- */

/** Anima un número desde 0 hasta su valor final. */
PIA.contar = function (idElemento, hasta, sufijo) {
  var el = document.getElementById(idElemento);
  if (!el) return;
  var meta = Number(hasta) || 0;
  var inicio = 0;
  var paso = Math.max(1, Math.ceil(meta / 26));
  var timer = setInterval(function () {
    inicio += paso;
    if (inicio >= meta) { inicio = meta; clearInterval(timer); }
    el.textContent = inicio + (sufijo || '');
  }, 22);
};

/** Lanza una lluvia de colores al completar algo importante. */
PIA.brindis = function () {
  var colores = ['#f97316', '#22c55e', '#0284c7', '#a78bfa', '#f59e0b', '#ef4444'];
  for (var i = 0; i < 34; i++) {
    var p = document.createElement('div');
    p.style.cssText = 'position:fixed;z-index:2000;pointer-events:none;width:9px;height:9px;border-radius:2px;' +
      'left:' + (Math.random() * 100) + 'vw;top:-14px;background:' + colores[i % colores.length] + ';' +
      'transition:transform 1.5s cubic-bezier(.2,.7,.4,1), opacity 1.5s;';
    document.body.appendChild(p);
    (function (el) {
      requestAnimationFrame(function () {
        el.style.transform = 'translateY(' + (window.innerHeight + 40) + 'px) rotate(' + (Math.random() * 720) + 'deg)';
        el.style.opacity = '0';
      });
      setTimeout(function () { el.remove(); }, 1700);

};

/* ---------------- 12. CINCO EJEMPLOS DESDE LA PÁGINA ---------------- */

/* Palabras que se cambian para que los ejemplos no queden idénticos. */
var VARIANTES = ['Nuevo', 'Actualizado', 'Urgente', 'Revisado', 'Pendiente'];

/**
 * Crea cinco registros de ejemplo a partir de los que ya existen.
 * Toma la tabla con más datos, copia un registro y le cambia algunos valores
 * para que se vea como si alguien los hubiera escrito desde la página.
 */
PIA.crearEjemplos = function () {
  var todo = PIA.leerTodo();
  var tablas = Object.keys(todo).filter(function (t) { return Array.isArray(todo[t]) && todo[t].length; });
  if (!tablas.length) { PIA.toast('No hay datos base para crear ejemplos.', 'mal'); return; }
  /* la tabla con más registros suele ser la principal */
  tablas.sort(function (a, b) { return todo[b].length - todo[a].length; });
  var tabla = tablas[0];
  var base = todo[tabla];
  var creados = 0;

  for (var i = 0; i < 5; i++) {
    var modelo = base[i % base.length];
    var copia = JSON.parse(JSON.stringify(modelo));
    delete copia.id;
    delete copia.creado;
    var marca = VARIANTES[i % VARIANTES.length] + ' ' + (i + 1);
    Object.keys(copia).forEach(function (k) {
      var v = copia[k];
      if (typeof v !== 'string' || !v) return;
      var kl = k.toLowerCase();
      /* se cambian los textos visibles; los códigos y correos se dejan válidos */
      if (kl.indexOf('codigo') !== -1 || kl.indexOf('radicado') !== -1 || kl.indexOf('carnet') !== -1) {
        copia[k] = v.replace(/\d+$/, function (m) { return String(Number(m) + 100 + i); });
      } else if (kl.indexOf('correo') !== -1 || kl.indexOf('email') !== -1) {
        copia[k] = v.replace('@', '.' + (i + 1) + '@');
      } else if (kl.indexOf('fecha') !== -1) {
        var d = new Date(); d.setDate(d.getDate() + i + 1);
        copia[k] = d.toISOString().slice(0, 10);
      } else if (kl.indexOf('titulo') !== -1 || kl.indexOf('nombre') !== -1 || kl.indexOf('asunto') !== -1 || kl.indexOf('descripcion') !== -1 || kl.indexOf('mensaje') !== -1) {
        copia[k] = v + ' · ' + marca;
      }
    });
    PIA.insertar(tabla, copia);
    creados++;
  }

  PIA.brindis();
  PIA.toast('Se crearon ' + creados + ' ejemplos en la tabla "' + tabla + '".');
  setTimeout(function () { window.location.reload(); }, 900);
};

/** El botón flotante para crear los cinco ejemplos. */
function pintarBotonEjemplos() {
  if (document.getElementById('piaEjemplos')) return;
  var b = document.createElement('button');
  b.id = 'piaEjemplos';
  b.className = 'btn a';
  b.style.cssText = 'position:fixed;left:18px;bottom:18px;z-index:800;box-shadow:0 6px 20px rgba(0,0,0,.25)';
  b.innerHTML = '＋ Crear 5 ejemplos';

}

  /* el selector de rol, si está en la página */
  var selector = document.getElementById('piaRol');
  if (selector) {
    selector.value = PIA.rol;
    selector.onchange = function () { PIA.cambiarRol(selector.value); };
  }
  document.querySelectorAll('[data-solo-admin]').forEach(function (el) {
    el.classList.toggle('oculto', PIA.rol !== 'Administrador');
  });
  /* los contadores de los indicadores se animan solos */
  document.querySelectorAll('.indicador strong[data-contar]').forEach(function (el) {
    var valor = el.getAttribute('data-contar');
    var sufijo = el.getAttribute('data-sufijo') || '';
    PIA.contar(el.id, valor, sufijo);
  });
  /* las tarjetas entran con una animación suave */
  /* las tarjetas entran con una animación suave */
  document.querySelectorAll('.tarjeta, .indicador, .producto, .obra').forEach(function (el, i) {
    el.style.animation = 'aparece .34s ease-out both';
    el.style.animationDelay = Math.min(i * 0.04, 0.5) + 's';
  });
  /* el botón para crear los cinco ejemplos */
  pintarBotonEjemplos();
  /* el botón de la ficha oficial */
  pintarBotonFicha();
  /* el enlace y la página de la construcción */
  pintarEnlaceConstruccion();
  pintarConstruccion();
});


/* ==========================================================================
   galeria.js
   --------------------------------------------------------------------------
   Núcleo de la galería: obras, apoyos con voto único y publicación con
   anonimato gradual. Traduce los pasos 1 a 6 del algoritmo
   Publicar_Moderar_Y_Evolucionar_Identidad_SOMOS.
   ========================================================================== */

"use strict";

/* Apoyos que hacen falta para invitar al estudiante a revelar su nombre. */
var UMBRAL_APOYOS_CONFIANZA = 10;

/* Tipos de archivo y peso máximo que acepta la publicación. */
var TIPOS_PERMITIDOS = ["JPG", "PNG", "MP3", "MP4"];
var PESO_MAX_MB = 5;

/* Colores suaves por categoría, para distinguir la galería de un vistazo. */
var COLORES_CATEGORIA = {
  Dibujo: "#dbeafe",
  Pintura: "#fef3c7",
  "Fotografía": "#dcfce7",
  "Poesía": "#fae8ff",
  "Música": "#e0e7ff",
  Danza: "#ffe4e6",
  Audiovisual: "#cffafe",
  Narrativa: "#f1f5f9"
};

/** Devuelve un estudiante por su id. */
function estudiantePorId(id) {
  var lista = PIA.listar("estudiantes");
  for (var i = 0; i < lista.length; i++) {
    if (Number(lista[i].id) === Number(id)) return lista[i];
  }
  return null;
}

/** Escribe un texto dentro de un elemento, si existe. */
function ponerTexto(id, valor) {
  var el = document.getElementById(id);
  if (el) el.textContent = valor;
}

/** El estudiante que está usando el prototipo en esta pestaña. */
function estudianteActual() {
  var guardado = sessionStorage.getItem("somos_estudiante");
  var e = guardado ? estudiantePorId(Number(guardado)) : null;
  if (e) return e;
  var lista = PIA.listar("estudiantes");
  if (!lista.length) return null;
  sessionStorage.setItem("somos_estudiante", String(lista[0].id));
  return lista[0];
}

/** Cambia el perfil activo y repinta la página. */
function cambiarEstudiante(id) {
  sessionStorage.setItem("somos_estudiante", String(id));
  window.location.reload();
}

/** Pinta el selector de perfil que aparece en varias páginas. */
function pintarSelectorEstudiante() {
  var caja = document.getElementById("selectorEstudiante");
  if (!caja) return;
  var actual = estudianteActual();
  var lista = PIA.listar("estudiantes");
  var opciones = "";
  lista.forEach(function (e) {
    opciones += "<option value='" + e.id + "'" +
      (actual && Number(e.id) === Number(actual.id) ? " selected" : "") + ">" +
      PIA.esc(e.nombre) + " · " + PIA.esc(e.grado) + "</option>";
  });
  caja.innerHTML = "<span class='pequeno gris'>Estás como</span>" +
    "<select onchange='cambiarEstudiante(this.value)' style='max-width:330px'>" + opciones + "</select>" +
    "<span class='badge neutro'>Alias " + PIA.esc(actual ? actual.alias : "") + "</span>";
}

/** Color suave de una categoría artística. */
function colorCategoria(cat) {
  return COLORES_CATEGORIA[cat] || "#eef2f7";
}

/** Etiqueta con el color de la categoría. */
function badgeCategoria(cat) {
  return "<span class='badge' style='background:" + colorCategoria(cat) + ";color:#1f2430'>" + PIA.esc(cat) + "</span>";
}

/** Obras aprobadas, que son las que se ven en la galería. */
function obrasAprobadas() {
  return PIA.listar("obras").filter(function (o) { return o.estado === "APROBADA" && o.visibilidad === "publico"; });
}

/** Una obra por id. */
function obraPorId(id) {
  var lista = PIA.listar("obras");
  for (var i = 0; i < lista.length; i++) {
    if (Number(lista[i].id) === Number(id)) return lista[i];
  }
  return null;
}

/** El nombre público de la obra: alias o nombre real, según lo elegido. */
function autorDeObra(obra) {
  if (!obra) return "";
  return obra.autor_publico || obra.alias || "Anon";
}

/** Apoyos acumulados por una obra. */
function apoyosDeObra(obra) {
  return Number(obra && obra.total_apoyos ? obra.total_apoyos : 0);
}

/** ¿Este estudiante ya apoyó esta obra? Control de voto único. */
function yaApoyo(idObra, idEstudiante) {
  var lista = PIA.listar("apoyos");
  for (var i = 0; i < lista.length; i++) {
    if (Number(lista[i].id_obra) === Number(idObra) && Number(lista[i].id_estudiante) === Number(idEstudiante)) return true;
  }
  return false;
}

/** Tarjeta de una obra dentro de la galería. */
function tarjetaObra(o) {
  return "<article style='background:var(--blanco);border-radius:12px;box-shadow:var(--sombra);overflow:hidden;display:flex;flex-direction:column'>" +
    "<div style='height:118px;background:" + colorCategoria(o.categoria) + ";display:grid;place-items:center;position:relative'>" +
    "<span style='font-size:36px;font-weight:700;color:rgba(31,36,48,.32)'>" + PIA.esc(String(o.titulo).charAt(0)) + "</span>" +
    "<span style='position:absolute;bottom:6px;right:8px;font-size:9.5px;color:rgba(31,36,48,.5)'>SOMOS · Lola González</span>" +
    "</div>" +
    "<div style='padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1'>" +
    "<b style='font-size:14px'>" + PIA.esc(o.titulo) + "</b>" +
    "<span class='pequeno gris'>" + PIA.esc(autorDeObra(o)) + " · " + PIA.esc(o.grado) + "</span>" +
    "<div class='fila' style='gap:5px'>" + badgeCategoria(o.categoria) +
    "<span class='badge neutro'>" + PIA.esc(o.tecnica) + "</span></div>" +
    "<div class='fila' style='margin-top:auto;gap:8px;padding-top:6px'>" +
    "<span class='pequeno'>♥ " + apoyosDeObra(o) + " apoyos</span>" +
    "<button class='btn pq p' style='margin-left:auto' onclick='verObra(" + o.id + ")'>Ver obra</button>" +
    "</div></div></article>";
}

/** Llena un select con valores únicos, una sola vez. */
function llenarSelect(id, valores) {
  var sel = document.getElementById(id);
  if (!sel || sel.options.length > 1) return;
  var unicos = [];
  valores.forEach(function (v) { if (v && unicos.indexOf(v) === -1) unicos.push(v); });
  unicos.sort();
  unicos.forEach(function (v) { sel.innerHTML += "<option>" + PIA.esc(v) + "</option>"; });
}

/** Llena los filtros de la galería con los datos reales. */
function llenarFiltros() {
  var obras = PIA.listar("obras");
  llenarSelect("fCategoria", obras.map(function (o) { return o.categoria; }));
  llenarSelect("fTecnica", obras.map(function (o) { return o.tecnica; }));
  llenarSelect("fGrado", obras.map(function (o) { return o.grado; }));
}

/** Pinta la galería aplicando los filtros de categoría, técnica, grado y texto. */
function pintarGaleria() {
  var cont = document.getElementById("galeria");
  if (!cont) return;
  llenarFiltros();
  var cat = PIA.valor("fCategoria");
  var tec = PIA.valor("fTecnica");
  var grado = PIA.valor("fGrado");
  var texto = PIA.normalizar(PIA.valor("fTexto"));
  var obras = obrasAprobadas().filter(function (o) {
    if (cat && o.categoria !== cat) return false;
    if (tec && o.tecnica !== tec) return false;
    if (grado && o.grado !== grado) return false;
    if (texto && PIA.normalizar(o.titulo + " " + o.tecnica + " " + o.historia_proceso + " " + autorDeObra(o)).indexOf(texto) === -1) return false;
    return true;
  });
  var contador = document.getElementById("cuentaObras");
  if (contador) contador.textContent = obras.length;
  if (!obras.length) {
    cont.innerHTML = "<div class='vacio'>No hay obras con esos filtros. Prueba con otra categoría.</div>";
    return;
  }
  cont.innerHTML = obras.map(tarjetaObra).join("");
}

/** Abre el detalle de una obra con sus comentarios guiados. */
function verObra(id) {
  var o = obraPorId(id);
  if (!o) return;
  var cuerpo = "<div class='fila' style='margin-bottom:10px'>" + badgeCategoria(o.categoria) +
    "<span class='badge neutro'>" + PIA.esc(o.tecnica) + "</span>" +
    "<span class='badge neutro'>" + PIA.esc(o.grado) + "</span>" +
    "<span class='badge ok'>Aprobada por el docente</span></div>" +
    "<div style='height:170px;border-radius:10px;background:" + colorCategoria(o.categoria) + ";display:grid;place-items:center;margin-bottom:12px;position:relative'>" +
    "<span style='font-size:54px;color:rgba(31,36,48,.32)'>" + PIA.esc(String(o.titulo).charAt(0)) + "</span>" +
    "<span style='position:absolute;bottom:8px;right:10px;font-size:10px;color:rgba(31,36,48,.55)'>SOMOS Lola González · Autoría Protegida</span>" +
    "</div>" +
    "<p style='font-size:13px;margin-bottom:10px'>" + PIA.esc(o.historia_proceso) + "</p>" +
    "<p class='pequeno gris'><b>Texto alternativo:</b> " + PIA.esc(o.texto_alt) + "</p>" +
    "<p class='pequeno gris'>Autor: " + PIA.esc(autorDeObra(o)) + " · " + PIA.fecha(o.fecha) + " · " + apoyosDeObra(o) + " apoyos</p>" +
    "<div id='comentariosObra' style='margin-top:12px'></div>";
  var botones = "<button class='btn' onclick='PIA.cerrarModal()'>Cerrar</button>" +
    "<button class='btn p' onclick='apoyarObra(" + o.id + ")'>♥ Apoyar esta obra</button>";
  PIA.modal(o.titulo, cuerpo, botones);
  pintarComentarios(o.id);
}

/** Suma un apoyo, con control de voto único y aviso de umbral. */
function apoyarObra(id) {
  var o = obraPorId(id);
  var est = estudianteActual();
  if (!o || !est) return;
  if (Number(o.id_autor) === Number(est.id)) { PIA.toast("No puedes apoyar tu propia obra.", "warn"); return; }
  if (yaApoyo(o.id, est.id)) { PIA.toast("Ya apoyaste esta obra: es un voto por estudiante.", "warn"); return; }
  PIA.insertar("apoyos", { id_obra: o.id, id_estudiante: est.id, fecha: PIA.hoy() });
  var total = apoyosDeObra(o) + 1;
  PIA.actualizar("obras", o.id, { total_apoyos: total });
  PIA.toast("Apoyo registrado: la obra llegó a " + total + " apoyos.");
  if (document.getElementById("galeria")) pintarGaleria();
  if (document.getElementById("portafolio")) pintarPortafolio();
  verObra(o.id);
}

/** ¿El checkbox del consentimiento está marcado? */
function estaMarcado(id) {
  var el = document.getElementById(id);
  return !!(el && el.checked);
}

/** Devuelve la extensión de un archivo en mayúsculas. */
function extensionDe(nombre) {
  var partes = String(nombre || "").split(".");
  return partes.length > 1 ? partes[partes.length - 1].toUpperCase() : "";
}

/**
 * Algoritmo Publicar_Moderar_Y_Evolucionar_Identidad_SOMOS.
 * Valida el archivo, exige texto alternativo, aplica la marca de agua,
 * decide el nombre público y deja la obra en la cola de moderación.
 */
function publicarObra() {
  var est = estudianteActual();
  if (!est) { PIA.toast("No hay un perfil activo.", "mal"); return null; }

  var titulo = PIA.valor("titulo");
  var categoria = PIA.valor("categoria");
  var tecnica = PIA.valor("tecnica");
  var historia = PIA.valor("historia");
  var textoAlt = PIA.valor("textoAlt");
  var modo = PIA.valor("modoIdentidad") || "ALIAS_ANONIMO";
  var consentimiento = estaMarcado("consentimiento");

  /* 1. validar el archivo multimedia */
  var campo = document.getElementById("archivoMedia");
  var archivo = campo && campo.files && campo.files.length ? campo.files[0] : null;
  if (!archivo) { PIA.toast("Adjunta la obra: JPG, PNG, MP3 o MP4 de máximo " + PESO_MAX_MB + " MB.", "mal"); return null; }
  var extension = extensionDe(archivo.name);
  if (TIPOS_PERMITIDOS.indexOf(extension) === -1) { PIA.toast("Formato no permitido. Usa JPG, PNG, MP3 o MP4.", "mal"); return null; }
  if (Number(archivo.size) > PESO_MAX_MB * 1024 * 1024) { PIA.toast("El archivo pesa más de " + PESO_MAX_MB + " MB.", "mal"); return null; }

  /* 2. texto alternativo obligatorio por accesibilidad */
  if (!textoAlt) { PIA.toast("Por accesibilidad WCAG, describe brevemente tu obra.", "mal"); return null; }
  if (!titulo || !categoria || !tecnica) { PIA.toast("Completa el título, la categoría y la técnica.", "mal"); return null; }
  if (PIA.palabras(historia) < 10) { PIA.toast("Cuéntanos el proceso en al menos 10 palabras.", "mal"); return null; }

  /* 3 y 4. marca de agua y decisión del nombre público */
  var autorPublico = est.alias;
  if (modo === "NOMBRE_VISIBLE" && consentimiento) autorPublico = est.nombre;

  /* 5 y 6. la obra entra a la cola de moderación */
  var obra = PIA.insertar("obras", {
    id_autor: est.id,
    titulo: titulo,
    categoria: categoria,
    tecnica: tecnica,
    grado: est.grado,
    autor_publico: autorPublico,
    alias: est.alias,
    nombre_real: est.nombre,
    modo_identidad: modo,
    mostrar_nombre: autorPublico === est.nombre,
    consentimiento: !!consentimiento,
    historia_proceso: historia,
    archivo_media: String(archivo.name),
    texto_alt: textoAlt,
    visibilidad: "borrador",
    estado: "PENDIENTE_MODERACION_DOCENTE",
    total_apoyos: 0,
    marca_agua: true,
    reportada: false,
    fecha: PIA.hoy()
  });

  mostrarPublicacion(obra, extension);
  limpiarPublicar();
  if (document.getElementById("portafolio")) pintarPortafolio();
  return obra;
}

/** Muestra la trazabilidad de la publicación. */
function mostrarPublicacion(obra, extension) {
  var caja = document.getElementById("resultadoPublicacion");
  if (!caja) return;
  var modo = obra.mostrar_nombre ? "Nombre visible (con consentimiento)" : "Alias " + obra.alias;
  caja.innerHTML = "<section class='tarjeta' style='border-left:4px solid var(--ok)'>" +
    "<h2 style='color:var(--ok)'>Obra enviada a revisión</h2>" +
    "<p class='ayuda'>El docente la revisa antes de que salga a la galería. Te avisará en el portafolio.</p>" +
    "<div class='fila' style='gap:6px;flex-wrap:wrap'>" +
    "<span class='badge ok'>Archivo " + PIA.esc(extension) + " válido</span>" +
    "<span class='badge ok'>Texto alternativo</span>" +
    "<span class='badge ok'>Marca de agua aplicada</span>" +
    "<span class='badge warn'>" + PIA.esc(obra.estado.replace(/_/g, " ")) + "</span></div>" +
    "<p class='pequeno gris' style='margin-top:10px'>" + PIA.esc(modo) + " · registrada el " + PIA.fecha(obra.fecha) + ".</p>" +
    "<p class='pequeno gris'>Es tu obra, no la del docente ni la del mentor: la autoría queda en tu nombre.</p></section>";
  caja.scrollIntoView({ behavior: "smooth", block: "center" });
}

/** Deja el formulario de publicación en blanco. */
function limpiarPublicar() {
  ["titulo", "tecnica", "historia", "textoAlt"].forEach(function (id) { PIA.poner(id, ""); });
  PIA.poner("categoria", "");
  PIA.poner("modoIdentidad", "ALIAS_ANONIMO");
  var campo = document.getElementById("archivoMedia");
  if (campo) campo.value = "";
  var check = document.getElementById("consentimiento");
  if (check) check.checked = false;
}

/** Pinta los indicadores y las obras destacadas del inicio. */
function pintarInicio() {
  var obras = PIA.listar("obras");
  ponerTexto("iObras", obrasAprobadas().length);
  ponerTexto("iEstudiantes", PIA.listar("estudiantes").length);
  ponerTexto("iApoyos", obras.reduce(function (a, o) { return a + apoyosDeObra(o); }, 0));
  ponerTexto("iRetos", PIA.listar("desafios").filter(function (d) { return d.estado === "VIGENTE"; }).length);
  var cont = document.getElementById("destacadas");
  if (!cont) return;
  var top = obrasAprobadas().slice().sort(function (a, b) { return apoyosDeObra(b) - apoyosDeObra(a); }).slice(0, 3);
  cont.innerHTML = top.map(tarjetaObra).join("");
}

/** Pinta el portafolio del estudiante activo con su diario de proceso. */
function pintarPortafolio() {
  var est = estudianteActual();
  var cont = document.getElementById("portafolio");
  if (!cont || !est) return;
  var mias = PIA.listar("obras").filter(function (o) { return Number(o.id_autor) === Number(est.id); });
  var aprobadas = mias.filter(function (o) { return o.estado === "APROBADA"; });
  var apoyos = mias.reduce(function (a, o) { return a + apoyosDeObra(o); }, 0);
  ponerTexto("pObras", mias.length);
  ponerTexto("pAprobadas", aprobadas.length);
  ponerTexto("pApoyos", apoyos);

  /* aviso del paso 7: obra aprobada con 10 o más apoyos todavía en alias */
  var aviso = document.getElementById("avisoTalento");
  if (aviso) {
    var conUmbral = mias.filter(function (o) {
      return o.estado === "APROBADA" && apoyosDeObra(o) >= UMBRAL_APOYOS_CONFIANZA && !o.mostrar_nombre;
    })[0];
    aviso.innerHTML = conUmbral
      ? "<div class='aviso ok'><b>¡Tu talento inspira a la comunidad!</b> «" + PIA.esc(conUmbral.titulo) +
        "» ya tiene " + apoyosDeObra(conUmbral) + " apoyos. Si lo deseas y cuentas con permiso, puedes revelar tu nombre.</div>"
      : "";
  }

  if (!mias.length) {
    cont.innerHTML = "<div class='vacio'>Todavía no has publicado obras. Empieza con una.</div>";
  } else {
    cont.innerHTML = mias.map(function (o) {
      var puedeRevelar = o.estado === "APROBADA" && apoyosDeObra(o) >= UMBRAL_APOYOS_CONFIANZA && !o.mostrar_nombre;
      return "<div style='display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea)'>" +
        "<div style='width:64px;height:64px;border-radius:10px;background:" + colorCategoria(o.categoria) + ";display:grid;place-items:center;flex:0 0 auto'>" +
        "<b style='color:rgba(31,36,48,.4);font-size:22px'>" + PIA.esc(String(o.titulo).charAt(0)) + "</b></div>" +
        "<div style='flex:1'>" +
        "<b style='font-size:13.5px'>" + PIA.esc(o.titulo) + "</b>" +
        "<div class='fila' style='gap:5px;margin:4px 0'>" + badgeCategoria(o.categoria) +
        "<span class='badge " + (o.estado === "APROBADA" ? "ok" : o.estado === "CAMBIOS_SOLICITADOS" ? "warn" : "info") + "'>" +
        PIA.esc(o.estado.replace(/_/g, " ")) + "</span>" +
        "<span class='pequeno gris'>♥ " + apoyosDeObra(o) + "</span></div>" +
        "<span class='pequeno gris'>" + PIA.esc(autorDeObra(o)) + " · " + PIA.fecha(o.fecha) + "</span>" +
        (puedeRevelar ? "<div style='margin-top:6px'><button class='btn pq p' onclick='revelarNombre(" + o.id + ")'>Revelar mi nombre</button></div>" : "") +
        "</div></div>";
    }).join("");
  }

  var diario = document.getElementById("diario");
  if (diario) {
    var ordenadas = mias.slice().sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); });
    diario.innerHTML = ordenadas.length ? ordenadas.map(function (o) {
      return "<div style='border-left:3px solid var(--acento);padding:2px 0 2px 12px;margin-bottom:14px'>" +
        "<b style='font-size:13px'>" + PIA.esc(o.titulo) + "</b>" +
        "<p class='pequeno gris' style='margin:2px 0'>" + PIA.fecha(o.fecha) + " · " + PIA.esc(o.tecnica) + "</p>" +
        "<p class='pequeno'>" + PIA.esc(o.historia_proceso) + "</p></div>";
    }).join("") : "<div class='vacio'>El diario se llena cuando publicas.</div>";
  }

  if (document.getElementById("logros")) pintarInsignias(est.id, "logros");
  var cuenta = document.getElementById("pInsignias");
  if (cuenta) {
    var info = insigniasDe(est.id);
    var logradas = info.calculadas.filter(function (x) { return x.lograda; }).length + info.guardadas.length;
    cuenta.textContent = logradas;
  }
}

/** Deja que el estudiante revele su nombre cuando ya tiene confianza. */
function revelarNombre(id) {
  var o = obraPorId(id);
  var est = estudianteActual();
  if (!o || !est) return;
  if (!est.consentimiento || !o.consentimiento) {
    PIA.toast("Necesitas el consentimiento del acudiente para mostrar tu nombre.", "warn");
    return;
  }
  if (apoyosDeObra(o) < UMBRAL_APOYOS_CONFIANZA) {
    PIA.toast("Necesitas al menos " + UMBRAL_APOYOS_CONFIANZA + " apoyos para dar este paso.", "warn");
    return;
  }
  PIA.actualizar("obras", id, { mostrar_nombre: true, modo_identidad: "NOMBRE_VISIBLE", autor_publico: est.nombre });
  PIA.toast("Tu nombre ya aparece en la obra. Gracias por compartir tu talento.");
  pintarPortafolio();
}

/* ==========================================================================
   moderacion.js
   --------------------------------------------------------------------------
   Cola de revisión del docente: aprobar, pedir cambios y atender reportes.
   Es el paso 5 y 7 del algoritmo: nada sale a la galería sin aprobación y,
   cuando una obra con alias supera el umbral, se avisa al estudiante.
   ========================================================================== */

"use strict";

/** Obras que esperan revisión docente. */
function obrasEnCola() {
  return PIA.listar("obras").filter(function (o) {
    return o.estado === "PENDIENTE_MODERACION_DOCENTE" || o.estado === "CAMBIOS_SOLICITADOS";
  });
}

/** Etiqueta del estado de moderación. */
function badgeModeracion(estado) {
  var clase = estado === "APROBADA" ? "ok" : (estado === "CAMBIOS_SOLICITADOS" ? "warn" : "info");
  return "<span class='badge " + clase + "'>" + PIA.esc(String(estado).replace(/_/g, " ")) + "</span>";
}

/** Pinta los indicadores y la cola de moderación. */
function pintarModeracion() {
  var obras = PIA.listar("obras");
  var cola = obrasEnCola();
  ponerTexto("mPendientes", cola.length);
  ponerTexto("mAprobadas", obras.filter(function (o) { return o.estado === "APROBADA"; }).length);
  ponerTexto("mReportadas", obras.filter(function (o) { return o.reportada; }).length);
  ponerTexto("mApoyos", obras.reduce(function (a, o) { return a + Number(o.total_apoyos || 0); }, 0));

  var cont = document.getElementById("colaModeracion");
  if (cont) {
    cont.innerHTML = PIA.tabla(["Obra", "Autor", "Categoría", "Estado", "Controles", ""],
      cola.map(function (o) {
        return [
          "<b>" + PIA.esc(o.titulo) + "</b><br><span class='pequeno gris'>" + PIA.esc(o.archivo_media) + "</span>",
          PIA.esc(autorDeObra(o)) + "<br><span class='pequeno gris'>" + PIA.esc(o.grado) + "</span>",
          badgeCategoria(o.categoria),
          badgeModeracion(o.estado),
          "<span class='badge " + (o.texto_alt ? "ok" : "mal") + "'>" + (o.texto_alt ? "Texto alt" : "Sin texto alt") + "</span> " +
            "<span class='badge " + (o.marca_agua ? "ok" : "mal") + "'>" + (o.marca_agua ? "Marca de agua" : "Sin marca") + "</span>",
          "<button class='btn pq p' onclick='abrirModeracion(" + o.id + ")'>Revisar</button>"
        ];
      }),
      { vacio: "No hay obras en la cola. Todo está al día." });
  }
  pintarReportes();
}

/** Abre la ventana de revisión de una obra. */
function abrirModeracion(id) {
  var o = obraPorId(id);
  if (!o) return;
  var cuerpo = "<div class='fila' style='margin-bottom:10px'>" + badgeCategoria(o.categoria) +
    "<span class='badge neutro'>" + PIA.esc(o.tecnica) + "</span>" +
    badgeModeracion(o.estado) + "</div>" +
    "<div style='height:120px;border-radius:10px;background:" + colorCategoria(o.categoria) + ";display:grid;place-items:center;margin-bottom:12px'>" +
    "<span style='font-size:40px;color:rgba(31,36,48,.32)'>" + PIA.esc(String(o.titulo).charAt(0)) + "</span></div>" +
    "<p style='font-size:13px;margin-bottom:8px'><b>Historia:</b> " + PIA.esc(o.historia_proceso) + "</p>" +
    "<p class='pequeno gris'><b>Texto alternativo:</b> " + PIA.esc(o.texto_alt) + "</p>" +
    "<p class='pequeno gris'>Autor público: " + PIA.esc(autorDeObra(o)) + " · archivo: " + PIA.esc(o.archivo_media) + "</p>" +
    "<p class='pequeno gris'>Visibilidad: " + PIA.esc(o.visibilidad) + " · apoyos: " + apoyosDeObra(o) + "</p>" +
    (o.observacion_moderacion ? "<div class='aviso warn'>Observación anterior: " + PIA.esc(o.observacion_moderacion) + "</div>" : "");
  var botones = "<button class='btn' onclick='PIA.cerrarModal()'>Cerrar</button>" +
    "<button class='btn pel' onclick='reportarObra(" + o.id + ")'>Reportar</button>" +
    "<button class='btn' onclick='solicitarCambios(" + o.id + ")'>Pedir cambios</button>" +
    "<button class='btn p' onclick='aprobarObra(" + o.id + ")'>Aprobar</button>";
  PIA.modal("Revisar: " + o.titulo, cuerpo, botones);
}

/** Aprueba una obra y la saca a la galería. */
function aprobarObra(id) {
  var o = obraPorId(id);
  if (!o) return;
  PIA.actualizar("obras", id, {
    estado: "APROBADA",
    visibilidad: "publico",
    observacion_moderacion: "",
    fecha_aprobacion: PIA.hoy()
  });
  PIA.toast("Obra aprobada y publicada en la galería.");
  /* paso 7: aviso motivador al estudiante que sigue en alias */
  if (o.modo_identidad === "ALIAS_ANONIMO" && Number(o.total_apoyos || 0) >= UMBRAL_APOYOS_CONFIANZA) {
    PIA.actualizar("obras", id, { notificado_talento: true });
    PIA.toast("Además, la obra supera los " + UMBRAL_APOYOS_CONFIANZA + " apoyos: su autor ya puede revelar su nombre.", "warn");
  }
  PIA.cerrarModal();
  pintarModeracion();
  if (document.getElementById("galeria")) pintarGaleria();
  if (document.getElementById("destacadas")) pintarInicio();
  if (document.getElementById("portafolio")) pintarPortafolio();
}

/** Pide cambios al estudiante con una observación escrita. */
function solicitarCambios(id) {
  var o = obraPorId(id);
  if (!o) return;
  var motivo = window.prompt("¿Qué debe ajustar el estudiante? (título, texto alternativo, historia, pertinencia)");
  if (motivo === null) return;
  PIA.actualizar("obras", id, {
    estado: "CAMBIOS_SOLICITADOS",
    visibilidad: "borrador",
    observacion_moderacion: String(motivo || "Revisa la descripción de la obra.")
  });
  PIA.toast("Se pidieron cambios y la obra volvió al portafolio del estudiante.");
  PIA.cerrarModal();
  pintarModeracion();
}

/** Reporta una obra y la bloquea preventivamente en la galería. */
function reportarObra(id) {
  var o = obraPorId(id);
  if (!o) return;
  var motivo = window.prompt("Motivo del reporte (contenido ofensivo, datos personales, plagio...)");
  if (motivo === null) return;
  PIA.actualizar("obras", id, {
    reportada: true,
    motivo_reporte: String(motivo || "Reporte sin detalle"),
    visibilidad: "grupo",
    fecha_reporte: PIA.hoy()
  });
  PIA.toast("Obra bloqueada preventivamente. Queda en la lista de reportes.", "warn");
  PIA.cerrarModal();
  pintarModeracion();
  if (document.getElementById("galeria")) pintarGaleria();
}

/** Quita el reporte cuando ya se revisó y no había problema. */
function quitarReporte(id) {
  PIA.actualizar("obras", id, { reportada: false, motivo_reporte: "", visibilidad: "publico" });
  PIA.toast("Reporte retirado: la obra vuelve a la galería.");
  pintarModeracion();
  if (document.getElementById("galeria")) pintarGaleria();
}

/** Pinta la lista de obras reportadas. */
function pintarReportes() {
  var cont = document.getElementById("reportes");
  if (!cont) return;
  var reportadas = PIA.listar("obras").filter(function (o) { return o.reportada; });
  cont.innerHTML = PIA.tabla(["Obra", "Motivo", "Fecha", "Estado", ""],
    reportadas.map(function (o) {
      return [
        "<b>" + PIA.esc(o.titulo) + "</b><br><span class='pequeno gris'>" + PIA.esc(autorDeObra(o)) + "</span>",
        PIA.esc(o.motivo_reporte || "Sin detalle"),
        PIA.fecha(o.fecha_reporte),
        badgeModeracion(o.estado),
        "<div class='acciones'><button class='btn pq' onclick='quitarReporte(" + o.id + ")'>Retirar reporte</button>" +
          "<button class='btn pq p' onclick='abrirModeracion(" + o.id + ")'>Revisar</button></div>"
      ];
    }),
    { vacio: "No hay reportes abiertos." });
}

/* Arranque del panel de moderación. */
document.addEventListener("DOMContentLoaded", function () {
  if (!document.getElementById("colaModeracion")) return;
  pintarModeracion();
});

/* ==========================================================================
   comentarios-guiados.js
   --------------------------------------------------------------------------
   Comentarios positivos guiados: plantillas que obligan a hablar de la obra y
   no de la persona. Es la defensa contra el ciberacoso que pide el PDF.
   ========================================================================== */

"use strict";

/* Las plantillas aprobadas por el equipo. Todas empiezan por una observación. */
var PLANTILLAS_COMENTARIO = [
  "Destaco tu manejo del color porque ",
  "Esta obra me transmite ",
  "Me impresionó la composición, sobre todo ",
  "La técnica que usaste en ",
  "Se nota el proceso detrás de ",
  "Quiero ver más de tu trabajo porque "
];

/* Palabras que convierten una crítica en un ataque personal. */
var PALABRAS_ATAQUE = ["feo", "horrible", "basura", "chiste", "copia", "plagio", "tonto", "bruto", "no sirve", "asqueroso"];

/** Devuelve los comentarios de una obra. */
function comentariosDe(idObra) {
  return PIA.listar("comentarios")
    .filter(function (c) { return Number(c.id_obra) === Number(idObra); })
    .sort(function (a, b) { return String(a.fecha).localeCompare(String(b.fecha)); });
}

/** Devuelve la plantilla con la que empieza un comentario, o null. */
function plantillaDe(texto) {
  for (var i = 0; i < PLANTILLAS_COMENTARIO.length; i++) {
    if (String(texto).indexOf(PLANTILLAS_COMENTARIO[i]) === 0) return PLANTILLAS_COMENTARIO[i];
  }
  return null;
}

/**
 * Valida un comentario: mínimo de palabras, sin enlaces, sin ataques y
 * empezando por una plantilla positiva.
 */
function validarComentario(texto) {
  var limpio = PIA.normalizar(texto);
  if (PIA.palabras(texto) < 6) return "Escribe al menos 6 palabras: un comentario corto no ayuda a nadie.";
  if (limpio.indexOf("http") !== -1) return "No se permiten enlaces en los comentarios.";
  for (var i = 0; i < PALABRAS_ATAQUE.length; i++) {
    if (limpio.indexOf(PALABRAS_ATAQUE[i]) !== -1) {
      return "Ese comentario puede herir a la persona. Cambia la crítica por una sugerencia sobre la obra.";
    }
  }
  if (!plantillaDe(texto)) return "Empieza con una de las plantillas positivas para mantener el tono constructivo.";
  return null;
}

/** Pinta los comentarios y el formulario guiado dentro de la ventana de la obra. */
function pintarComentarios(idObra) {
  var caja = document.getElementById("comentariosObra");
  if (!caja) return;
  var lista = comentariosDe(idObra);
  var html = "<h3>Comentarios guiados (" + lista.length + ")</h3>";
  if (!lista.length) {
    html += "<p class='pequeno gris'>Todavía nadie ha comentado. Sé la primera voz que anima.</p>";
  } else {
    lista.forEach(function (c) {
      html += "<div style='background:#f8fafc;border-radius:9px;padding:9px 12px;margin-bottom:8px'>" +
        "<b class='pequeno'>" + PIA.esc(c.autor_publico) + "</b>" +
        "<span class='pequeno gris'> · " + PIA.fecha(c.fecha) + "</span>" +
        "<p class='pequeno' style='margin-top:3px'>" + PIA.esc(c.texto) + "</p></div>";
    });
  }
  html += "<div class='campo' style='margin-top:10px'><label for='nuevoComentario'>Tu comentario positivo</label>" +
    "<textarea id='nuevoComentario' placeholder='Elige una plantilla y completa la idea'></textarea>" +
    "<span class='pista'>Se habla de la obra, nunca de la persona.</span></div>";
  html += "<div class='fila' style='gap:6px;flex-wrap:wrap'>";
  PLANTILLAS_COMENTARIO.forEach(function (p, i) {
    html += "<button class='btn pq' onclick='elegirPlantilla(" + i + ")'>" + PIA.esc(p.trim()) + "</button>";
  });
  html += "</div>";
  html += "<button class='btn p' style='margin-top:10px' onclick='enviarComentario(" + idObra + ")'>Publicar comentario</button>";
  caja.innerHTML = html;
}

/** Copia una plantilla al campo de texto. */
function elegirPlantilla(indice) {
  var plantilla = PLANTILLAS_COMENTARIO[indice];
  if (!plantilla) return;
  PIA.poner("nuevoComentario", plantilla);
  var campo = document.getElementById("nuevoComentario");
  if (campo) campo.focus();
}

/** Guarda un comentario validado. */
function enviarComentario(idObra) {
  var texto = PIA.valor("nuevoComentario");
  var error = validarComentario(texto);
  if (error) { PIA.toast(error, "mal"); return; }
  var est = estudianteActual();
  if (!est) { PIA.toast("No hay un perfil activo.", "mal"); return; }
  PIA.insertar("comentarios", {
    id_obra: idObra,
    id_estudiante: est.id,
    autor_publico: est.alias,
    plantilla: plantillaDe(texto),
    texto: texto,
    fecha: PIA.hoy()
  });
  PIA.toast("Comentario publicado. Así se construye comunidad.");
  pintarComentarios(idObra);
}

/* ==========================================================================
   gamificacion.js
   --------------------------------------------------------------------------
   Desafíos semanales, participaciones e insignias. La gamificación premia la
   constancia y la colaboración, no solo la cantidad de "me gusta".
   ========================================================================== */

"use strict";

/** El reto que está vigente. */
function desafioVigente() {
  var lista = PIA.listar("desafios").filter(function (d) { return d.estado === "VIGENTE"; });
  return lista.length ? lista[lista.length - 1] : null;
}

/** ¿El estudiante ya se inscribió en el reto? */
function yaParticipa(desafio, idEstudiante) {
  if (!desafio) return false;
  var ids = (desafio.participantes_ids || []).map(function (x) { return Number(x); });
  return ids.indexOf(Number(idEstudiante)) !== -1;
}

/** Tarjeta del reto vigente en la portada. */
function pintarRetosInicio() {
  var caja = document.getElementById("retoInicio");
  if (!caja) return;
  var d = desafioVigente();
  if (!d) { caja.innerHTML = "<div class='vacio'>No hay retos vigentes esta semana.</div>"; return; }
  caja.innerHTML = "<h3 style='font-size:16px;margin-bottom:6px'>" + PIA.esc(d.titulo) + "</h3>" +
    "<p class='pequeno gris'>" + PIA.esc(d.descripcion) + "</p>" +
    "<div class='fila' style='margin-top:10px;gap:6px'>" + badgeCategoria(d.categoria) +
    "<span class='badge warn'>Hasta " + PIA.fecha(d.fecha_fin) + "</span>" +
    "<span class='badge neutro'>" + Number(d.participantes || 0) + " participantes</span>" +
    "<span class='badge info'>" + PIA.esc(d.insignia) + "</span></div>" +
    "<a class='btn p' style='margin-top:12px' href='desafios.html'>Ver los retos</a>";
}

/** Pinta la lista completa de desafíos con su avance. */
function pintarDesafios() {
  var cont = document.getElementById("desafios");
  var est = estudianteActual();
  if (!cont) return;
  var lista = PIA.listar("desafios");
  if (!lista.length) { cont.innerHTML = "<div class='vacio'>Todavía no hay retos publicados.</div>"; return; }
  cont.innerHTML = lista.map(function (d) {
    var inscrito = est && yaParticipa(d, est.id);
    var meta = Number(d.meta || 20);
    var pct = Math.min(100, Math.round(Number(d.participantes || 0) / meta * 100));
    var boton;
    if (d.estado !== "VIGENTE") boton = "<span class='badge neutro'>Reto cerrado</span>";
    else if (inscrito) boton = "<span class='badge ok'>Ya estás participando</span>";
    else boton = "<button class='btn p' onclick='participarDesafio(" + d.id + ")'>Participar en el reto</button>";
    return "<section class='tarjeta' style='margin-bottom:12px'>" +
      "<div class='fila'><h2 style='margin:0;font-size:16px'>" + PIA.esc(d.titulo) + "</h2>" +
      "<span class='badge " + (d.estado === "VIGENTE" ? "ok" : "neutro") + "' style='margin-left:auto'>" + PIA.esc(d.estado) + "</span></div>" +
      "<p class='ayuda' style='margin:6px 0 10px'>" + PIA.esc(d.descripcion) + "</p>" +
      "<div class='fila' style='gap:6px'>" + badgeCategoria(d.categoria) +
      "<span class='badge neutro'>" + PIA.fecha(d.fecha_inicio) + " a " + PIA.fecha(d.fecha_fin) + "</span>" +
      "<span class='badge info'>" + PIA.esc(d.insignia) + "</span>" +
      "<span class='badge warn'>" + Number(d.puntos || 0) + " puntos</span></div>" +
      "<div class='barra' style='margin:12px 0 6px'><i style='width:" + pct + "%'></i></div>" +
      "<p class='pequeno gris'>" + Number(d.participantes || 0) + " de " + meta + " estudiantes ya participan.</p>" +
      "<div class='fila' style='margin-top:8px'>" + boton + "</div></section>";
  }).join("");
  if (est && document.getElementById("misInsignias")) pintarInsignias(est.id, "misInsignias");
}

/** Inscribe al estudiante activo en un reto vigente. */
function participarDesafio(id) {
  var d = PIA.listar("desafios").filter(function (x) { return Number(x.id) === Number(id); })[0];
  var est = estudianteActual();
  if (!d || !est) return;
  if (d.estado !== "VIGENTE") { PIA.toast("Ese reto ya cerró.", "warn"); return; }
  if (yaParticipa(d, est.id)) { PIA.toast("Ya estás participando en este reto.", "warn"); return; }
  var ids = (d.participantes_ids || []).map(function (x) { return Number(x); });
  ids.push(Number(est.id));
  PIA.actualizar("desafios", d.id, { participantes_ids: ids, participantes: ids.length });
  PIA.toast("¡Inscrito! Sube tu obra del reto desde Publicar.");
  pintarDesafios();
}

/** Calcula las insignias de un estudiante a partir de sus datos. */
function insigniasDe(idEstudiante) {
  var obras = PIA.listar("obras").filter(function (o) { return Number(o.id_autor) === Number(idEstudiante); });
  var aprobadas = obras.filter(function (o) { return o.estado === "APROBADA"; });
  var apoyos = obras.reduce(function (a, o) { return a + Number(o.total_apoyos || 0); }, 0);
  var comentarios = PIA.listar("comentarios").filter(function (c) { return Number(c.id_estudiante) === Number(idEstudiante); }).length;
  var retos = PIA.listar("desafios").filter(function (d) { return yaParticipa(d, idEstudiante); }).length;
  var calculadas = [
    { nombre: "Primera obra", lograda: obras.length >= 1, detalle: "Publicaste tu primera obra." },
    { nombre: "Tres obras", lograda: obras.length >= 3, detalle: "Tu portafolio ya tiene tres obras." },
    { nombre: "Voz positiva", lograda: comentarios >= 1, detalle: "Comentaste el trabajo de otra persona." },
    { nombre: "Reto cumplido", lograda: retos >= 1, detalle: "Participaste en un desafío semanal." },
    { nombre: "Diez apoyos", lograda: apoyos >= UMBRAL_APOYOS_CONFIANZA, detalle: "Tus obras suman diez apoyos." }
  ];
  var guardadas = PIA.listar("insignias").filter(function (i) { return Number(i.id_estudiante) === Number(idEstudiante); });
  return { calculadas: calculadas, guardadas: guardadas, obras: obras, aprobadas: aprobadas, apoyos: apoyos };
}

/** Pinta las insignias calculadas y las que ya estaban en el registro. */
function pintarInsignias(idEstudiante, contenedorId) {
  var cont = document.getElementById(contenedorId || "logros");
  if (!cont) return;
  var info = insigniasDe(idEstudiante);
  var html = "";
  info.calculadas.forEach(function (i) {
    html += "<div style='border:1px solid var(--linea);border-radius:10px;padding:11px 13px;background:" +
      (i.lograda ? "#f0fdf4" : "var(--blanco)") + "'>" +
      "<div class='fila' style='gap:6px'><span class='badge " + (i.lograda ? "ok" : "neutro") + "'>" +
      (i.lograda ? "✔" : "○") + "</span><b style='font-size:13px'>" + PIA.esc(i.nombre) + "</b></div>" +
      "<p class='pequeno gris' style='margin-top:4px'>" + PIA.esc(i.detalle) + "</p></div>";
  });
  info.guardadas.forEach(function (i) {
    html += "<div style='border:1px solid var(--linea);border-radius:10px;padding:11px 13px;background:#fffbeb'>" +
      "<div class='fila' style='gap:6px'><span class='badge warn'>★</span><b style='font-size:13px'>" + PIA.esc(i.nombre) + "</b></div>" +
      "<p class='pequeno gris' style='margin-top:4px'>" + PIA.esc(i.descripcion) + " · " + PIA.fecha(i.fecha) + "</p></div>";
  });
  cont.innerHTML = html || "<div class='vacio'>Aún no tienes insignias. Publica tu primera obra.</div>";
}

/* Arranque de la página de desafíos y de la portada. */
document.addEventListener("DOMContentLoaded", function () {
  if (document.getElementById("desafios")) pintarDesafios();
  if (document.getElementById("retoInicio")) pintarRetosInicio();
});

/* ==========================================================================
   mentor-art.js

   Mentor Art simulado con reglas: sugiere técnicas y preguntas según la

   ========================================================================== */

"use strict";

/* Tres sugerencias por categoría, escritas por el equipo. */
var SUGERENCIAS_ARTE = {

    "Antes de sombrear decide de dónde viene la luz y marca esa zona con un trazo muy suave.",

  ],
  Pintura: [

    "Deja secar cada capa antes de la siguiente y prueba la mezcla en un papel aparte.",
    "Elige tres colores principales y un cuarto color de acento para que la obra respire."
  ],
  "Fotografía": [

    "Limpia el lente antes de disparar y sostén el celular con las dos manos para evitar el movimiento.",

    "Lee el poema en voz alta: donde te falte el aire, sobra una palabra.",
    "Cambia los adjetivos obvios por imágenes concretas: no digas tristeza, describe el objeto que la guarda.",
    "Escribe primero sin rima y con rima después; la rima no puede mandar sobre lo que quieres decir."
  ],
  "Música": [
    "Graba la idea con el celular antes de olvidarla; después decide el tempo y la tonalidad.",
