<script id="piaCss" type="text/plain">/* ==========================================================================
   R.A.D.E — hoja de estilos
   PIA 2026 · I.E. Lola González · Grado 10° · Grupo 10°05
   --------------------------------------------------------------------------
   Estilo: 05-calido
   Este archivo se arma con dos partes:
     1. el carácter del proyecto (colores, tipografía, formas, detalles)
     2. la base estructural que comparten los nueve proyectos
   Cambiando las variables de :root cambia todo el aspecto sin tocar el resto.
   ========================================================================== */
/* ==========================================================================
   BASE ESTRUCTURAL — la comparten los nueve proyectos.
   Aquí va solo la ESTRUCTURA y los componentes. Los colores, la tipografía,
   las formas y el menú los pone el tema de cada proyecto.
   ========================================================================== */

/* ---- 1. reinicio ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; font-family: var(--fuente); color: var(--tinta); background: var(--fondo); line-height: 1.6; }
img { max-width: 100%; display: block; }
a { color: var(--acento-texto, var(--primario)); text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- 2. armazón: cuatro formas de organizar la página ---- */
/* Cada proyecto usa una: barra arriba, menú lateral, pestañas abajo o mixto. */
.armazon { display: grid; min-height: 100vh; grid-template-columns: 1fr; }

/* (a) barra arriba: el menú va debajo de la cabecera */
.layout-top .armazon {
  grid-template-areas: 'cab' 'menu' 'con' 'pie';
  grid-template-rows: auto auto 1fr auto;
}

/* (b) menú lateral: una columna fija a la izquierda */
.layout-sidebar .armazon {
  grid-template-areas: 'cab cab' 'menu con' 'pie pie';
  grid-template-columns: var(--ancho-menu) 1fr;
  grid-template-rows: auto 1fr auto;
}

/* (c) pestañas abajo: como una aplicación de teléfono */
.layout-tabs .armazon {
  grid-template-areas: 'cab' 'con' 'tabs';
  grid-template-rows: auto 1fr auto;
}

.barra-sup { grid-area: cab; }
.menu { grid-area: menu; }
.contenido { grid-area: con; }
.pie { grid-area: pie; }
.menu-tabs { grid-area: tabs; }

/* ---- 3. barra superior ---- */
.barra-sup { display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 60; background: var(--barra-fondo); color: var(--barra-tinta); backdrop-filter: blur(8px); }
.layout-sidebar .barra-sup, .layout-split .barra-sup { grid-column: 1 / -1; }
.marca { display: flex; align-items: center; gap: 12px; color: inherit; }
.marca-logo { width: 46px; height: 46px; object-fit: contain; border-radius: var(--radio-logo); background: var(--logo-fondo); padding: 4px; flex: none; }
.marca-texto b { display: block; font-size: 15.5px; line-height: 1.15; letter-spacing: var(--letra-titulo); }
.marca-texto span { font-size: 11px; opacity: .72; }

/* ---- 4. menú ---- */
/* (a) y (c): barra horizontal bajo la cabecera */
.layout-top .menu { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px clamp(14px, 3vw, 34px); background: var(--barra-fondo); border-bottom: 1px solid var(--linea); }

/* (b) menú lateral: columna completa */
.layout-sidebar .menu { display: flex; flex-direction: column; gap: 3px; padding: 16px 12px; background: var(--superficie); border-right: 1px solid var(--linea); }
.menu a { padding: 8px 14px; border-radius: var(--radio-boton); font-size: var(--menu-tam); font-weight: var(--menu-peso); color: inherit; opacity: .74; white-space: nowrap; transition: background .18s, opacity .18s, transform .18s; }
.menu a:hover { opacity: 1; background: var(--menu-hover); }
.menu a.activo { opacity: 1; background: var(--menu-activo-fondo); color: var(--menu-activo-tinta); box-shadow: var(--menu-activo-sombra); }

/* el menú lateral ocupa todo el ancho de su columna */
.layout-sidebar .menu a { width: 100%; }

/* menú inferior tipo aplicación */
.menu-tabs { position: sticky; bottom: 0; z-index: 60; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--barra-fondo); border-top: 1px solid var(--linea); }
.menu-tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px; border-radius: 12px; font-size: 10.5px; color: var(--barra-tinta); opacity: .6; }
.menu-tabs a b { font-size: 17px; font-weight: 400; line-height: 1; }
.menu-tabs a.activo { opacity: 1; background: var(--menu-activo-fondo); color: var(--menu-activo-tinta); }

/* ---- 5. contenido ---- */
.contenido { padding: var(--espacio) clamp(14px, 3vw, 34px) calc(var(--espacio) * 2); max-width: var(--ancho-contenido); width: 100%; margin: 0 auto; }
.volanta { display: flex; align-items: center; gap: 10px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--acento-texto); margin-bottom: 8px; }
.volanta::before { content: ''; width: 26px; height: 2px; background: currentColor; border-radius: 2px; }

/* ---- 6. pie ---- */
.pie { padding: 26px 20px; text-align: center; font-size: 12px; color: var(--pie-tinta); background: var(--pie-fondo); border-top: 1px solid var(--linea); }
.pie .equipo { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.pie .equipo span { background: var(--chip-fondo); padding: 3px 11px; border-radius: 20px; font-size: 11px; }
.pie .linea { margin-top: 5px; opacity: .82; }

/* ---- 7. tarjetas ---- */
.tarjeta { background: var(--superficie); border: var(--borde-tarjeta); border-radius: var(--radio-tarjeta); box-shadow: var(--sombra); padding: clamp(16px, 2vw, 24px); margin-bottom: 18px; position: relative; transition: box-shadow .2s, transform .2s; }
.tarjeta:hover { box-shadow: var(--sombra-alta); }
.tarjeta > h2 { font-size: var(--h2); margin-bottom: 4px; letter-spacing: var(--letra-titulo); }
.tarjeta > h2 + .ayuda { margin-top: 0; }
.tarjeta .ayuda { font-size: 13.5px; color: var(--gris); margin-bottom: 16px; }
.tarjeta h3 { font-size: 14.5px; margin: 18px 0 8px; }
.tarjeta.destacada { border: var(--borde-destacado); }

/* ---- 8. rejillas ---- */
.rejilla { display: grid; gap: var(--hueco); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }

/* ---- 9. formularios ---- */
.campo { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
.campo label { font-size: 12.5px; font-weight: var(--label-peso); color: var(--label-color); letter-spacing: .01em; }
.campo label .req { color: var(--peligro); }
.campo input, .campo select, .campo textarea { width: 100%; border: var(--borde-campo); border-radius: var(--radio-campo); padding: 10px 13px; background: var(--campo-fondo); color: var(--tinta); transition: border-color .16s, box-shadow .16s; }
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--primario); box-shadow: 0 0 0 3px var(--foco); }
.campo textarea { min-height: 92px; resize: vertical; }
.campo .pista { font-size: 11.5px; color: var(--gris); }

/* ---- 10. botones ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: var(--borde-boton); background: var(--boton-fondo); color: var(--boton-tinta); border-radius: var(--radio-boton); padding: 10px 18px; font-size: 13.5px; font-weight: var(--boton-peso); cursor: pointer; text-decoration: none; transition: transform .14s, box-shadow .14s, background .14s, border-color .14s; letter-spacing: var(--letra-boton); }
.btn:hover { transform: var(--boton-hover); box-shadow: var(--sombra); }
.btn:active { transform: translateY(0) scale(.985); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.p { background: var(--primario); border-color: var(--primario); color: var(--primario-tinta); }
.btn.a { background: var(--acento); border-color: var(--acento); color: var(--acento-tinta); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.pel { background: var(--peligro); border-color: var(--peligro); color: #fff; }
.btn.fantasma { background: transparent; border-color: var(--linea-fuerte); }
.btn.pq { padding: 5px 11px; font-size: 12px; }
.btn.gr { width: 100%; }

/* ---- 11. tablas ---- */
.tabla-envoltura { overflow-x: auto; border-radius: var(--radio-tabla); border: 1px solid var(--linea); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--superficie); }
th, td { padding: 10px 13px; text-align: left; border-bottom: 1px solid var(--linea); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--th-tinta); background: var(--th-fondo); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .12s; }
tbody tr:hover td { background: var(--fila-hover); }
td .acciones { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---- 12. etiquetas de estado ---- */
.badge { display: inline-block; padding: 2px 10px; border-radius: var(--radio-badge); font-size: 11.5px; font-weight: 700; white-space: nowrap; letter-spacing: .01em; }
.badge.ok, .badge.ok { background: var(--ok-suave); color: var(--ok-texto); }
.badge.warn { background: var(--alerta-suave); color: var(--alerta-texto); }
.badge.mal { background: var(--peligro-suave); color: var(--peligro-texto); }
.badge.info { background: var(--info-suave); color: var(--info-texto); }
.badge.neutro { background: var(--neutro-suave); color: var(--gris); }

/* ---- 13. avisos ---- */
.aviso { border-left: var(--aviso-grosor) solid var(--info); background: var(--info-suave); padding: 12px 16px; border-radius: 0 var(--radio-campo) var(--radio-campo) 0; font-size: 13.5px; margin-bottom: 15px; }
.aviso.ok { border-color: var(--ok); background: var(--ok-suave); color: var(--ok-texto); }
.aviso.mal { border-color: var(--peligro); background: var(--peligro-suave); color: var(--peligro-texto); }
.aviso.warn { border-color: var(--alerta); background: var(--alerta-suave); color: var(--alerta-texto); }

/* ---- 14. indicadores ---- */
.indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: var(--hueco); margin-bottom: 20px; }
.indicador { background: var(--superficie); border-radius: var(--radio-tarjeta); padding: 16px 18px; border: var(--borde-tarjeta); box-shadow: var(--sombra); position: relative; overflow: hidden; }
.indicador b { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--gris); font-weight: 700; }
.indicador strong { display: block; font-size: clamp(24px, 3vw, 32px); color: var(--primario); line-height: 1.15; letter-spacing: -0.02em; }
.indicador span { font-size: 11.5px; color: var(--gris); }

/* ---- 15. aviso flotante ---- */
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 900; background: var(--ok); color: #fff; padding: 13px 20px; border-radius: var(--radio-toast); font-size: 13.5px; box-shadow: var(--sombra-alta); max-width: min(380px, calc(100vw - 40px)); animation: toastEntra .26s cubic-bezier(.2,.9,.3,1.2); }
.toast.mal { background: var(--peligro); }
.toast.warn { background: var(--alerta); }
@keyframes toastEntra { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }

/* ---- 16. ventana ---- */
.modal-fondo { position: fixed; inset: 0; background: rgba(8, 12, 22, .55); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; backdrop-filter: blur(3px); animation: funde .18s; }
@keyframes funde { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--superficie); border-radius: var(--radio-modal); width: 100%; max-width: 640px; box-shadow: var(--sombra-alta); animation: sube .22s cubic-bezier(.2,.9,.3,1.1); }
@keyframes sube { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
.modal .cabeza { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--linea); }
.modal .cabeza h3 { font-size: 16px; margin: 0; }
.modal .cuerpo { padding: 18px 20px; max-height: 66vh; overflow-y: auto; }
.modal .pie2 { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 20px; border-top: 1px solid var(--linea); background: var(--fondo); border-radius: 0 0 var(--radio-modal) var(--radio-modal); }
.cerrar { border: 0; background: transparent; font-size: 16px; cursor: pointer; color: var(--gris); padding: 5px 9px; border-radius: 8px; }
.cerrar:hover { background: var(--fila-hover); }

/* ---- 17. barra de progreso ---- */
.barra { height: 9px; background: var(--linea); border-radius: 20px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--primario); border-radius: 20px; transition: width .5s cubic-bezier(.3,.9,.3,1); }

/* ---- 18. utilidades ---- */
.fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.derecha { margin-left: auto; }
.centro { text-align: center; }
.gris { color: var(--gris); }
.pequeno { font-size: 12px; }
.mono { font-family: var(--fuente-mono); letter-spacing: .04em; }
.vacio { text-align: center; color: var(--gris); padding: 30px 20px; font-size: 13.5px; }
.vacio::before { content: '○'; display: block; font-size: 30px; opacity: .4; margin-bottom: 6px; }
.oculto-impresion { }

/* ---- 18b. bloque de pseudocódigo ---- */
.codigo {
  background: var(--superficie); border: var(--borde-tarjeta); border-radius: var(--radio-tarjeta);
  padding: 16px 18px; overflow-x: auto; margin: 0;
  font-family: var(--fuente-mono); font-size: 12.5px; line-height: 1.7;
  white-space: pre; color: var(--tinta); tab-size: 2;
}

/* ---- 19. animaciones de entrada ---- */
@keyframes aparece { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.anim { animation: aparece .34s ease-out both; }

/* ---- 20. adaptación ---- */
@media (max-width: 900px) {
  /* en pantallas pequeñas el menú lateral se vuelve una barra arriba */
  .layout-sidebar .armazon { grid-template-areas: 'cab' 'menu' 'con' 'pie'; grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
  .layout-sidebar .menu { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--linea); padding: 8px 12px; }
  .layout-sidebar .menu a { width: auto; padding: 8px 13px; white-space: nowrap; }
}
@media (max-width: 640px) {
  .contenido { padding: 16px 13px 46px; }
  .barra-sup { padding: 9px 13px; gap: 9px; }
  .marca-logo { width: 38px; height: 38px; }
  .marca-texto b { font-size: 14px; }
  .menu { width: 100%; margin-left: 0; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 3px; }
  .btn { width: 100%; }
  .fila .btn { width: auto; }
}
@media print {
  .barra-sup, .pie, .menu, .menu-tabs, .btn, .toast, .modal-fondo, .no-impresion { display: none !important; }
  body { background: #fff; }
  .tarjeta { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
}

/* ==========================================================================
   TEMA CÁLIDO — R.A.D.E (PAE)
   Comida y cuidado: verde oliva y naranja, formas muy redondeadas y un menú
   inferior tipo aplicación móvil. Se siente cercano y amable.
   ========================================================================== */
:root {
  --fuente: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --fuente-mono: 'Cascadia Mono', Consolas, monospace;
  --tinta: #24331b;
  --fondo: #f3f8ec;
  --superficie: #ffffff;
  --gris: #6d7f60;
  --linea: #dcebd1;
  --linea-fuerte: #c3dcb0;

  --primario: #4d7c0f;
  --primario-tinta: #ffffff;
  --acento: #f97316;
  --acento-tinta: #ffffff;
  --acento-texto: #c2410c;

  --ok: #15803d;  --ok-suave: #dcfce7;  --ok-texto: #14532d;
  --alerta: #c2410c;  --alerta-suave: #ffedd5;  --alerta-texto: #7c2d12;
  --peligro: #b91c1c;  --peligro-suave: #fee2e2;  --peligro-texto: #7f1d1d;
  --info: #0e7490;  --info-suave: #cffafe;  --info-texto: #155e75;
  --neutro-suave: #eef4e6;

  --barra-fondo: #ffffff;  --barra-tinta: #24331b;
  --menu-hover: #f3f8ec;  --menu-activo-fondo: #4d7c0f;  --menu-activo-tinta: #ffffff;
  --menu-activo-sombra: 0 4px 12px rgba(77,124,15,.3);
  --pie-fondo: #24331b;  --pie-tinta: #c8d8ba;  --chip-fondo: rgba(255,255,255,.1);

  --radio-tarjeta: 22px;  --radio-boton: 999px;  --radio-campo: 16px;
  --radio-modal: 24px;  --radio-tabla: 18px;  --radio-badge: 999px;
  --radio-toast: 999px;  --radio-logo: 22px;

  --sombra: 0 2px 10px rgba(36,51,27,.08);
  --sombra-alta: 0 16px 40px rgba(36,51,27,.18);
  --borde-tarjeta: 1px solid #e2efd7;
  --borde-destacado: 2px solid #4d7c0f;
  --borde-campo: 1px solid #cfe4bd;
  --borde-boton: 1px solid #ddecd2;
  --campo-fondo: #fbfdf8;
  --th-fondo: #f0f7e8;  --th-tinta: #6d7f60;
  --fila-hover: #f8fcf4;
  --foco: rgba(77,124,15,.22);
  --logo-fondo: #ffffff;

  --boton-fondo: #ffffff;  --boton-tinta: #24331b;  --boton-peso: 700;
  --boton-hover: translateY(-2px);  --letra-boton: .01em;
  --h2: 18px;  --letra-titulo: -.01em;
  --menu-tam: 12px;  --menu-peso: 700;
  --label-peso: 700;  --label-color: #4d6238;
  --espacio: 24px;  --hueco: 16px;
  --ancho-contenido: 1080px;  --ancho-menu: 240px;
  --aviso-grosor: 4px;
}

body { font-size: 15px; }

/* el menú va abajo, como en una aplicación de teléfono */
.layout-tabs .barra-sup { border-bottom: 1px solid #e2efd7; }
.menu-tabs { padding: 10px 8px calc(10px + env(safe-area-inset-bottom)); }
.menu-tabs a { border-radius: 16px; }
.menu-tabs a b { font-size: 20px; }

/* portada con forma de bandeja */
.portada { background: linear-gradient(140deg, #4d7c0f 0%, #65a30d 55%, #f97316 190%); color: #fff;
  border-radius: 26px; padding: clamp(22px, 4vw, 38px); margin-bottom: 22px; position: relative; overflow: hidden; }
.portada::after { content: '🍽'; position: absolute; right: 18px; bottom: -18px; font-size: 120px; opacity: .12; line-height: 1; }
.portada h1 { font-size: clamp(23px, 3.6vw, 33px); line-height: 1.16; margin-bottom: 8px; letter-spacing: -.02em; position: relative; }
.portada p { color: rgba(255,255,255,.94); max-width: 58ch; position: relative; }
.portada .sellos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; position: relative; }
.portada .sello { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.34); padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; }

/* la tarjeta del menú del día */
.menu-dia { display: flex; gap: 16px; align-items: center; background: #fff; border-radius: 20px; padding: 16px; border: 1px solid #e2efd7; }
.menu-dia .icono { width: 58px; height: 58px; border-radius: 18px; background: #f0f7e8; display: grid; place-items: center; font-size: 26px; flex: none; }

var PIA = (function () {

  /* ---------------- 1. LA BÓVEDA DE DATOS ---------------- */

  /*
   * Algunos navegadores no dejan usar localStorage (por ejemplo dentro de un

   * funciona igual, solo que los datos no sobreviven al cerrar la página.
   */
  var MEMORIA = null;

  function almacenDisponible() {
    try { localStorage.setItem('__pia_prueba__', '1'); localStorage.removeItem('__pia_prueba__'); return true; }
    catch (e) { return false; }
  }
  var HAY_ALMACEN = almacenDisponible();

  /** Lee todo lo guardado. Si algo está dañado, empieza de cero. */
  function leerTodo() {
    if (!HAY_ALMACEN) return MEMORIA ? JSON.parse(JSON.stringify(MEMORIA)) : {};
    try {
      var crudo = localStorage.getItem(CLAVE_DATOS);
      return crudo ? JSON.parse(crudo) : {};
    } catch (e) {
      return {};
    }
  }

  /** Guarda todo. */
  function guardarTodo(todo) {
    if (!HAY_ALMACEN) { MEMORIA = JSON.parse(JSON.stringify(todo)); return; }
    try { localStorage.setItem(CLAVE_DATOS, JSON.stringify(todo)); }
    catch (e) { MEMORIA = JSON.parse(JSON.stringify(todo)); HAY_ALMACEN = false; }
  }

  /** Carga la semilla si el proyecto todavía no tiene datos. */

  /** Devuelve todas las filas de una tabla. */
  function listar(tabla) {
    var todo = leerTodo();
    return (todo[tabla] || []).slice();
  }

  /** Reemplaza todas las filas de una tabla. */
  function guardar(tabla, filas) {
    var todo = leerTodo();
    todo[tabla] = filas;
    guardarTodo(todo);
  }

  /** Inserta una fila y le pone un id que no se repite. */
  function insertar(tabla, fila) {
    var filas = listar(tabla);
    var id = filas.reduce(function (m, f) { return Math.max(m, Number(f.id) || 0); }, 0) + 1;
    var nueva = Object.assign({}, fila, { id: id, creado: new Date().toISOString() });
    filas.push(nueva);
    guardar(tabla, filas);
    return nueva;
  }

  /** Actualiza una fila que ya existe. */
  function actualizar(tabla, id, cambios) {
    var filas = listar(tabla);
    for (var i = 0; i < filas.length; i++) {
      if (Number(filas[i].id) === Number(id)) {
        filas[i] = Object.assign({}, filas[i], cambios, { id: Number(id) });
        guardar(tabla, filas);
        return filas[i];
      }
    }
    return null;
  }

  /** Elimina una fila. */
  function eliminar(tabla, id) {
    guardar(tabla, listar(tabla).filter(function (f) { return Number(f.id) !== Number(id); }));
  }

  /** Cuenta las filas de una tabla. */
  function contar(tabla) { return listar(tabla).length; }

  /** Borra todo y vuelve a la semilla. */
  function reiniciar() {
    MEMORIA = null;
    try { localStorage.removeItem(CLAVE_DATOS); } catch (e) {}
    sembrar();
  }

  /* ---------------- 2. UTILIDADES ---------------- */

  /** Evita que un texto se interprete como código (protege de inyecciones). */
  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /** Quita tildes y mayúsculas, para comparar textos escritos a mano. */
  function normalizar(t) {
    return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  /** Fecha de hoy en formato aaaa-mm-dd (el que entienden los campos de fecha). */
  function hoy() { return new Date().toISOString().slice(0, 10); }

  /** Da formato a una fecha para mostrarla. */
  function fecha(v) {
    if (!v) return '—';
    var d = new Date(String(v).length === 10 ? v + 'T00:00:00' : v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  /** Fecha y hora para mostrarla. */
  function fechaHora(v) {
    if (!v) return '—';
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('es-CO') + ' ' + d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  }

  /** Suma días hábiles (salta sábados y domingos). Se usa para los plazos. */
  function sumarDiasHabiles(fechaBase, dias) {
    var d = new Date(String(fechaBase).length === 10 ? fechaBase + 'T00:00:00' : fechaBase);
    var sumados = 0;
    while (sumados < dias) {
      d.setDate(d.getDate() + 1);
      var dia = d.getDay();
      if (dia !== 0 && dia !== 6) sumados++;
    }
    return d.toISOString().slice(0, 10);
  }

  /** Cuenta las palabras de un texto. */
  function palabras(t) { return String(t || '').trim().split(/\s+/).filter(Boolean).length; }

  /** Da formato de pesos colombianos. */
  function moneda(n) { return '$' + Number(n || 0).toLocaleString('es-CO'); }

  /** Deja un número con los decimales indicados. */
  function num(n, dec) { return Number(n || 0).toFixed(dec == null ? 1 : dec); }

  /** Genera un código único con prefijo y consecutivo de 4 dígitos. */
  function codigo(prefijo, tabla, campo) {
    var filas = listar(tabla);
    var mayor = 0;
    filas.forEach(function (f) {
      var m = String(f[campo] || '').match(/(\d+)$/);
      if (m) mayor = Math.max(mayor, Number(m[1]));
    });
    return prefijo + String(mayor + 1).padStart(4, '0');
  }

  /** Devuelve el parámetro de la dirección (?codigo=TOC-2026-0001). */
  function parametro(nombre) { return new URLSearchParams(window.location.search).get(nombre) || ''; }

  function toast(mensaje, tipo) {
    var viejo = document.getElementById('piaToast');
    if (viejo) viejo.remove();
    var caja = document.createElement('div');
    caja.id = 'piaToast';
    caja.className = 'toast' + (tipo === 'mal' ? ' mal' : tipo === 'warn' ? ' warn' : '');
    caja.textContent = mensaje;
    document.body.appendChild(caja);
    setTimeout(function () { caja.remove(); }, 4200);
  }

  /** Pinta una tabla a partir de los encabezados y las filas. */
  function tabla(encabezados, filas, opciones) {
    var o = opciones || {};

    filas.forEach(function (f) {
      h += '<tr>' + f.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';

    return h + '</tbody></table></div>';

/** Descarga una tabla en CSV (se abre en Excel). */
PIA.csv = function (tabla, columnas) {
  var filas = PIA.listar(tabla);
  if (!filas.length) { PIA.toast('No hay datos para exportar.', 'warn'); return; }
  var cols = columnas || Object.keys(filas[0]).filter(function (k) { return k !== 'creado'; });
  var lineas = [cols.join(';')];
  filas.forEach(function (f) {
    lineas.push(cols.map(function (c) {
      var v = f[c];
      if (Array.isArray(v)) v = v.join(' | ');
      return String(v == null ? '' : v).replace(/;/g, ',').replace(/[\r\n]+/g, ' ');
    }).join(';'));
  });
  var contenido = '\ufeff' + lineas.join('\r\n');
  var enlace = document.createElement('a');
  enlace.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(contenido);
  enlace.download = 'R.A.D.E-' + tabla + '-' + PIA.hoy() + '.csv';
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  PIA.toast('Archivo exportado: ' + enlace.download);
};

var ORDEN_ACTUAL = {};

/** Filtra las filas de una tabla por un texto, en cualquier columna. */
PIA.filtrar = function (filas, texto) {
  var t = PIA.normalizar(texto);
  if (!t) return filas;
  return filas.filter(function (f) { return PIA.normalizar(JSON.stringify(f)).indexOf(t) !== -1; });
};

/** Ordena las filas por una columna (alterna ascendente y descendente). */
PIA.ordenar = function (filas, columna) {
  var clave = ORDEN_ACTUAL.clave === columna && ORDEN_ACTUAL.dir === 'asc' ? 'desc' : 'asc';
  ORDEN_ACTUAL = { clave: columna, dir: clave };
  return filas.slice().sort(function (a, b) {
    var x = a[columna], y = b[columna];
    var num = !isNaN(Number(x)) && !isNaN(Number(y)) && x !== '' && y !== '';
    var r = num ? Number(x) - Number(y) : PIA.normalizar(x).localeCompare(PIA.normalizar(y));
    return clave === 'asc' ? r : -r;
  });
};

/* ---------------- 6. CONTADORES ANIMADOS ---------------- */

/** Anima un número desde 0 hasta su valor final. */
PIA.contar = function (idElemento, hasta, sufijo) {
  var el = document.getElementById(idElemento);
  if (!el) return;
  var meta = Number(hasta) || 0;
  var inicio = 0;
  var paso = Math.max(1, Math.ceil(meta / 26));
  var timer = setInterval(function () {
    inicio += paso;
    if (inicio >= meta) { inicio = meta; clearInterval(timer); }
    el.textContent = inicio + (sufijo || '');
  }, 22);
};

/* ---------------- 12. CINCO EJEMPLOS DESDE LA PÁGINA ---------------- */

/* Palabras que se cambian para que los ejemplos no queden idénticos. */
var VARIANTES = ['Nuevo', 'Actualizado', 'Urgente', 'Revisado', 'Pendiente'];

/**
 * Crea cinco registros de ejemplo a partir de los que ya existen.
 * Toma la tabla con más datos, copia un registro y le cambia algunos valores
 * para que se vea como si alguien los hubiera escrito desde la página.
 */
PIA.crearEjemplos = function () {
  var todo = PIA.leerTodo();
  var tablas = Object.keys(todo).filter(function (t) { return Array.isArray(todo[t]) && todo[t].length; });
  if (!tablas.length) { PIA.toast('No hay datos base para crear ejemplos.', 'mal'); return; }
  /* la tabla con más registros suele ser la principal */
  tablas.sort(function (a, b) { return todo[b].length - todo[a].length; });
  var tabla = tablas[0];
  var base = todo[tabla];
  var creados = 0;

  for (var i = 0; i < 5; i++) {
    var modelo = base[i % base.length];
    var copia = JSON.parse(JSON.stringify(modelo));
    delete copia.id;
    delete copia.creado;
    var marca = VARIANTES[i % VARIANTES.length] + ' ' + (i + 1);
    Object.keys(copia).forEach(function (k) {
      var v = copia[k];
      if (typeof v !== 'string' || !v) return;
      var kl = k.toLowerCase();
      /* se cambian los textos visibles; los códigos y correos se dejan válidos */
      if (kl.indexOf('codigo') !== -1 || kl.indexOf('radicado') !== -1 || kl.indexOf('carnet') !== -1) {
        copia[k] = v.replace(/\d+$/, function (m) { return String(Number(m) + 100 + i); });
      } else if (kl.indexOf('correo') !== -1 || kl.indexOf('email') !== -1) {
        copia[k] = v.replace('@', '.' + (i + 1) + '@');
      } else if (kl.indexOf('fecha') !== -1) {
        var d = new Date(); d.setDate(d.getDate() + i + 1);
        copia[k] = d.toISOString().slice(0, 10);
      } else if (kl.indexOf('titulo') !== -1 || kl.indexOf('nombre') !== -1 || kl.indexOf('asunto') !== -1 || kl.indexOf('descripcion') !== -1 || kl.indexOf('mensaje') !== -1) {
        copia[k] = v + ' · ' + marca;
      }
    });
    PIA.insertar(tabla, copia);
    creados++;
  }

  PIA.brindis();
  PIA.toast('Se crearon ' + creados + ' ejemplos en la tabla "' + tabla + '".');
  setTimeout(function () { window.location.reload(); }, 900);

/* ==========================================================================
   validador-unico.js
   --------------------------------------------------------------------------
   Aquí viven el registro de beneficiarios del PAE y el corazón del algoritmo
   Gestion_Integral_Restaurante_RADE: validar el carnet, bloquear el doble
   reclamo del mismo día y descontar la ración de la modalidad que le toca.
   ========================================================================== */

'use strict';

/* Las dos modalidades del restaurante escolar. */
var MODALIDADES = {
  VASO_LECHE: 'Vaso de Leche (industrializado)',
  PLATO_VERDE: 'Plato Verde (preparado en sitio)'
};

/* El carnet siempre tiene la forma LG-2026-0000. */
var PATRON_CARNET = /^LG-\d{4}-\d{4}$/;

/* El beneficiario que se está editando en el panel del operador. */
var beneficiarioEnEdicion = null;

/** Nombre largo de una modalidad. */
function modalidadNombre(m) {
  return MODALIDADES[m] || String(m || 'Sin modalidad').replace(/_/g, ' ');
}

/** Etiqueta de color según la modalidad. */
function badgeModalidad(m) {
  var clase = m === 'PLATO_VERDE' ? 'warn' : 'info';
  return '<span class="badge ' + clase + '">' + PIA.esc(modalidadNombre(m)) + '</span>';
}

/** Etiqueta verde para activo y roja para retirado. */
function badgeActivo(activo) {
  return activo ? '<span class="badge ok">Activo</span>' : '<span class="badge mal">Retirado</span>';
}

/** La hora actual en formato hh:mm. */
function horaActual() { return new Date().toTimeString().slice(0, 5); }

/** Deja el carnet en mayúsculas y sin espacios sobrantes. */
function normalizarCarnet(codigo) { return String(codigo || '').trim().toUpperCase(); }

/** Todos los beneficiarios inscritos. */
function beneficiarios() { return PIA.listar('beneficiarios'); }

/** Busca un beneficiario por el código del carnet. */
function beneficiarioPorCarnet(codigo) {
  var buscado = normalizarCarnet(codigo);
  var lista = beneficiarios();
  for (var i = 0; i < lista.length; i++) {
    if (normalizarCarnet(lista[i].codigo_carnet) === buscado) return lista[i];
  }
  return null;
}

/** Busca un beneficiario por su id interno. */
function beneficiarioPorId(id) {
  var lista = beneficiarios();
  for (var i = 0; i < lista.length; i++) {
    if (Number(lista[i].id) === Number(id)) return lista[i];
  }
  return null;
}

/** Las entregas registradas en una fecha. */
function entregasDe(fecha) {
  return PIA.listar('entregas').filter(function (e) { return e.fecha === fecha; });
}

/** La entrega previa del mismo carnet en la misma fecha: la que bloquea. */
function entregaPrevia(idBeneficiario, fecha) {
  var lista = entregasDe(fecha);
  for (var i = 0; i < lista.length; i++) {
    if (Number(lista[i].id_beneficiario) === Number(idBeneficiario)) return lista[i];
  }
  return null;
}

/**
 * El algoritmo completo, estudiante por estudiante.
 * Devuelve el tipo de respuesta para pintar el semáforo de la terminal.
 */
function procesarCarnet(codigo, devolverPlato) {
  var limpio = normalizarCarnet(codigo);
  if (!limpio) {
    return { tipo: 'INVALIDO', titulo: 'Carnet vacío', mensaje: 'Escribe o escanea el código del carnet.' };
  }
  if (!PATRON_CARNET.test(limpio)) {
    return { tipo: 'INVALIDO', titulo: 'Carnet ilegible', mensaje: 'El código ' + limpio + ' no tiene el formato LG-2026-0000.' };
  }
  /* Mientras el restaurante esté abierto: debe existir lote del día. */
  var lote = loteDeHoy();
  if (!lote) {
    return { tipo: 'SIN_JORNADA', titulo: 'Jornada sin abrir', mensaje: 'Todavía no se ha recibido el lote de hoy. El operador debe registrarlo antes de validar carnets.' };
  }
  if (lote.estado === 'CERRADO') {
    return { tipo: 'CERRADA', titulo: 'Jornada cerrada', mensaje: 'La jornada de hoy ya fue cerrada y conciliada. Los sobrantes pasan a coordinación.' };
  }
  /* Paso 2: buscar el beneficiario. */
  var ben = beneficiarioPorCarnet(limpio);
  if (!ben || !ben.activo) {
    return { tipo: 'DENEGADO', titulo: 'Acceso denegado', mensaje: 'ACCESO DENEGADO: el carnet ' + limpio + ' no figura como beneficiario activo del PAE.' };
  }
  /* La regla de idempotencia diaria: una sola entrega por carnet y fecha. */
  var previa = entregaPrevia(ben.id, lote.fecha);
  if (previa) {
    return {
      tipo: 'BLOQUEADO', titulo: 'Reclamo bloqueado', ben: ben, entrega: previa,
      mensaje: 'RECLAMO BLOQUEADO: ' + ben.nombre + ' ya reclamó su complemento hoy a las ' + previa.hora + '.'
    };
  }
  /* Validación exitosa: se registra la entrega y se descuenta la ración. */
  var entrega = PIA.insertar('entregas', {
    id_beneficiario: ben.id,
    codigo_carnet: ben.codigo_carnet,
    id_lote: lote.id,
    fecha: lote.fecha,
    hora: horaActual(),
    modalidad: ben.modalidad,
    plato_devuelto: ben.modalidad === 'PLATO_VERDE' ? !!devolverPlato : false
  });
  var mensaje = ben.modalidad === 'PLATO_VERDE'
    ? 'ENTREGAR PLATO VERDE a ' + ben.nombre + '. Recuerda devolver el plato al final del descanso.'
    : 'ENTREGAR VASO DE LECHE a ' + ben.nombre + '.';
  return { tipo: 'OK', titulo: 'Entrega autorizada', ben: ben, entrega: entrega, mensaje: mensaje };
}

/** Pinta el semáforo con la respuesta del algoritmo. */
function pintarSemaforo(r) {
  var caja = document.getElementById('semaforo');
  if (!caja) return;
  if (!r || !r.tipo) { caja.innerHTML = ''; return; }
  var clase = r.tipo === 'OK' ? 'ok' : (r.tipo === 'SIN_JORNADA' || r.tipo === 'CERRADA' || r.tipo === 'INVALIDO') ? 'warn' : 'mal';
  var icono = r.tipo === 'OK' ? '✔' : r.tipo === 'BLOQUEADO' ? '⛔' : r.tipo === 'DENEGADO' ? '✕' : '!';
  var html = '<div class="aviso ' + clase + '">';
  html += '<div class="fila" style="gap:12px;align-items:flex-start">';
  html += '<div style="font-size:34px;line-height:1">' + icono + '</div>';
  html += '<div><b style="font-size:15px">' + PIA.esc(r.titulo) + '</b><br>' + PIA.esc(r.mensaje) + '</div>';
  html += '</div>';
  if (r.ben) {
    html += '<div class="fila" style="margin-top:10px">' + badgeModalidad(r.ben.modalidad) +
      '<span class="badge neutro">' + PIA.esc(r.ben.grado) + '</span>' +
      '<span class="badge neutro mono">' + PIA.esc(r.ben.codigo_carnet) + '</span></div>';
  }
  if (r.tipo === 'SIN_JORNADA') {
    html += '<div style="margin-top:10px"><a class="btn p" href="lotes-dashboard.html">Registrar el lote del día</a></div>';
  }
  html += '</div>';
  caja.innerHTML = html;
}

/** Valida el carnet que está escrito en la terminal. */
function validarCarnet() {
  var caja = document.getElementById('devolverPlato');
  var r = procesarCarnet(PIA.valor('carnet'), caja ? caja.checked : false);
  pintarSemaforo(r);
  if (r.tipo === 'OK') PIA.toast('Ración entregada a ' + r.ben.nombre + '.');
  else if (r.tipo === 'BLOQUEADO') PIA.toast('Doble reclamo bloqueado.', 'mal');
  else if (r.tipo === 'DENEGADO') PIA.toast('Ese carnet no es beneficiario activo del PAE.', 'mal');
  else if (r.tipo === 'SIN_JORNADA') PIA.toast('Falta registrar el lote de hoy.', 'warn');
  else if (r.tipo === 'CERRADA') PIA.toast('La jornada de hoy ya está cerrada.', 'warn');
  PIA.poner('carnet', '');
  if (caja) caja.checked = false;
  pintarHistorial();
  pintarContadores();
  var campo = document.getElementById('carnet');
  if (campo) campo.focus();
}

/** Borra el semáforo. */
function limpiarTerminal() {
  var caja = document.getElementById('semaforo');
  if (caja) caja.innerHTML = '';
  PIA.poner('carnet', '');
  var campo = document.getElementById('carnet');
  if (campo) campo.focus();
}

/** Historial de las entregas del día. */
function pintarHistorial() {
  var cont = document.getElementById('historialHoy');
  if (!cont) return;
  var fecha = PIA.hoy();
  var lista = entregasDe(fecha).slice().sort(function (a, b) { return String(b.hora).localeCompare(String(a.hora)); });
  cont.innerHTML = PIA.tabla(
    ['Hora', 'Carnet', 'Estudiante', 'Modalidad', 'Plato devuelto', ''],
    lista.map(function (e) {
      var ben = beneficiarioPorId(e.id_beneficiario);
      var devuelto = e.modalidad === 'PLATO_VERDE'
        ? (e.plato_devuelto ? '<span class="badge ok">Sí</span>' : '<span class="badge warn">Pendiente</span>')
        : '<span class="badge neutro">No aplica</span>';
      var boton = (e.modalidad === 'PLATO_VERDE' && !e.plato_devuelto)
        ? '<button class="btn pq" onclick="devolverPlato(' + e.id + ')">Devolvió el plato</button>' : '';
      return [
        '<b>' + PIA.esc(e.hora) + '</b>',
        '<span class="mono">' + PIA.esc(e.codigo_carnet) + '</span>',
        PIA.esc(ben ? ben.nombre : 'Beneficiario retirado'),
        badgeModalidad(e.modalidad),
        devuelto,
        '<div class="acciones">' + boton + '</div>'
      ];
    }),
    { vacio: 'Todavía no hay entregas registradas hoy en esta terminal.' }
  );
}

/** Contadores y estado de la jornada. */
function pintarContadores() {
  var caja = document.getElementById('vReclamaron');

  var c = conciliarLote(lote);

/** Botones con carnets reales para probar la terminal. */
function pintarBotonesPrueba() {
  var cont = document.getElementById('botonesPrueba');
  if (!cont) return;
  var activos = beneficiarios().filter(function (b) { return b.activo; }).slice(0, 4);
  cont.innerHTML = activos.map(function (b) {
    return '<button class="btn pq" onclick="probarCarnet(\'' + b.codigo_carnet + '\')">' + PIA.esc(b.codigo_carnet) + '</button>';
  }).join('');
}

/** Escribe un carnet de ejemplo y lo valida. */
function probarCarnet(codigo) {
  PIA.poner('carnet', codigo);
  validarCarnet();
}

/** Marca un plato como devuelto desde el monitor. */
function devolverPlato(idEntrega) {
  PIA.actualizar('entregas', idEntrega, { plato_devuelto: true });
  PIA.toast('Devolución del plato registrada.');
  pintarHistorial();
  pintarContadores();
  if (typeof pintarMonitor === 'function') pintarMonitor();
  if (typeof pintarConciliacion === 'function') pintarConciliacion();
}

/** Inscribe o actualiza un beneficiario del PAE. */
function guardarBeneficiario() {
  var carnet = normalizarCarnet(PIA.valor('bCarnet'));
  var nombre = PIA.valor('bNombre');
  var documento = PIA.valor('bDocumento');
  var grado = PIA.valor('bGrado');
  var modalidad = PIA.valor('bModalidad');
  var activo = PIA.valor('bActivo') === 'si';
  if (!PATRON_CARNET.test(carnet)) {
    PIA.toast('El carnet debe tener el formato LG-2026-0000.', 'mal');
    return;
  }
  if (nombre.indexOf(' ') === -1) {
    PIA.toast('Escribe el nombre y al menos un apellido.', 'mal');
    return;
  }
  var repetido = beneficiarioPorCarnet(carnet);
  if (repetido && Number(repetido.id) !== Number(beneficiarioEnEdicion)) {
    PIA.toast('Ese carnet ya está inscrito en el PAE.', 'mal');
    return;
  }
  var datos = {
    codigo_carnet: carnet, nombre: nombre, documento_ti: documento,
    grado: grado, modalidad: modalidad, activo: activo
  };
  if (beneficiarioEnEdicion) {
    PIA.actualizar('beneficiarios', beneficiarioEnEdicion, datos);
    PIA.toast('Beneficiario actualizado.');
  } else {
    datos.fecha_inscripcion = PIA.hoy();
    PIA.insertar('beneficiarios', datos);
    PIA.toast('Beneficiario inscrito en el PAE.');
  }
  cancelarBeneficiario();
  pintarBeneficiarios();
  pintarBotonesPrueba();
  pintarContadores();
}

/** Carga un beneficiario en el formulario para editarlo. */
function editarBeneficiario(id) {
  var b = beneficiarioPorId(id);
  if (!b) return;
  beneficiarioEnEdicion = b.id;
  PIA.poner('bCarnet', b.codigo_carnet);
  PIA.poner('bNombre', b.nombre);
  PIA.poner('bDocumento', b.documento_ti || '');
  PIA.poner('bGrado', b.grado);
  PIA.poner('bModalidad', b.modalidad);
  PIA.poner('bActivo', b.activo ? 'si' : 'no');
  var titulo = document.getElementById('bGuardar');
  if (titulo) titulo.textContent = 'Guardar cambios';
}

/** Deja el formulario listo para una inscripción nueva. */
function cancelarBeneficiario() {
  beneficiarioEnEdicion = null;
  ['bCarnet', 'bNombre', 'bDocumento'].forEach(function (id) { PIA.poner(id, ''); });
  PIA.poner('bGrado', '10°01');
  PIA.poner('bModalidad', 'VASO_LECHE');
  PIA.poner('bActivo', 'si');
  var boton = document.getElementById('bGuardar');
  if (boton) boton.textContent = 'Inscribir beneficiario';
}

/** Retira o reactiva un carnet sin borrar su historial. */
function alternarBeneficiario(id) {
  var b = beneficiarioPorId(id);
  if (!b) return;
  PIA.actualizar('beneficiarios', id, { activo: !b.activo });
  PIA.toast(b.activo ? 'Carnet retirado del PAE.' : 'Carnet reactivado en el PAE.');
  pintarBeneficiarios();
  pintarBotonesPrueba();
  pintarContadores();
}

/** Elimina definitivamente un beneficiario sin entregas. */
function eliminarBeneficiario(id) {
  var entregas = PIA.listar('entregas').filter(function (e) { return Number(e.id_beneficiario) === Number(id); });
  if (entregas.length) {
    PIA.toast('Ese beneficiario tiene ' + entregas.length + ' entregas: retíralo en vez de borrarlo.', 'warn');
    return;
  }
  if (!confirm('¿Eliminar este beneficiario de la base del PAE?')) return;
  PIA.eliminar('beneficiarios', id);
  PIA.toast('Beneficiario eliminado.');
  pintarBeneficiarios();
}

/** Tabla de beneficiarios del panel del operador. */
function pintarBeneficiarios() {
  var cont = document.getElementById('tablaBeneficiarios');
  if (!cont) return;
  var lista = beneficiarios().slice().sort(function (a, b) {
    return String(a.codigo_carnet).localeCompare(String(b.codigo_carnet));

  cont.innerHTML = PIA.tabla(
    ['Carnet', 'Estudiante', 'Grado', 'Modalidad', 'Estado', ''],
    lista.map(function (b) {
      var cuenta = PIA.listar('entregas').filter(function (e) { return Number(e.id_beneficiario) === Number(b.id); }).length;
      return [
        '<span class="mono">' + PIA.esc(b.codigo_carnet) + '</span><br><span class="pequeno gris">' + cuenta + ' entregas</span>',
        PIA.esc(b.nombre),
        PIA.esc(b.grado),
        badgeModalidad(b.modalidad),
        badgeActivo(b.activo),
        '<div class="acciones">' +
          '<button class="btn pq" onclick="editarBeneficiario(' + b.id + ')">Editar</button>' +
          '<button class="btn pq" onclick="alternarBeneficiario(' + b.id + ')">' + (b.activo ? 'Retirar' : 'Activar') + '</button>' +
          '<button class="btn pq pel" onclick="eliminarBeneficiario(' + b.id + ')">Eliminar</button>' +
        '</div>'
      ];
    }),
    { vacio: 'Todavía no hay beneficiarios inscritos en el PAE.' }
  );
}

/* ==========================================================================
   conciliacion-lotes.js
   --------------------------------------------------------------------------
   Recepción del lote diario, conciliación de inasistentes y sobrantes, cierre
   de la jornada, panel del operador y buzón de sugerencias nutricionales.
   Traduce el cierre del algoritmo Gestion_Integral_Restaurante_RADE.
   ========================================================================== */

'use strict';

/* La sesión del panel se guarda aparte de las tablas del PAE. */
var CLAVE_SESION_RADE = 'rade_sesion';

/* Estados posibles de un lote. */
var ESTADOS_LOTE = ['ABIERTO', 'CERRADO'];

/** El lote de una fecha, o null si no se ha recibido. */
function loteDeFecha(fecha) {
  var lista = PIA.listar('lotes');
  for (var i = 0; i < lista.length; i++) {
    if (String(lista[i].fecha) === String(fecha)) return lista[i];
  }
  return null;
}

/** El lote del día de hoy: el único que puede validar carnets. */
function loteDeHoy() { return loteDeFecha(PIA.hoy()); }

/** Los lotes de la fecha más reciente a la más antigua. */
function lotesOrdenados() {
  return PIA.listar('lotes').slice().sort(function (a, b) {
    return String(b.fecha).localeCompare(String(a.fecha));
  });
}

/** El último lote registrado sirve de plantilla para abrir la jornada. */
function ultimoLote() {
  var lista = lotesOrdenados();
  return lista.length ? lista[0] : null;
}

/**
 * El cierre del algoritmo, con las fórmulas corregidas:
 *   inasistentes = inscritos - reclamaron
 *   sobrantes    = recibidas - entregadas (por modalidad y en total)
 * Nunca se resta al revés, que era el error de la primera versión.
 */
function conciliarLote(lote) {
  var vacio = {
    fecha: '', inscritos: 0, reclamaron: 0, inasistentes: 0,
    entregadosLeche: 0, entregadosPlato: 0, sobrantesLeche: 0, sobrantesPlato: 0,
    sobrantesTotales: 0, devueltos: 0, platosPendientes: 0, alerta: false
  };
  if (!lote) return vacio;
  var entregas = PIA.listar('entregas').filter(function (e) { return e.fecha === lote.fecha; });
  var entregadosLeche = 0, entregadosPlato = 0, devueltos = 0;
  entregas.forEach(function (e) {
    if (e.modalidad === 'PLATO_VERDE') {
      entregadosPlato++;
      if (e.plato_devuelto) devueltos++;
    } else {
      entregadosLeche++;
    }
  });
  var reclamaron = entregas.length;
  var inscritos = Number(lote.total_inscritos || 0);
  var sobrantesLeche = Number(lote.recibida_leche || 0) - entregadosLeche;
  var sobrantesPlato = Number(lote.recibida_plato || 0) - entregadosPlato;
  return {
    fecha: lote.fecha, inscritos: inscritos, reclamaron: reclamaron,
    inasistentes: inscritos - reclamaron,
    entregadosLeche: entregadosLeche, entregadosPlato: entregadosPlato,
    sobrantesLeche: sobrantesLeche, sobrantesPlato: sobrantesPlato,
    sobrantesTotales: sobrantesLeche + sobrantesPlato,
    devueltos: devueltos, platosPendientes: entregadosPlato - devueltos,
    alerta: sobrantesLeche < 0 || sobrantesPlato < 0 || (inscritos - reclamaron) < 0
  };
}

/** Abre la jornada de hoy con las cantidades del último lote. */
function abrirJornadaHoy() {
  var hoy = PIA.hoy();
  if (loteDeFecha(hoy)) { PIA.toast('La jornada de hoy ya está abierta.', 'warn'); return null; }
  var base = ultimoLote();
  var inscritos = PIA.listar('beneficiarios').filter(function (b) { return b.activo; }).length;
  var nuevo = PIA.insertar('lotes', {
    codigo_lote: PIA.codigo('LOTE-2026-', 'lotes', 'codigo_lote'),
    fecha: hoy,
    hora_llegada: '06:30',
    responsable: 'Operador PAE',
    menu: base ? base.menu : 'Arroz con pollo, ensalada y jugo natural',
    vencimiento: hoy,
    recibida_leche: base ? Number(base.recibida_leche) : 120,
    recibida_plato: base ? Number(base.recibida_plato) : 60,
    total_inscritos: inscritos,
    estado: 'ABIERTO',
    observacion: 'Jornada abierta desde el panel del operador.'
  });
  PIA.toast('Jornada abierta: ' + nuevo.recibida_leche + ' vasos y ' + nuevo.recibida_plato + ' platos.');
  refrescarPanel();
  return nuevo;
}

/** Guarda la recepción de un lote (crea o actualiza la fecha). */
function guardarLote() {
  var fecha = PIA.valor('lFecha');
  var responsable = PIA.valor('lResponsable');
  var menu = PIA.valor('lMenu');
  var leche = Number(PIA.valor('lLeche'));
  var plato = Number(PIA.valor('lPlato'));
  var inscritos = Number(PIA.valor('lInscritos'));
  if (!fecha) { PIA.toast('Elige la fecha del lote.', 'mal'); return; }
  if (!responsable) { PIA.toast('Escribe quién recibe el lote.', 'mal'); return; }
  if (!menu) { PIA.toast('Escribe el menú del día.', 'mal'); return; }
  if (!(leche >= 0) || !(plato >= 0)) { PIA.toast('Las cantidades recibidas deben ser cero o más.', 'mal'); return; }
  if (!(inscritos >= 1)) { PIA.toast('Escribe cuántos estudiantes están inscritos en el PAE.', 'mal'); return; }
  if (leche + plato < inscritos) {
    PIA.toast('Atención: el lote trae menos raciones que estudiantes inscritos.', 'warn');
  }
  var existente = loteDeFecha(fecha);
  var datos = {
    fecha: fecha, hora_llegada: PIA.valor('lHora') || '06:30', responsable: responsable,
    menu: menu, vencimiento: PIA.valor('lVence') || fecha,
    recibida_leche: leche, recibida_plato: plato, total_inscritos: inscritos
  };
  if (existente) {
    PIA.actualizar('lotes', existente.id, datos);
    PIA.toast('El lote de esa fecha se actualizó.');
  } else {
    datos.codigo_lote = PIA.codigo('LOTE-2026-', 'lotes', 'codigo_lote');
    datos.estado = 'ABIERTO';
    datos.observacion = '';
    PIA.insertar('lotes', datos);
    PIA.toast('Lote recibido y registrado.');
  }
  limpiarLote();
  refrescarPanel();
}

/** Deja el formulario del lote listo para hoy. */
function limpiarLote() {
  PIA.poner('lFecha', PIA.hoy());
  PIA.poner('lHora', '06:30');
  PIA.poner('lResponsable', '');
  PIA.poner('lMenu', '');
  PIA.poner('lVence', PIA.hoy());
  PIA.poner('lLeche', '120');
  PIA.poner('lPlato', '60');
  PIA.poner('lInscritos', String(PIA.listar('beneficiarios').filter(function (b) { return b.activo; }).length));
}

/** Pinta el estado de la jornada en el panel del operador. */
function pintarJornadaHoy() {
  var caja = document.getElementById('jornadaHoy');
  if (!caja) return;
  var lote = loteDeHoy();
  if (!lote) {
    caja.innerHTML = '<div class="aviso warn">Hoy todavía no se ha recibido el lote. Sin lote la terminal de carnet no puede validar.</div>' +
      '<div class="fila"><button class="btn p" onclick="abrirJornadaHoy()">Abrir la jornada de hoy</button>' +
      '<a class="btn" href="#formLote" onclick="PIA.poner(\'lFecha\', PIA.hoy())">Registrar el lote a mano</a></div>';
    return;
  }
  var c = conciliarLote(lote);
  var html = '<div class="fila" style="margin-bottom:12px">' +
    '<span class="badge ' + (lote.estado === 'CERRADO' ? 'neutro' : 'ok') + '">' + lote.estado + '</span>' +
    '<span class="badge neutro mono">' + PIA.esc(lote.codigo_lote) + '</span>' +
    '<span class="pequeno gris">' + PIA.fecha(lote.fecha) + ' · llegó ' + PIA.esc(lote.hora_llegada) + ' · recibe ' + PIA.esc(lote.responsable) + '</span></div>';
  html += '<p style="font-size:14px"><b>' + PIA.esc(lote.menu) + '</b></p>';
  html += '<div class="indicadores" style="grid-template-columns:repeat(4,1fr);margin-top:12px">' +
    '<div class="indicador"><b>Vasos</b><strong>' + lote.recibida_leche + '</strong><span>recibidos</span></div>' +
    '<div class="indicador"><b>Platos</b><strong>' + lote.recibida_plato + '</strong><span>recibidos</span></div>' +
    '<div class="indicador"><b>Reclamaron</b><strong>' + c.reclamaron + '</strong><span>estudiantes</span></div>' +
    '<div class="indicador"><b>Sobrantes</b><strong>' + c.sobrantesTotales + '</strong><span>raciones</span></div>' +
    '</div>';
  if (lote.estado === 'ABIERTO') {
    html += '<div class="fila"><button class="btn p" onclick="cerrarJornada()">Cerrar la jornada y conciliar</button>' +
      '<a class="btn" href="validador-carnet.html">Ir a la terminal</a></div>';
  } else {
    html += '<div class="aviso ok">Jornada cerrada el ' + PIA.fechaHora(lote.cerrado_en) + ' con ' + Number(lote.inasistentes_cierre || c.inasistentes) + ' inasistentes y ' + Number(lote.sobrantes_cierre || c.sobrantesTotales) + ' raciones sobrantes.</div>';
  }
  caja.innerHTML = html;
}

/** Llena el selector de fechas a conciliar. */
function pintarSelectFechas() {
  var sel = document.getElementById('cFecha');
  if (!sel) return;
  var valor = sel.value;
  var lotes = lotesOrdenados();
  sel.innerHTML = lotes.map(function (l) {
    return '<option value="' + l.fecha + '">' + PIA.fecha(l.fecha) + ' · ' + PIA.esc(l.menu) + '</option>';
  }).join('');
  if (valor) sel.value = valor;
  if (!sel.value && lotes.length) sel.value = lotes[0].fecha;
}

/** Tabla de conciliación con las fórmulas a la vista. */
function pintarConciliacion() {
  var cont = document.getElementById('conciliacion');
  if (!cont) return;
  pintarSelectFechas();
  var sel = document.getElementById('cFecha');
  var lote = sel && sel.value ? loteDeFecha(sel.value) : loteDeHoy();
  if (!lote) {
    cont.innerHTML = '<div class="vacio">No hay lotes registrados para conciliar.</div>';
    return;
  }
  var c = conciliarLote(lote);
  var html = '<div class="indicadores" style="grid-template-columns:1fr 1fr;margin-top:6px">' +
    '<div class="indicador"><b>Inscritos</b><strong>' + c.inscritos + '</strong><span>titulares del PAE</span></div>' +
    '<div class="indicador"><b>Reclamaron</b><strong>' + c.reclamaron + '</strong><span>entregas reales</span></div>' +
    '<div class="indicador"><b>Inasistentes</b><strong>' + c.inasistentes + '</strong><span>no reclamaron</span></div>' +
    '<div class="indicador"><b>Sobrantes</b><strong>' + c.sobrantesTotales + '</strong><span>raciones</span></div>' +
    '</div>';
  html += PIA.tabla(['Concepto', 'Cálculo', 'Resultado'], [
    ['Titulares inasistentes', c.inscritos + ' − ' + c.reclamaron, '<b>' + c.inasistentes + '</b>'],
    ['Entregados vaso de leche', '—', c.entregadosLeche],
    ['Sobrantes vaso de leche', lote.recibida_leche + ' − ' + c.entregadosLeche, '<b>' + c.sobrantesLeche + '</b>'],
    ['Entregados plato verde', '—', c.entregadosPlato],
    ['Sobrantes plato verde', lote.recibida_plato + ' − ' + c.entregadosPlato, '<b>' + c.sobrantesPlato + '</b>'],
    ['Sobrantes totales', c.sobrantesLeche + ' + ' + c.sobrantesPlato, '<b>' + c.sobrantesTotales + '</b>'],
    ['Platos sin devolver', c.entregadosPlato + ' − ' + c.devueltos, '<b>' + c.platosPendientes + '</b>']
  ]);
  if (c.alerta) {
    html += '<div class="aviso mal">Hay más entregas que raciones recibidas o más reclamos que inscritos. Revisa el lote antes de cerrar: un número negativo no es un resultado válido.</div>';
  }
  if (c.platosPendientes > 0) {
    html += '<div class="aviso warn">Quedan ' + c.platosPendientes + ' platos verdes sin devolver. El compromiso del Plato Verde incluye devolver el plato.</div>';
  }
  cont.innerHTML = html;
}

/** Monitor de entregas de la fecha conciliada. */
function pintarMonitor() {
  var cont = document.getElementById('monitor');
  if (!cont) return;
  var sel = document.getElementById('cFecha');
  var fecha = sel && sel.value ? sel.value : (loteDeHoy() ? loteDeHoy().fecha : '');

        '<span class="mono">' + PIA.esc(e.codigo_carnet) + '</span>',
        PIA.esc(ben ? ben.nombre : 'Beneficiario retirado'),
        PIA.esc(ben ? ben.grado : '—'),
        badgeModalidad(e.modalidad),
        e.modalidad === 'PLATO_VERDE'

      ];
    }),

/** Titulares activos que no reclamaron en la fecha conciliada. */
function pintarInasistentes() {
  var cont = document.getElementById('inasistentes');
  if (!cont) return;
  var sel = document.getElementById('cFecha');
  var fecha = sel && sel.value ? sel.value : (loteDeHoy() ? loteDeHoy().fecha : '');
  if (!fecha) { cont.innerHTML = '<div class="vacio">Elige una fecha con lote para ver los inasistentes.</div>'; return; }
  var reclamaron = {};
  PIA.listar('entregas').filter(function (e) { return e.fecha === fecha; }).forEach(function (e) {
    reclamaron[Number(e.id_beneficiario)] = true;
  });
  var ausentes = PIA.listar('beneficiarios').filter(function (b) {
    return b.activo && !reclamaron[Number(b.id)];
  });
  cont.innerHTML = PIA.tabla(
    ['Estudiante', 'Grado', 'Modalidad', 'Ración disponible', ''],
    ausentes.map(function (b) {
      return [
        PIA.esc(b.nombre),
        PIA.esc(b.grado),
        badgeModalidad(b.modalidad),
        '<span class="badge warn">Sin reclamar</span>',
        '<button class="btn pq" onclick="verFichaBeneficiario(' + b.id + ')">Ver ficha</button>'
      ];
    }),
    { vacio: 'Todos los beneficiarios activos reclamaron su ración en esa fecha.' }
  );
}

/** Ficha rápida de un beneficiario con su historial de entregas. */
function verFichaBeneficiario(id) {
  var b = beneficiarioPorId(id);
  if (!b) return;
  var historial = PIA.listar('entregas').filter(function (e) { return Number(e.id_beneficiario) === Number(id); })
    .sort(function (a, b2) { return String(b2.fecha).localeCompare(String(a.fecha)); });
  var cuerpo = '<p><b>' + PIA.esc(b.nombre) + '</b> · ' + PIA.esc(b.grado) + '</p>' +
    '<div class="fila" style="margin-bottom:12px">' + badgeModalidad(b.modalidad) + badgeActivo(b.activo) + '</div>' +
    '<p class="pequeno gris">Carnet ' + PIA.esc(b.codigo_carnet) + ' · inscrito el ' + PIA.fecha(b.fecha_inscripcion) + '</p>' +
    '<p class="pequeno">La ración de este titular queda disponible para reasignación según la Ley 1990 de 2019 y los lineamientos del PAE.</p>' +
    '<h3>Historial</h3>' +
    PIA.tabla(['Fecha', 'Hora', 'Modalidad'], historial.map(function (e) {
      return [PIA.fecha(e.fecha), PIA.esc(e.hora), modalidadNombre(e.modalidad)];
    }), { vacio: 'Sin entregas registradas.' });
  PIA.modal('Ficha del beneficiario', cuerpo, '<button class="btn" onclick="PIA.cerrarModal()">Cerrar</button>');
}

/** Cierra la jornada de hoy y guarda el reporte de cierre. */
function cerrarJornada() {
  var lote = loteDeHoy();
  if (!lote) { PIA.toast('No hay jornada abierta hoy.', 'mal'); return; }
  if (lote.estado === 'CERRADO') { PIA.toast('Esa jornada ya está cerrada.', 'warn'); return; }
  var c = conciliarLote(lote);
  var texto = 'Cerrar la jornada del ' + PIA.fecha(lote.fecha) + '?\n' +
    'Reclamaron: ' + c.reclamaron + ' · Inasistentes: ' + c.inasistentes + ' · Sobrantes: ' + c.sobrantesTotales;
  if (!confirm(texto)) return;
  PIA.actualizar('lotes', lote.id, {
    estado: 'CERRADO',
    cerrado_en: new Date().toISOString(),
    inasistentes_cierre: c.inasistentes,
    sobrantes_cierre: c.sobrantesTotales
  });
  PIA.toast('Jornada cerrada: ' + c.inasistentes + ' inasistentes y ' + c.sobrantesTotales + ' raciones sobrantes.');
  refrescarPanel();
}

/** Repinta todo lo que esté en pantalla. */
function refrescarPanel() {
  pintarContadores();
  pintarHistorial();
  pintarJornadaHoy();
  pintarSelectFechas();
  pintarConciliacion();
  pintarMonitor();
  pintarInasistentes();
  pintarBeneficiarios();
  pintarBotonesPrueba();
  pintarInicio();
}

/* ---------------- Portal del estudiante ---------------- */

/** Estrellas de una calificación de 1 a 5. */
function estrellas(n) {
  var mapa = ['', '★', '★★', '★★★', '★★★★', '★★★★★'];
  return mapa[Number(n)] || '—';
}

/** Consulta la ficha PAE del estudiante dueño del carnet. */
function consultarMiPae() {
  var caja = document.getElementById('miResultado');
  if (!caja) return;
  var codigo = normalizarCarnet(PIA.valor('miCarnet'));
  if (!codigo) { PIA.toast('Escribe el código de tu carnet.', 'mal'); return; }
  var ben = beneficiarioPorCarnet(codigo);
  if (!ben) {
    caja.innerHTML = '<div class="aviso mal">No encontramos el carnet <b>' + PIA.esc(codigo) + '</b> entre los beneficiarios del PAE. Acércate a coordinación.</div>';
    return;
  }
  window.__miBen = ben;
  var hoy = PIA.hoy();
  var lote = loteDeHoy();
  var entregaHoy = PIA.listar('entregas').filter(function (e) {
    return e.fecha === hoy && Number(e.id_beneficiario) === Number(ben.id);
  })[0];
  var historial = PIA.listar('entregas').filter(function (e) {
    return Number(e.id_beneficiario) === Number(ben.id);
  }).sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); });
  var estado;
  if (entregaHoy) {
    estado = '<div class="aviso ok">Ya reclamaste tu complemento hoy a las <b>' + PIA.esc(entregaHoy.hora) + '</b>. No necesitas volver a la fila.</div>';
  } else if (lote && lote.estado === 'ABIERTO') {
    estado = '<div class="aviso warn">Todavía no has reclamado el complemento de hoy. El restaurante está abierto.</div>';
  } else if (lote && lote.estado === 'CERRADO') {
    estado = '<div class="aviso">La jornada de hoy ya cerró y no registra tu reclamo.</div>';
  } else {
    estado = '<div class="aviso">Hoy no hay jornada registrada todavía.</div>';
  }
  var html = '<section class="tarjeta">' +
    '<h2>' + PIA.esc(ben.nombre) + ' ' + badgeActivo(ben.activo) + '</h2>' +
    '<p class="ayuda">Carnet <b class="mono">' + PIA.esc(ben.codigo_carnet) + '</b> · ' + PIA.esc(ben.grado) + ' · ' + badgeModalidad(ben.modalidad) + '</p>' +
    estado +
    '<div class="fila" style="margin:14px 0">' +
    '<button class="btn" onclick="cambiarModalidad()">Cambiar mi modalidad</button>' +
    '<span class="pequeno gris">Los cambios se reflejan de inmediato en la terminal del restaurante.</span>' +
    '</div>' +
    '<h3>Mi historial de raciones (' + historial.length + ')</h3>' +
    PIA.tabla(['Fecha', 'Hora', 'Modalidad', 'Plato devuelto'], historial.map(function (e) {
      return [
        PIA.fecha(e.fecha), PIA.esc(e.hora), modalidadNombre(e.modalidad),
        e.modalidad === 'PLATO_VERDE' ? (e.plato_devuelto ? 'Sí' : 'Pendiente') : 'No aplica'
      ];
    }), { vacio: 'Todavía no tienes raciones registradas.' }) +
    '</section>';
  caja.innerHTML = html;
  pintarSugerencias(ben);
}

/** Cambia la modalidad del estudiante consultado. */
function cambiarModalidad() {
  var ben = window.__miBen;
  if (!ben) { PIA.toast('Consulta tu carnet primero.', 'mal'); return; }
  var nueva = ben.modalidad === 'PLATO_VERDE' ? 'VASO_LECHE' : 'PLATO_VERDE';
  if (!confirm('¿Cambiar tu modalidad a ' + modalidadNombre(nueva) + '?')) return;
  PIA.actualizar('beneficiarios', ben.id, { modalidad: nueva });
  PIA.toast('Modalidad actualizada a ' + modalidadNombre(nueva) + '.');
  consultarMiPae();
  pintarBeneficiarios();
}

/** Buzón de sugerencias nutricionales del estudiante. */
function pintarSugerencias(ben) {
  var caja = document.getElementById('miSugerencias');
  if (!caja) return;
  var b = ben || window.__miBen;
  if (!b) { caja.innerHTML = ''; return; }
  var lista = PIA.listar('sugerencias').filter(function (s) { return Number(s.id_beneficiario) === Number(b.id); });
  var opciones = [5, 4, 3, 2, 1].map(function (n) {
    var texto = n === 5 ? 'Excelente' : n === 4 ? 'Muy bueno' : n === 3 ? 'Aceptable' : n === 2 ? 'Regular' : 'Malo';
    return '<option value="' + n + '">' + n + ' · ' + texto + '</option>';
  }).join('');
  var html = '<section class="tarjeta">' +
    '<h2>Buzón de sugerencias nutricionales</h2>' +
    '<p class="ayuda">Tu opinión sobre el menú llega al operador del PAE y a coordinación. Sin datos personales.</p>' +
    '<div class="rejilla g3">' +
    '<div class="campo"><label for="sCalificacion">Calificación del menú</label><select id="sCalificacion">' + opciones + '</select></div>' +
    '<div class="campo" style="grid-column:span 2"><label for="sComentario">Comentario</label><textarea id="sComentario" placeholder="¿Qué te gustó y qué mejorarías del complemento?"></textarea></div>' +
    '</div>' +
    '<button class="btn p" onclick="guardarSugerencia()">Enviar sugerencia</button>' +
    '<h3>Mis sugerencias</h3>' +
    PIA.tabla(['Fecha', 'Calificación', 'Comentario'], lista.map(function (s) {
      return [PIA.fecha(s.fecha), estrellas(s.calificacion), PIA.esc(s.comentario)];
    }), { vacio: 'Todavía no has dejado sugerencias sobre el menú.' }) +
    '</section>';
  caja.innerHTML = html;
}

/** Guarda una sugerencia nutricional del estudiante consultado. */
function guardarSugerencia() {
  var ben = window.__miBen;
  if (!ben) { PIA.toast('Consulta tu carnet antes de enviar una sugerencia.', 'mal'); return; }
  var calificacion = Number(PIA.valor('sCalificacion'));
  var comentario = PIA.valor('sComentario');
  if (!(calificacion >= 1 && calificacion <= 5)) { PIA.toast('Elige una calificación entre 1 y 5.', 'mal'); return; }
  if (PIA.palabras(comentario) < 5) { PIA.toast('Cuéntanos un poco más: mínimo 5 palabras.', 'mal'); return; }
  PIA.insertar('sugerencias', {
    id_beneficiario: ben.id, codigo_carnet: ben.codigo_carnet,
    calificacion: calificacion, comentario: comentario, fecha: PIA.hoy()
  });
  PIA.toast('Gracias: tu sugerencia quedó registrada.');
  PIA.poner('sComentario', '');
  pintarSugerencias(ben);
}

/* ---------------- Portada: ingreso por rol y cierre de lotes ---------------- */

/** La sesión del panel (no es una tabla del PAE). */
function sesionRade() {
  try {
    var crudo = localStorage.getItem(CLAVE_SESION_RADE);
    return crudo ? JSON.parse(crudo) : null;
  } catch (e) { return null; }
}

/** Pinta el formulario de ingreso o el saludo de la sesión. */
function pintarAcceso() {
  var caja = document.getElementById('accesoRade');
  if (!caja) return;
  var s = sesionRade();
  if (s) {
    caja.innerHTML = '<div class="aviso ok"><b>Bienvenido, ' + PIA.esc(s.nombre) + '.</b><br>Entraste como ' + PIA.esc(s.rol) + '.</div>' +
      '<div class="fila">' +
      '<a class="btn p" href="' + (s.rol === 'Estudiante' ? 'mi-pae.html' : 'validador-carnet.html') + '">Ir a mi panel</a>' +
      '<button class="btn" onclick="salirRade()">Cerrar sesión</button></div>';
    return;
  }
  var roles = ['Operador PAE', 'Docente PAE', 'Estudiante'].map(function (r) {
    return '<option>' + r + '</option>';
  }).join('');
  caja.innerHTML = '<div class="campo"><label for="rRol">Entro como</label><select id="rRol">' + roles + '</select></div>' +
    '<div class="campo"><label for="rCodigo">Carnet o usuario</label><input id="rCodigo" placeholder="LG-2026-0101 o DOC-PAE" autocomplete="off"></div>' +
    '<button class="btn p" onclick="entrarRade()">Entrar</button>' +
    '<p class="pequeno gris" style="margin-top:10px">Prueba con el carnet LG-2026-0101 para entrar como estudiante.</p>';
}

/** Registra el ingreso simulado por rol. */
function entrarRade() {
  var rol = PIA.valor('rRol');
  var codigo = normalizarCarnet(PIA.valor('rCodigo'));
  if (!codigo) { PIA.toast('Escribe tu carnet o usuario.', 'mal'); return; }
  var nombre = codigo;
  if (rol === 'Estudiante') {
    var ben = beneficiarioPorCarnet(codigo);
    if (!ben) { PIA.toast('Ese carnet no está inscrito en el PAE.', 'mal'); return; }
    if (!ben.activo) { PIA.toast('Ese carnet está retirado del PAE.', 'mal'); return; }
    nombre = ben.nombre;
  }
  localStorage.setItem(CLAVE_SESION_RADE, JSON.stringify({
    rol: rol, codigo: codigo, nombre: nombre, desde: new Date().toISOString()
  }));
  PIA.toast('Bienvenido, ' + nombre + '.');
  pintarAcceso();
  if (rol === 'Estudiante') {
    window.location.href = 'mi-pae.html?carnet=' + encodeURIComponent(codigo);
  }
}

/** Cierra la sesión simulada. */
function salirRade() {
  localStorage.removeItem(CLAVE_SESION_RADE);
  PIA.toast('Sesión cerrada.');
  pintarAcceso();
}

/** Menú del día en la portada. */
function pintarMenuHoy(lote) {
  var caja = document.getElementById('menuHoy');
  if (!caja) return;
  if (!lote) {
    caja.innerHTML = '<div class="aviso warn">Hoy no hay lote registrado. <a href="lotes-dashboard.html">Registrar el lote del día</a>.</div>';
    return;
  }
  caja.innerHTML = '<p style="font-size:15px;margin-bottom:10px"><b>' + PIA.esc(lote.menu) + '</b></p>' +
    '<div class="fila"><span class="badge neutro">Llegó ' + PIA.esc(lote.hora_llegada) + '</span>' +
    '<span class="badge neutro">' + PIA.esc(lote.responsable) + '</span>' +
    '<span class="badge ' + (lote.estado === 'ABIERTO' ? 'ok' : 'neutro') + '">' + lote.estado + '</span></div>' +
    '<div class="rejilla g2" style="margin-top:12px">' +
    '<div class="indicador"><b>Vaso de leche</b><strong>' + lote.recibida_leche + '</strong><span>raciones recibidas</span></div>' +
    '<div class="indicador"><b>Plato verde</b><strong>' + lote.recibida_plato + '</strong><span>raciones recibidas</span></div>' +
    '</div>';
}

/** Tabla con el cierre de los últimos lotes. */
function pintarUltimosCierres() {
  var cont = document.getElementById('ultimosCierres');
  if (!cont) return;
  var lista = lotesOrdenados().slice(0, 5);
  cont.innerHTML = PIA.tabla(
    ['Fecha', 'Menú', 'Reclamaron', 'Inasistentes', 'Sobrantes', 'Estado'],
    lista.map(function (l) {
      var c = conciliarLote(l);
      return [
        PIA.fecha(l.fecha), PIA.esc(l.menu), c.reclamaron, c.inasistentes,
        '<b>' + c.sobrantesTotales + '</b>',
        '<span class="badge ' + (l.estado === 'ABIERTO' ? 'ok' : 'neutro') + '">' + l.estado + '</span>'
      ];
    }),
    { vacio: 'Todavía no hay lotes registrados.' }
  );
}

/** Portada: indicadores, menú, accesos y últimos cierres. */
function pintarInicio() {
  var k = document.getElementById('kInscritos');
  if (!k) return;
  var lote = loteDeHoy();
  var c = conciliarLote(lote);
  var activos = PIA.listar('beneficiarios').filter(function (b) { return b.activo; }).length;
  k.textContent = activos;
  document.getElementById('kReclamaron').textContent = c.reclamaron;
  document.getElementById('kInasistentes').textContent = lote ? c.inasistentes : 0;
  document.getElementById('kSobrantes').textContent = lote ? c.sobrantesTotales : 0;
  pintarMenuHoy(lote);
  pintarUltimosCierres();
  pintarAcceso();
}

/* Arranque del panel del operador y del portal del estudiante. */
document.addEventListener('DOMContentLoaded', function () {
  pintarInicio();
  pintarJornadaHoy();
  pintarSelectFechas();
  pintarConciliacion();
  pintarMonitor();
  pintarInasistentes();
  if (document.getElementById('lFecha')) limpiarLote();
  if (document.getElementById('miCarnet')) {
    var cod = PIA.parametro('carnet');
    if (cod) { PIA.poner('miCarnet', cod); consultarMiPae(); }
  }
});

de los platos.</p>\n      <div id=\"monitor\"></div>\n    </section>\n\n    <section class=\"tarjeta\">\n      <h2>Titulares inasistentes</h2>\n      <p class=\"ayuda\">Inscritos activos que no reclamaron en la fecha conciliada. Sus raciones quedan disponibles para reasignación (Ley 1990 de 2019).</p>\n      <div id=\"inasistentes\"></div>\n    </section>\n\n    <section class=\"tarjeta\">\n      <h2>Beneficiarios del PAE</h2>\n      <p class=\"ayuda\">Inscripción, cambio de modalidad y retiro. Un carnet retirado no puede reclamar.</p>\n      <div class=\"rejilla g2\">\n        <div>\n          <div class=\"campo\"><label for=\"bCarnet\">Código de carnet <span class=\"req\">*</span></label><input id=\"bCarnet\" placeholder=\"LG-2026-0110\"></div>\n          <div class=\"campo\"><label for=\"bNombre\">Nombre completo <span class=\"req\">*</span></label><input id=\"bNombre\" placeholder=\"Nombres y apellidos\"></div>\n          <div class=\"rejilla g2\">\n            <div class=\"campo\"><label for=\"bDocumento\">Tarjeta de identidad</label><input id=\"bDocumento\" placeholder=\"1.0xx.xxx.xxx\"></div>\n            <div class=\"campo\"><label for=\"bGrado\">Grado y grupo</label><select id=\"bGrado\"><option>9°01</option><option>9°02</option><option>10°01</option><option>10°02</option><option>10°03</option><option>11°01</option><option>11°02</option><option>11°03</option></select></div>\n          </div>\n          <div class=\"rejilla g2\">\n            <div class=\"campo\"><label for=\"bModalidad\">Modalidad</label><select id=\"bModalidad\"><option value=\"VASO_LECHE\">Vaso de leche (industrializado)</option><option value=\"PLATO_VERDE\">Plato verde (preparado en sitio)</option></select></div>\n            <div class=\"campo\"><label for=\"bActivo\">Estado</label><select id=\"bActivo\"><option value=\"si\">Activo</option><option value=\"no\">Retirado</option></select></div>\n          </div>\n          <div class=\"fila\">\n            <button class=\"btn p\" id=\"bGu <script>(function () {
  var paginas = JSON.parse(document.getElementById("piaPaginas").textContent);
  var js = document.getElementById("piaJs").textContent;
  var css = document.getElementById("piaCss").textContent;
  var imagenes = JSON.parse(document.getElementById("piaImagenes").textContent);
  var pantalla = document.getElementById("pantalla");
  var barra = document.getElementById("barra");

  /* el CSS del proyecto se aplica una sola vez */
  var hoja = document.createElement("style");
  hoja.textContent = css;
  document.head.appendChild(hoja);

  function pintar(i) {
    var pagina = paginas[i];
    var cuerpo = pagina.cuerpo;
    Object.keys(imagenes).forEach(function (nombre) {
      cuerpo = cuerpo.split(nombre).join(imagenes[nombre]);
    });
    document.body.className = pagina.layout || "layout-top";
    var COMILLA = String.fromCharCode(34);
    pantalla.innerHTML = "<div class=" + COMILLA + "pia-pagina" + COMILLA + ">" + cuerpo + "</div>";

    /* se vuelve a ejecutar el JavaScript del proyecto para esta página */
    var viejo = document.getElementById("piaJsVivo");
    if (viejo) viejo.parentNode.removeChild(viejo);
    var nuevo = document.createElement("script");
    nuevo.id = "piaJsVivo";
    nuevo.textContent = js;
    document.body.appendChild(nuevo);

    /* se avisa que la página cargó, para que los módulos pinten sus datos */
    setTimeout(function () {
      document.dispatchEvent(new Event("DOMContentLoaded"));
      window.dispatchEvent(new Event("load"));
    }, 40);

    /* los enlaces del menú cambian de página dentro del mismo archivo */
    var enlaces = pantalla.querySelectorAll(".menu a, .menu-tabs a");
    Array.prototype.forEach.call(enlaces, function (a) {
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        var destino = a.getAttribute("href");
        for (var j = 0; j < paginas.length; j++) {
          if (paginas[j].archivo === destino) { ir(j); return; }
        }
      });
    });
    window.scrollTo(0, 0);
  }

  function ir(i) {
    var botones = barra.querySelectorAll("button");
    Array.prototype.forEach.call(botones, function (b, j) {
      if (j === i) b.classList.add("activo"); else b.classList.remove("activo");
    });
    pintar(i);
  }

  window.PIA_ir = function (archivo) {
    for (var j = 0; j < paginas.length; j++) if (paginas[j].archivo === archivo) return ir(j);
  };

  paginas.forEach(function (p, i) {
    var b = document.createElement("button");
    b.textContent = p.nombre;
    if (i === 0) b.className = "activo";
    b.onclick = function () { ir(i); };
    barra.appendChild(b);
  });

  var info = document.createElement("span");
  info.className = "aviso";
  info.textContent = paginas.length + " páginas · un solo archivo";
  barra.appendChild(info);

  pintar(0);
})();</script>
