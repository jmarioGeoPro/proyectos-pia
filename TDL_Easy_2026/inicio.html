<script id="piaCss" type="text/plain">/* ==========================================================================
   TDL Easy — hoja de estilos
   PIA 2026 · I.E. Lola González · Grado 10° · Grupo 10°05
   --------------------------------------------------------------------------
   Estilo: 03-terminal
   Este archivo se arma con dos partes:
     1. el carácter del proyecto (colores, tipografía, formas, detalles)
     2. la base estructural que comparten los nueve proyectos
   Cambiando las variables de :root cambia todo el aspecto sin tocar el resto.
   ========================================================================== */
/* ==========================================================================
   BASE ESTRUCTURAL — la comparten los nueve proyectos.
   Aquí va solo la ESTRUCTURA y los componentes. Los colores, la tipografía,
   las formas y el menú los pone el tema de cada proyecto.
   ========================================================================== */

/* ---- 1. reinicio ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; font-family: var(--fuente); color: var(--tinta); background: var(--fondo); line-height: 1.6; }
img { max-width: 100%; display: block; }
a { color: var(--acento-texto, var(--primario)); text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- 2. armazón: cuatro formas de organizar la página ---- */
/* Cada proyecto usa una: barra arriba, menú lateral, pestañas abajo o mixto. */
.armazon { display: grid; min-height: 100vh; grid-template-columns: 1fr; }

/* (a) barra arriba: el menú va debajo de la cabecera */
.layout-top .armazon {
  grid-template-areas: 'cab' 'menu' 'con' 'pie';
  grid-template-rows: auto auto 1fr auto;
}

/* (b) menú lateral: una columna fija a la izquierda */
.layout-sidebar .armazon {
  grid-template-areas: 'cab cab' 'menu con' 'pie pie';
  grid-template-columns: var(--ancho-menu) 1fr;
  grid-template-rows: auto 1fr auto;
}

/* (c) pestañas abajo: como una aplicación de teléfono */
.layout-tabs .armazon {
  grid-template-areas: 'cab' 'con' 'tabs';
  grid-template-rows: auto 1fr auto;
}

.barra-sup { grid-area: cab; }
.menu { grid-area: menu; }
.contenido { grid-area: con; }
.pie { grid-area: pie; }
.menu-tabs { grid-area: tabs; }

/* ---- 3. barra superior ---- */
.barra-sup { display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 60; background: var(--barra-fondo); color: var(--barra-tinta); backdrop-filter: blur(8px); }
.layout-sidebar .barra-sup, .layout-split .barra-sup { grid-column: 1 / -1; }
.marca { display: flex; align-items: center; gap: 12px; color: inherit; }
.marca-logo { width: 46px; height: 46px; object-fit: contain; border-radius: var(--radio-logo); background: var(--logo-fondo); padding: 4px; flex: none; }
.marca-texto b { display: block; font-size: 15.5px; line-height: 1.15; letter-spacing: var(--letra-titulo); }
.marca-texto span { font-size: 11px; opacity: .72; }

/* ---- 4. menú ---- */
/* (a) y (c): barra horizontal bajo la cabecera */
.layout-top .menu { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px clamp(14px, 3vw, 34px); background: var(--barra-fondo); border-bottom: 1px solid var(--linea); }

/* (b) menú lateral: columna completa */
.layout-sidebar .menu { display: flex; flex-direction: column; gap: 3px; padding: 16px 12px; background: var(--superficie); border-right: 1px solid var(--linea); }
.menu a { padding: 8px 14px; border-radius: var(--radio-boton); font-size: var(--menu-tam); font-weight: var(--menu-peso); color: inherit; opacity: .74; white-space: nowrap; transition: background .18s, opacity .18s, transform .18s; }
.menu a:hover { opacity: 1; background: var(--menu-hover); }
.menu a.activo { opacity: 1; background: var(--menu-activo-fondo); color: var(--menu-activo-tinta); box-shadow: var(--menu-activo-sombra); }

/* el menú lateral ocupa todo el ancho de su columna */
.layout-sidebar .menu a { width: 100%; }

/* menú inferior tipo aplicación */
.menu-tabs { position: sticky; bottom: 0; z-index: 60; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--barra-fondo); border-top: 1px solid var(--linea); }
.menu-tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px; border-radius: 12px; font-size: 10.5px; color: var(--barra-tinta); opacity: .6; }
.menu-tabs a b { font-size: 17px; font-weight: 400; line-height: 1; }
.menu-tabs a.activo { opacity: 1; background: var(--menu-activo-fondo); color: var(--menu-activo-tinta); }

/* ---- 5. contenido ---- */
.contenido { padding: var(--espacio) clamp(14px, 3vw, 34px) calc(var(--espacio) * 2); max-width: var(--ancho-contenido); width: 100%; margin: 0 auto; }
.volanta { display: flex; align-items: center; gap: 10px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--acento-texto); margin-bottom: 8px; }
.volanta::before { content: ''; width: 26px; height: 2px; background: currentColor; border-radius: 2px; }

/* ---- 6. pie ---- */
.pie { padding: 26px 20px; text-align: center; font-size: 12px; color: var(--pie-tinta); background: var(--pie-fondo); border-top: 1px solid var(--linea); }
.pie .equipo { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.pie .equipo span { background: var(--chip-fondo); padding: 3px 11px; border-radius: 20px; font-size: 11px; }
.pie .linea { margin-top: 5px; opacity: .82; }

/* ---- 7. tarjetas ---- */
.tarjeta { background: var(--superficie); border: var(--borde-tarjeta); border-radius: var(--radio-tarjeta); box-shadow: var(--sombra); padding: clamp(16px, 2vw, 24px); margin-bottom: 18px; position: relative; transition: box-shadow .2s, transform .2s; }
.tarjeta:hover { box-shadow: var(--sombra-alta); }
.tarjeta > h2 { font-size: var(--h2); margin-bottom: 4px; letter-spacing: var(--letra-titulo); }
.tarjeta > h2 + .ayuda { margin-top: 0; }
.tarjeta .ayuda { font-size: 13.5px; color: var(--gris); margin-bottom: 16px; }
.tarjeta h3 { font-size: 14.5px; margin: 18px 0 8px; }
.tarjeta.destacada { border: var(--borde-destacado); }

/* ---- 8. rejillas ---- */
.rejilla { display: grid; gap: var(--hueco); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }

/* ---- 9. formularios ---- */
.campo { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
.campo label { font-size: 12.5px; font-weight: var(--label-peso); color: var(--label-color); letter-spacing: .01em; }
.campo label .req { color: var(--peligro); }
.campo input, .campo select, .campo textarea { width: 100%; border: var(--borde-campo); border-radius: var(--radio-campo); padding: 10px 13px; background: var(--campo-fondo); color: var(--tinta); transition: border-color .16s, box-shadow .16s; }
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--primario); box-shadow: 0 0 0 3px var(--foco); }
.campo textarea { min-height: 92px; resize: vertical; }
.campo .pista { font-size: 11.5px; color: var(--gris); }

/* ---- 10. botones ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: var(--borde-boton); background: var(--boton-fondo); color: var(--boton-tinta); border-radius: var(--radio-boton); padding: 10px 18px; font-size: 13.5px; font-weight: var(--boton-peso); cursor: pointer; text-decoration: none; transition: transform .14s, box-shadow .14s, background .14s, border-color .14s; letter-spacing: var(--letra-boton); }
.btn:hover { transform: var(--boton-hover); box-shadow: var(--sombra); }
.btn:active { transform: translateY(0) scale(.985); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.p { background: var(--primario); border-color: var(--primario); color: var(--primario-tinta); }
.btn.a { background: var(--acento); border-color: var(--acento); color: var(--acento-tinta); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.pel { background: var(--peligro); border-color: var(--peligro); color: #fff; }
.btn.fantasma { background: transparent; border-color: var(--linea-fuerte); }
.btn.pq { padding: 5px 11px; font-size: 12px; }
.btn.gr { width: 100%; }

/* ---- 11. tablas ---- */
.tabla-envoltura { overflow-x: auto; border-radius: var(--radio-tabla); border: 1px solid var(--linea); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--superficie); }
th, td { padding: 10px 13px; text-align: left; border-bottom: 1px solid var(--linea); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--th-tinta); background: var(--th-fondo); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .12s; }
tbody tr:hover td { background: var(--fila-hover); }
td .acciones { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---- 12. etiquetas de estado ---- */
.badge { display: inline-block; padding: 2px 10px; border-radius: var(--radio-badge); font-size: 11.5px; font-weight: 700; white-space: nowrap; letter-spacing: .01em; }
.badge.ok, .badge.ok { background: var(--ok-suave); color: var(--ok-texto); }
/* todos los semáforos en verde */
.badge.warn, .badge.mal, .badge.malo, .badge.info, .badge.neutro,
.badge.warn, .badge.mal, .badge.malo {
  background: var(--ok-suave); color: var(--ok-texto); border: 1px solid var(--ok);
}
.badge.warn::before, .badge.mal::before, .badge.malo::before {
  content: '● '; color: var(--ok); font-size: 9px; vertical-align: middle;
}

/* ---- 13. avisos ---- */
.aviso { border-left: var(--aviso-grosor) solid var(--info); background: var(--info-suave); padding: 12px 16px; border-radius: 0 var(--radio-campo) var(--radio-campo) 0; font-size: 13.5px; margin-bottom: 15px; }
.aviso.ok { border-color: var(--ok); background: var(--ok-suave); color: var(--ok-texto); }
.aviso.mal { border-color: var(--peligro); background: var(--peligro-suave); color: var(--peligro-texto); }
.aviso.warn { border-color: var(--alerta); background: var(--alerta-suave); color: var(--alerta-texto); }

/* ---- 14. indicadores ---- */
.indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: var(--hueco); margin-bottom: 20px; }
.indicador { background: var(--superficie); border-radius: var(--radio-tarjeta); padding: 16px 18px; border: var(--borde-tarjeta); box-shadow: var(--sombra); position: relative; overflow: hidden; }
.indicador b { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--gris); font-weight: 700; }
.indicador strong { display: block; font-size: clamp(24px, 3vw, 32px); color: var(--primario); line-height: 1.15; letter-spacing: -0.02em; }
.indicador span { font-size: 11.5px; color: var(--gris); }

/* ---- 15. aviso flotante ---- */
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 900; background: var(--ok); color: #fff; padding: 13px 20px; border-radius: var(--radio-toast); font-size: 13.5px; box-shadow: var(--sombra-alta); max-width: min(380px, calc(100vw - 40px)); animation: toastEntra .26s cubic-bezier(.2,.9,.3,1.2); }
.toast.mal { background: var(--peligro); }
.toast.warn { background: var(--alerta); }
@keyframes toastEntra { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }

/* ---- 16. ventana ---- */
.modal-fondo { position: fixed; inset: 0; background: rgba(8, 12, 22, .55); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; backdrop-filter: blur(3px); animation: funde .18s; }
@keyframes funde { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--superficie); border-radius: var(--radio-modal); width: 100%; max-width: 640px; box-shadow: var(--sombra-alta); animation: sube .22s cubic-bezier(.2,.9,.3,1.1); }
@keyframes sube { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
.modal .cabeza { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--linea); }
.modal .cabeza h3 { font-size: 16px; margin: 0; }
.modal .cuerpo { padding: 18px 20px; max-height: 66vh; overflow-y: auto; }
.modal .pie2 { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 20px; border-top: 1px solid var(--linea); background: var(--fondo); border-radius: 0 0 var(--radio-modal) var(--radio-modal); }
.cerrar { border: 0; background: transparent; font-size: 16px; cursor: pointer; color: var(--gris); padding: 5px 9px; border-radius: 8px; }
.cerrar:hover { background: var(--fila-hover); }

/* ---- 17. barra de progreso ---- */
.barra { height: 9px; background: var(--linea); border-radius: 20px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--primario); border-radius: 20px; transition: width .5s cubic-bezier(.3,.9,.3,1); }

/* ---- 18. utilidades ---- */
.fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.derecha { margin-left: auto; }
.centro { text-align: center; }
.gris { color: var(--gris); }
.pequeno { font-size: 12px; }
.mono { font-family: var(--fuente-mono); letter-spacing: .04em; }
.vacio { text-align: center; color: var(--gris); padding: 30px 20px; font-size: 13.5px; }
.vacio::before { content: '○'; display: block; font-size: 30px; opacity: .4; margin-bottom: 6px; }
.oculto-impresion { }

/* ---- 18b. bloque de pseudocódigo ---- */
.codigo {
  background: var(--superficie); border: var(--borde-tarjeta); border-radius: var(--radio-tarjeta);
  padding: 16px 18px; overflow-x: auto; margin: 0;
  font-family: var(--fuente-mono); font-size: 12.5px; line-height: 1.7;
  white-space: pre; color: var(--tinta); tab-size: 2;
}

/* ---- 19. animaciones de entrada ---- */
@keyframes aparece { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.anim { animation: aparece .34s ease-out both; }

/* ---- 20. adaptación ---- */
@media (max-width: 900px) {
  /* en pantallas pequeñas el menú lateral se vuelve una barra arriba */
  .layout-sidebar .armazon { grid-template-areas: 'cab' 'menu' 'con' 'pie'; grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
  .layout-sidebar .menu { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--linea); padding: 8px 12px; }
  .layout-sidebar .menu a { width: auto; padding: 8px 13px; white-space: nowrap; }
}
@media (max-width: 640px) {
  .contenido { padding: 16px 13px 46px; }
  .barra-sup { padding: 9px 13px; gap: 9px; }
  .marca-logo { width: 38px; height: 38px; }
  .marca-texto b { font-size: 14px; }
  .menu { width: 100%; margin-left: 0; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 3px; }
  .btn { width: 100%; }
  .fila .btn { width: auto; }
}
@media print {
  .barra-sup, .pie, .menu, .menu-tabs, .btn, .toast, .modal-fondo, .no-impresion { display: none !important; }
  body { background: #fff; }
  .tarjeta { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
}

/* ==========================================================================
   TEMA TERMINAL — TDL Easy
   Lenguaje de máquina: negro absoluto, verde fósforo, monoespaciado, esquinas
   rectas y detalles de escáner. Parece una consola de control.
   ========================================================================== */
:root {
  --fuente: 'Cascadia Code', 'Consolas', 'Segoe UI', monospace;
  --fuente-mono: 'Cascadia Code', Consolas, monospace;
  --tinta: #d7ffe4;
  --fondo: #050806;
  --superficie: #0a1210;
  --gris: #6f8f7d;
  --linea: #14301f;
  --linea-fuerte: #1d4a2e;

  --primario: #22c55e;
  --primario-tinta: #041008;
  --acento: #facc15;
  --acento-tinta: #14100a;
  --acento-texto: #fde047;

  --ok: #22c55e;  --ok-suave: rgba(34,197,94,.14);  --ok-texto: #4ade80;
  --alerta: #facc15;  --alerta-suave: rgba(250,204,21,.13);  --alerta-texto: #fde047;
  --peligro: #ef4444;  --peligro-suave: rgba(239,68,68,.15);  --peligro-texto: #fca5a5;
  --info: #38bdf8;  --info-suave: rgba(56,189,248,.12);  --info-texto: #7dd3fc;
  --neutro-suave: rgba(255,255,255,.06);

  --barra-fondo: #070d0a;  --barra-tinta: #d7ffe4;
  --menu-hover: rgba(34,197,94,.1);  --menu-activo-fondo: #22c55e;
  --menu-activo-tinta: #041008;  --menu-activo-sombra: 0 0 18px rgba(34,197,94,.5);
  --pie-fondo: #050806;  --pie-tinta: #5f7d6c;  --chip-fondo: rgba(34,197,94,.1);

  --radio-tarjeta: 2px;  --radio-boton: 2px;  --radio-campo: 2px;
  --radio-modal: 3px;  --radio-tabla: 2px;  --radio-badge: 2px;
  --radio-toast: 2px;  --radio-logo: 2px;

  --sombra: 0 0 0 1px rgba(34,197,94,.07), 0 4px 16px rgba(0,0,0,.7);
  --sombra-alta: 0 0 0 1px rgba(34,197,94,.33), 0 12px 40px rgba(0,0,0,.85);
  --borde-tarjeta: 1px solid #14301f;
  --borde-destacado: 1px solid #22c55e;
  --borde-campo: 1px solid #1d4a2e;
  --borde-boton: 1px solid #1d4a2e;
  --campo-fondo: #06100b;
  --th-fondo: #0a1210;  --th-tinta: #6f8f7d;
  --fila-hover: rgba(34,197,94,.06);
  --foco: rgba(34,197,94,.3);
  --logo-fondo: rgba(255,255,255,.04);

  --boton-fondo: #0a1210;  --boton-tinta: #d7ffe4;  --boton-peso: 700;
  --boton-hover: translateY(-1px);  --letra-boton: .08em;
  --h2: 15px;  --letra-titulo: .06em;
  --menu-tam: 12px;  --menu-peso: 700;
  --label-peso: 700;  --label-color: #7fa88f;
  --espacio: 24px;  --hueco: 14px;
  --ancho-contenido: 1200px;  --ancho-menu: 230px;
  --aviso-grosor: 3px;
}

body { letter-spacing: .01em; }
.marca-texto b, .tarjeta > h2 { text-transform: uppercase; }
.menu a { text-transform: uppercase; letter-spacing: .08em; }

/* el fondo tiene una rejilla de consola */
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image: linear-gradient(rgba(34,197,94,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(34,197,94,.055) 1px, transparent 1px);
  background-size: 40px 40px; }
.armazon { position: relative; z-index: 1; }

/* la barra superior parece un panel de estado */
.barra-sup { border-bottom: 1px solid #22c55e; }
.marca-logo { filter: drop-shadow(0 0 8px rgba(34,197,94,.4)); }
.marca-texto b { color: #22c55e; letter-spacing: .1em; }
.marca-texto span { color: #6f8f7d; letter-spacing: .1em; text-transform: uppercase; }

/* portada tipo pantalla de arranque */
.portada { background: #0a1210; border: 1px solid #1d4a2e; border-left: 4px solid #22c55e; border-radius: 2px;
  padding: clamp(20px, 3.4vw, 36px); margin-bottom: 20px; color: #d7ffe4; position: relative; overflow: hidden; }
.portada::before { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(34,197,94,.04) 0 1px, transparent 1px 3px); }
.portada h1 { font-size: clamp(20px, 3vw, 29px); line-height: 1.2; letter-spacing: .02em; margin-bottom: 8px;
  color: #22c55e; text-transform: uppercase; position: relative; }
.portada p { color: #8fb9a2; max-width: 62ch; position: relative; }
.portada .sellos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; position: relative; }
.portada .sello { border: 1px solid #1d4a2e; background: #06100b; padding: 3px 10px; border-radius: 2px; font-size: 11px; color: #4ade80; letter-spacing: .1em; }

/* el token y los códigos se ven como en una terminal */
.token { font-family: var(--fuente-mono); background: #06100b; border: 1px dashed #1d4a2e; padding: 3px 9px; color: #4ade80; letter-spacing: .12em; }

/* el semáforo de asistencia */
.semaforo { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; letter-spacing: .05em; }
.semaforo::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 10px currentColor; }
.semaforo.verde { color: #4ade80; }
.semaforo.verde::before { background: #22c55e; }

/* el QR simulado */
.qr { width: 150px; height: 150px; background: #d7ffe4; border-radius: 2px; padding: 8px; display: grid;
  grid-template-columns: repeat(9, 1fr); gap: 2px; }
.qr i { background: #050806; border-radius: 1px; }
.qr i.b { background: transparent; }

.indicador { border-left: 3px solid #22c55e; border-top: 0; }
.indicador strong { font-family: var(--fuente-mono); }

var PIA = (function () {

  /* ---------------- 1. LA BÓVEDA DE DATOS ---------------- */

  /*
   * Algunos navegadores no dejan usar localStorage (por ejemplo dentro de un
   * marco sin origen propio). En ese caso se guarda en memoria: la aplicación
   * funciona igual, solo que los datos no sobreviven al cerrar la página.
   */
  var MEMORIA = null;

  function almacenDisponible() {
    try { localStorage.setItem('__pia_prueba__', '1'); localStorage.removeItem('__pia_prueba__'); return true; }
    catch (e) { return false; }
  }
  var HAY_ALMACEN = almacenDisponible();

  /** Lee todo lo guardado. Si algo está dañado, empieza de cero. */
  function leerTodo() {
    if (!HAY_ALMACEN) return MEMORIA ? JSON.parse(JSON.stringify(MEMORIA)) : {};
    try {
      var crudo = localStorage.getItem(CLAVE_DATOS);
      return crudo ? JSON.parse(crudo) : {};
    } catch (e) {
      return {};
    }
  }

  /** Guarda todo. */
  function guardarTodo(todo) {
    if (!HAY_ALMACEN) { MEMORIA = JSON.parse(JSON.stringify(todo)); return; }
    try { localStorage.setItem(CLAVE_DATOS, JSON.stringify(todo)); }
    catch (e) { MEMORIA = JSON.parse(JSON.stringify(todo)); HAY_ALMACEN = false; }
  }

  /** Carga la semilla si el proyecto todavía no tiene datos. */
  function sembrar() {
    var todo = leerTodo();
    if (Object.keys(todo).length > 0) return;
    guardarTodo(JSON.parse(JSON.stringify(SEMILLA)));
  }

  /** Devuelve todas las filas de una tabla. */
  function listar(tabla) {
    var todo = leerTodo();
    return (todo[tabla] || []).slice();
  }

  /** Reemplaza todas las filas de una tabla. */
  function guardar(tabla, filas) {
    var todo = leerTodo();
    todo[tabla] = filas;
    guardarTodo(todo);
  }

  /** Inserta una fila y le pone un id que no se repite. */
  function insertar(tabla, fila) {
    var filas = listar(tabla);
    var id = filas.reduce(function (m, f) { return Math.max(m, Number(f.id) || 0); }, 0) + 1;
    var nueva = Object.assign({}, fila, { id: id, creado: new Date().toISOString() });
    filas.push(nueva);
    guardar(tabla, filas);
    return nueva;
  }

  /** Actualiza una fila que ya existe. */
  function actualizar(tabla, id, cambios) {
    var filas = listar(tabla);
    for (var i = 0; i < filas.length; i++) {
      if (Number(filas[i].id) === Number(id)) {
        filas[i] = Object.assign({}, filas[i], cambios, { id: Number(id) });
        guardar(tabla, filas);
        return filas[i];
      }
    }
    return null;
  }

  /** Elimina una fila. */
  function eliminar(tabla, id) {
    guardar(tabla, listar(tabla).filter(function (f) { return Number(f.id) !== Number(id); }));
  }

  /** Cuenta las filas de una tabla. */
  function contar(tabla) { return listar(tabla).length; }

  /** Borra todo y vuelve a la semilla. */
  function reiniciar() {
    MEMORIA = null;
    try { localStorage.removeItem(CLAVE_DATOS); } catch (e) {}
    sembrar();
  }

  /* ---------------- 2. UTILIDADES ---------------- */

  /** Evita que un texto se interprete como código (protege de inyecciones). */
  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /** Quita tildes y mayúsculas, para comparar textos escritos a mano. */
  function normalizar(t) {
    return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  /** Fecha de hoy en formato aaaa-mm-dd (el que entienden los campos de fecha). */
  function hoy() { return new Date().toISOString().slice(0, 10); }

  /** Da formato a una fecha para mostrarla. */
  function fecha(v) {
    if (!v) return '—';
    var d = new Date(String(v).length === 10 ? v + 'T00:00:00' : v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  /** Fecha y hora para mostrarla. */
  function fechaHora(v) {
    if (!v) return '—';
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('es-CO') + ' ' + d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  }

  /** Suma días hábiles (salta sábados y domingos). Se usa para los plazos. */
  function sumarDiasHabiles(fechaBase, dias) {
    var d = new Date(String(fechaBase).length === 10 ? fechaBase + 'T00:00:00' : fechaBase);
    var sumados = 0;
    while (sumados < dias) {
      d.setDate(d.getDate() + 1);
      var dia = d.getDay();
      if (dia !== 0 && dia !== 6) sumados++;
    }
    return d.toISOString().slice(0, 10);
  }

  /** Cuenta las palabras de un texto. */
  function palabras(t) { return String(t || '').trim().split(/\s+/).filter(Boolean).length; }

  /** Da formato de pesos colombianos. */
  function moneda(n) { return '$' + Number(n || 0).toLocaleString('es-CO'); }

  /** Deja un número con los decimales indicados. */
  function num(n, dec) { return Number(n || 0).toFixed(dec == null ? 1 : dec); }

  /** Genera un código único con prefijo y consecutivo de 4 dígitos. */
  function codigo(prefijo, tabla, campo) {
    var filas = listar(tabla);
    var mayor = 0;
    filas.forEach(function (f) {
      var m = String(f[campo] || '').match(/(\d+)$/);
      if (m) mayor = Math.max(mayor, Number(m[1]));
    });
    return prefijo + String(mayor + 1).padStart(4, '0');
  }

  /** Devuelve el parámetro de la dirección (?codigo=TOC-2026-0001). */
  function parametro(nombre) { return new URLSearchParams(window.location.search).get(nombre) || ''; }

  /* ---------------- 3. AVISOS EN PANTALLA ---------------- */

  /** Muestra un aviso flotante que desaparece solo. */
  function toast(mensaje, tipo) {
    var viejo = document.getElementById('piaToast');
    if (viejo) viejo.remove();
    var caja = document.createElement('div');
    caja.id = 'piaToast';
    caja.className = 'toast' + (tipo === 'mal' ? ' mal' : tipo === 'warn' ? ' warn' : '');
    caja.textContent = mensaje;
    document.body.appendChild(caja);
    setTimeout(function () { caja.remove(); }, 4200);
  }

  /** Pinta una tabla a partir de los encabezados y las filas. */
  function tabla(encabezados, filas, opciones) {
    var o = opciones || {};
    if (!filas.length) return '<div class="vacio">' + esc(o.vacio || 'Todavía no hay registros.') + '</div>';
    var h = '<div class="tabla-envoltura"><table><thead><tr>';
    h += encabezados.map(function (e) { return '<th>' + e + '</th>'; }).join('');
    h += '</tr></thead><tbody>';
    filas.forEach(function (f) {
      h += '<tr>' + f.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  /** Abre una ventana con un contenido y unos botones. */
  function modal(titulo, cuerpoHtml, botones) {
    cerrarModal();
    var fondo = document.createElement('div');
    fondo.className = 'modal-fondo';
    fondo.id = 'piaModal';
    fondo.innerHTML = '<div class="modal"><div class="cabeza"><h3>' + esc(titulo) +

      '<div class="pie2">' + (botones || '<button class="btn" onclick="PIA.cerrarModal()">Cerrar</button>') + '</div></div>';
    document.body.appendChild(fondo);
    fondo.addEventListener('click', function (ev) { if (ev.target === fondo) cerrarModal(); });
    return fondo;
  }

  /** Cierra la ventana abierta. */
  function cerrarModal() { var m = document.getElementById('piaModal'); if (m) m.remove(); }

  /** Devuelve el valor de un campo del formulario. */
  function valor(id) { var el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; }

  /** Pone un valor en un campo del formulario. */

  /** Marca la página actual en el menú. */
  function marcarMenu() {

    document.querySelectorAll('.menu a, .menu-tabs a').forEach(function (a) {
      var destino = (a.getAttribute('href') || '').split('?')[0].split('#')[0];
      if (destino === actual) a.classList.add('activo');
    });

  /* ---------------- 4. ARRANQUE ---------------- */

  /* Los datos quedan listos de inmediato, no cuando el navegador avise:

  sembrar();

  });

};

/** Devuelve true si el rol actual puede hacer la acción. */
PIA.puede = function (accion) {

  if (PIA.rol === 'Docente') return ['crear', 'editar', 'exportar', 'imprimir'].indexOf(accion) !== -1;
  return ['crear', 'exportar'].indexOf(accion) !== -1;
};

/* ---------------- 2. EXPORTAR E IMPRIMIR ---------------- */

/** Descarga una tabla en CSV (se abre en Excel). */
PIA.csv = function (tabla, columnas) {
  var filas = PIA.listar(tabla);
  if (!filas.length) { PIA.toast('No hay datos para exportar.', 'warn'); return; }
  var cols = columnas || Object.keys(filas[0]).filter(function (k) { return k !== 'creado'; });
  var lineas = [cols.join(';')];
  filas.forEach(function (f) {
    lineas.push(cols.map(function (c) {
      var v = f[c];
      if (Array.isArray(v)) v = v.join(' | ');
      return String(v == null ? '' : v).replace(/;/g, ',').replace(/[\r\n]+/g, ' ');
    }).join(';'));
  });
  var contenido = '\ufeff' + lineas.join('\r\n');
  var enlace = document.createElement('a');
  enlace.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(contenido);
  enlace.download = 'TDL Easy-' + tabla + '-' + PIA.hoy() + '.csv';
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  PIA.toast('Archivo exportado: ' + enlace.download);
};

/** Imprime la página tal como se ve. */
PIA.imprimir = function () { window.print(); };

/** Copia un texto al portapapeles. */
PIA.copiar = function (texto) {

  if (navigator.clipboard) {
    navigator.clipboard.writeText(t).then(function () { PIA.toast('Copiado: ' + t); }, function () { PIA.toast(t); });
  } else { PIA.toast(t); }
};

var ORDEN_ACTUAL = {};

/** Filtra las filas de una tabla por un texto, en cualquier columna. */
PIA.filtrar = function (filas, texto) {
  var t = PIA.normalizar(texto);
  if (!t) return filas;
  return filas.filter(function (f) { return PIA.normalizar(JSON.stringify(f)).indexOf(t) !== -1; });
};

/** Ordena las filas por una columna (alterna ascendente y descendente). */
PIA.ordenar = function (filas, columna) {
  var clave = ORDEN_ACTUAL.clave === columna && ORDEN_ACTUAL.dir === 'asc' ? 'desc' : 'asc';
  ORDEN_ACTUAL = { clave: columna, dir: clave };
  return filas.slice().sort(function (a, b) {
    var x = a[columna], y = b[columna];
    var num = !isNaN(Number(x)) && !isNaN(Number(y)) && x !== '' && y !== '';
    var r = num ? Number(x) - Number(y) : PIA.normalizar(x).localeCompare(PIA.normalizar(y));
    return clave === 'asc' ? r : -r;
  });
};

/** Anima un número desde 0 hasta su valor final. */
PIA.contar = function (idElemento, hasta, sufijo) {
  var el = document.getElementById(idElemento);
  if (!el) return;
  var meta = Number(hasta) || 0;
  var inicio = 0;
  var paso = Math.max(1, Math.ceil(meta / 26));
  var timer = setInterval(function () {
    inicio += paso;
    if (inicio >= meta) { inicio = meta; clearInterval(timer); }
    el.textContent = inicio + (sufijo || '');
  }, 22);
};

/* ---------------- 12. CINCO EJEMPLOS DESDE LA PÁGINA ---------------- */

/* Palabras que se cambian para que los ejemplos no queden idénticos. */
var VARIANTES = ['Nuevo', 'Actualizado', 'Urgente', 'Revisado', 'Pendiente'];

/**
 * Crea cinco registros de ejemplo a partir de los que ya existen.
 * Toma la tabla con más datos, copia un registro y le cambia algunos valores
 * para que se vea como si alguien los hubiera escrito desde la página.
 */
PIA.crearEjemplos = function () {
  var todo = PIA.leerTodo();
  var tablas = Object.keys(todo).filter(function (t) { return Array.isArray(todo[t]) && todo[t].length; });
  if (!tablas.length) { PIA.toast('No hay datos base para crear ejemplos.', 'mal'); return; }
  /* la tabla con más registros suele ser la principal */
  tablas.sort(function (a, b) { return todo[b].length - todo[a].length; });
  var tabla = tablas[0];
  var base = todo[tabla];
  var creados = 0;

  for (var i = 0; i < 5; i++) {
    var modelo = base[i % base.length];
    var copia = JSON.parse(JSON.stringify(modelo));
    delete copia.id;
    delete copia.creado;
    var marca = VARIANTES[i % VARIANTES.length] + ' ' + (i + 1);
    Object.keys(copia).forEach(function (k) {
      var v = copia[k];
      if (typeof v !== 'string' || !v) return;
      var kl = k.toLowerCase();
      /* se cambian los textos visibles; los códigos y correos se dejan válidos */
      if (kl.indexOf('codigo') !== -1 || kl.indexOf('radicado') !== -1 || kl.indexOf('carnet') !== -1) {
        copia[k] = v.replace(/\d+$/, function (m) { return String(Number(m) + 100 + i); });
      } else if (kl.indexOf('correo') !== -1 || kl.indexOf('email') !== -1) {
        copia[k] = v.replace('@', '.' + (i + 1) + '@');
      } else if (kl.indexOf('fecha') !== -1) {
        var d = new Date(); d.setDate(d.getDate() + i + 1);
        copia[k] = d.toISOString().slice(0, 10);
      } else if (kl.indexOf('titulo') !== -1 || kl.indexOf('nombre') !== -1 || kl.indexOf('asunto') !== -1 || kl.indexOf('descripcion') !== -1 || kl.indexOf('mensaje') !== -1) {
        copia[k] = v + ' · ' + marca;
      }
    });
    PIA.insertar(tabla, copia);
    creados++;
  }

  PIA.brindis();
  PIA.toast('Se crearon ' + creados + ' ejemplos en la tabla "' + tabla + '".');
  setTimeout(function () { window.location.reload(); }, 900);
};

/* ==========================================================================
   auth-sesion.js
   --------------------------------------------------------------------------
   Credenciales, cierre automático de sesión y consultas de usuarios.
   Es el paso 1 (ValidarCredenciales) y el paso 6 (CerrarSesionAutomatica)
   del algoritmo Registrar_Asistencia_QR_TDLEasy.
   ========================================================================== */

"use strict";

/* La sesión se guarda en sessionStorage: al cerrar la pestaña se borra sola. */
var CLAVE_SESION = "tdl_sesion_activa";

/* Minutos que dura abierta la ventana del QR de una clase. */
var MINUTOS_VENTANA = 10;

/* Las asignaturas que se pueden programar desde el panel docente. */
var ASIGNATURAS = ["Matemáticas", "Sistemas Operativos", "Pensamiento Computacional", "Herramientas Algorítmicas I", "Herramientas Lógicas Matemáticas", "Herramientas TIC", "Sistemas Operativos y Red", "Inglés"];

/** Devuelve la sesión abierta en esta pestaña, o null. */
function sesionActual() {
  try {
    var crudo = sessionStorage.getItem(CLAVE_SESION);
    return crudo ? JSON.parse(crudo) : null;
  } catch (e) {
    return null;
  }
}

/** Guarda la sesión del usuario que acaba de entrar. */
function guardarSesion(usuario) {
  var sesion = {
    id: usuario.id,
    documento: usuario.documento,
    nombre: usuario.nombre,
    rol: usuario.rol,
    curso: usuario.curso || "",
    correo: usuario.correo || "",
    estudiantes: usuario.estudiantes || [],
    inicio: new Date().toISOString()
  };
  sessionStorage.setItem(CLAVE_SESION, JSON.stringify(sesion));
  return sesion;
}

/** Busca un usuario por su documento. */
function buscarUsuario(documento) {
  var doc = String(documento || "").trim();
  var lista = PIA.listar("usuarios");
  for (var i = 0; i < lista.length; i++) {
    if (String(lista[i].documento) === doc) return lista[i];
  }
  return null;
}

/** Devuelve un usuario por id. */
function usuarioPorId(id) {
  var lista = PIA.listar("usuarios");
  for (var i = 0; i < lista.length; i++) {
    if (Number(lista[i].id) === Number(id)) return lista[i];
  }
  return null;
}

/** Los estudiantes de un curso, en orden alfabético. */
function estudiantesDelCurso(curso) {
  return PIA.listar("usuarios")
    .filter(function (u) { return u.rol === "estudiante" && u.curso === curso; })
    .sort(function (a, b) { return String(a.nombre).localeCompare(String(b.nombre)); });
}

/** Escribe un texto dentro de un elemento, si existe. */
function ponerTexto(id, valor) {
  var el = document.getElementById(id);
  if (el) el.textContent = valor;
}

/**
 * Paso 1 del algoritmo: valida documento y clave.
 * Devuelve un objeto con ok, usuario y mensaje.
 */
function validarCredenciales(documento, clave) {
  if (!String(documento || "").trim() || !String(clave || "").trim()) {
    return { ok: false, usuario: null, mensaje: "Escribe tu documento y tu clave." };
  }
  var u = buscarUsuario(documento);
  if (!u || String(u.clave) !== String(clave)) {
    return { ok: false, usuario: null, mensaje: "Incorrecto: Este usuario no existe o clave errónea." };
  }
  return { ok: true, usuario: u, mensaje: "" };
}

/** Lleva a cada rol a su panel. */
function irAPanel(rol) {
  var destino = rol === "docente" ? "panel-docente.html" : (rol === "acudiente" ? "portal-acudiente.html" : "escaner-estudiante.html");

}

function entrar() {
  var r = validarCredenciales(PIA.valor("documento"), PIA.valor("clave"));
  var caja = document.getElementById("loginError");
  if (!r.ok) {
    if (caja) { caja.className = "aviso mal"; caja.textContent = r.mensaje; }
    PIA.toast(r.mensaje, "mal");
    PIA.poner("clave", "");
    return null;
  }
  var sesion = guardarSesion(r.usuario);
  PIA.toast("Bienvenido(a), " + r.usuario.nombre + ".");
  irAPanel(sesion.rol);
  return sesion;
}

function entrarDemo(rol) {

/** Paso 6: cierra la sesión y obliga a entrar de nuevo. */
function cerrarSesion() {
  sessionStorage.removeItem(CLAVE_SESION);
  PIA.toast("Sesión cerrada. La próxima vez debes entrar otra vez.");
  window.location.href = "index.html";
}

/**
 * Puerta de las páginas privadas: si no hay sesión del rol pedido,
 * devuelve null y manda al login.
 */
function exigirSesion(rol) {
  var s = sesionActual();
  if (s && (!rol || s.rol === rol)) return s;
  PIA.toast("Inicia sesión para entrar a esta página.", "mal");
  var actual = window.location.pathname.split("/").pop() || "index.html";
  window.location.replace("index.html?destino=" + encodeURIComponent(actual));
  return null;
}

/** Escribe el nombre y el rol en las cajas marcadas con data-sesion. */
function pintarSesion() {
  var s = sesionActual();
  if (!s) return;
  var rol = s.rol === "docente" ? "Docente" : (s.rol === "acudiente" ? "Acudiente" : "Estudiante " + s.curso);
  var cajas = document.querySelectorAll("[data-sesion]");
  for (var i = 0; i < cajas.length; i++) cajas[i].textContent = s.nombre + " · " + rol;
}

/** Hora actual en formato hh:mm. */
function horaAhora() {
  var d = new Date();
  var hh = d.getHours(), mm = d.getMinutes();
  return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
}

/** Convierte hh:mm en minutos desde la medianoche. */
function minutosDe(hora) {
  var p = String(hora || "0:0").split(":");
  return Number(p[0]) * 60 + Number(p[1] || 0);
}

/** Suma minutos a una hora hh:mm. */
function sumarMinutos(hora, minutos) {
  var total = minutosDe(hora) + Number(minutos || 0);
  total = ((total % 1440) + 1440) % 1440;
  var hh = Math.floor(total / 60), mm = total % 60;
  return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
}

/** Paso 4: porcentaje de asistencia con un decimal. */
function porcentajeAsistencia(asistidas, programadas) {
  var p = Number(programadas || 0);
  if (!p) return 0;
  return Math.round(Number(asistidas || 0) / p * 1000) / 10;
}

/** Etiqueta del semáforo verde / rojo. */
function badgeSemaforo(estado) {
  if (estado === "ASISTIO") return "<span class='badge ok'>SI · VERDE</span>";
  if (estado === "FALTO") return "<span class='badge mal'>NO · ROJO</span>";
  return "<span class='badge neutro'>Sin registro</span>";
}

/** Etiqueta del estado de una sesión de clase. */
function badgeSesion(estado) {
  return estado === "ABIERTA" ? "<span class='badge info'>ABIERTA</span>" : "<span class='badge neutro'>CERRADA</span>";
}

/** Color del porcentaje según el riesgo de inasistencia. */
function colorPorcentaje(p) {
  return Number(p) >= 85 ? "var(--ok)" : (Number(p) >= 70 ? "var(--alerta)" : "var(--peligro)");
}

/** Paso 3: suma una asistencia al contador mensual del estudiante. */
function sumarAsistencia(idEstudiante) {
  var u = usuarioPorId(idEstudiante);
  if (!u) return null;
  var programadas = Number(u.programadas_mes || 0);
  var asistidas = Number(u.asistidas_mes || 0) + 1;
  if (programadas && asistidas > programadas) asistidas = programadas;
  return PIA.actualizar("usuarios", u.id, { asistidas_mes: asistidas });
}

/* ==========================================================================
   escaner-qr.js
   --------------------------------------------------------------------------
   Lectura del código QR del docente y registro de la asistencia.
   Traduce el algoritmo Registrar_Asistencia_QR_TDLEasy: credenciales, un solo
   escaneo por bloque, token vigente, ventana de 10 minutos y semáforo.
   ========================================================================== */

"use strict";

/* La corriente de la cámara, para poder apagarla. */
var corrienteCamara = null;

/** La clase con QR abierto del curso, o null. */
function sesionVigente(curso) {
  var abiertas = PIA.listar("sesiones").filter(function (s) {
    return s.curso === curso && s.estado === "ABIERTA";
  });
  return abiertas.length ? abiertas[abiertas.length - 1] : null;
}

/** ¿La hora actual está dentro de la ventana del QR? */
function enVentana(sesion) {
  if (!sesion) return false;
  if (String(sesion.fecha) !== PIA.hoy()) return false;
  var ahora = minutosDe(horaAhora());
  return ahora >= minutosDe(sesion.hora_apertura) && ahora <= minutosDe(sesion.hora_cierre);
}

/** Minutos que le quedan a la ventana del QR. */
function minutosRestantes(sesion) {
  if (!sesion || String(sesion.fecha) !== PIA.hoy()) return 0;
  return Math.max(0, minutosDe(sesion.hora_cierre) - minutosDe(horaAhora()));
}

/** Bandera ya_escaneo_bloque: ¿ya registró este estudiante esta clase? */
function yaEscaneo(idSesion, idEstudiante) {
  var lista = PIA.listar("asistencias");
  for (var i = 0; i < lista.length; i++) {
    if (Number(lista[i].id_sesion) === Number(idSesion) && Number(lista[i].id_estudiante) === Number(idEstudiante)) return true;
  }
  return false;
}

/** El registro de asistencia de un estudiante en una sesión, o null. */
function registroDe(idSesion, idEstudiante) {
  var lista = PIA.listar("asistencias");
  for (var i = 0; i < lista.length; i++) {
    if (Number(lista[i].id_sesion) === Number(idSesion) && Number(lista[i].id_estudiante) === Number(idEstudiante)) return lista[i];
  }
  return null;
}

/** Pinta el semáforo grande del escáner. */
function pintarSemaforo(estado, titulo, detalle) {
  var caja = document.getElementById("semaforo");
  if (!caja) return;
  var verde = estado === "SI";
  caja.innerHTML = "<div style='border-radius:12px;padding:22px;text-align:center;color:#fff;background:" +
    (verde ? "var(--ok)" : "var(--peligro)") + "'>" +
    "<div style='font-size:38px;line-height:1'>" + (verde ? "✔" : "✕") + "</div>" +
    "<div style='font-weight:700;font-size:17px;margin-top:6px'>" + PIA.esc(titulo) + "</div>" +
    "<div style='font-size:12.5px;opacity:.92;margin-top:4px'>" + PIA.esc(detalle || "") + "</div></div>";
}

/** Pinta la tarjeta de comprobante después de un escaneo válido. */
function pintarComprobante(registro, clase, estudiante) {
  var caja = document.getElementById("resultadoEscaner");
  if (!caja) return;
  var pct = porcentajeAsistencia(estudiante.asistidas_mes, estudiante.programadas_mes);
  caja.innerHTML = "<section class='tarjeta' style='border-left:4px solid var(--ok)'>" +
    "<h2 style='color:var(--ok)'>Asistencia confirmada</h2>" +
    "<p class='ayuda'>El docente ya te ve en verde en la planilla. No necesitas escanear otra vez.</p>" +
    "<div class='fila'><span class='badge ok'>SI · VERDE</span>" +
    "<span class='badge neutro'>" + PIA.esc(clase.asignatura) + "</span>" +
    "<span class='badge neutro'>Bloque " + clase.bloque + "</span></div>" +
    "<p class='pequeno gris' style='margin-top:10px'>Registrado el " + PIA.fecha(registro.fecha) + " a las " + PIA.esc(registro.hora) + ".</p>" +
    "<div class='barra' style='margin:12px 0'><i style='width:" + Math.min(100, pct) + "%'></i></div>" +
    "<p class='pequeno'>Asistencia del mes: <b style='color:" + colorPorcentaje(pct) + "'>" + pct + "%</b> (" +
    Number(estudiante.asistidas_mes) + " de " + Number(estudiante.programadas_mes) + " clases).</p></section>";
}

/**
 * Algoritmo Registrar_Asistencia_QR_TDLEasy.
 * tokenLeido llega de la cámara o del campo de simulación.
 */
function registrarAsistenciaQR(tokenLeido) {
  var sesion = sesionActual();
  if (!sesion) {
    PIA.toast("Tu sesión se cerró. Vuelve a entrar.", "mal");
    return null;
  }

  /* 1. credenciales: se confirma que el usuario de la sesión existe */
  var estudiante = usuarioPorId(sesion.id);
  if (!estudiante) {
    pintarSemaforo("NO", "NO · ROJO", "Incorrecto: Este usuario no existe o clave errónea.");
    return { estado: "NO", motivo: "credenciales" };
  }

  /* la única clase con QR abierto del curso del estudiante */
  var clase = sesionVigente(estudiante.curso);
  if (!clase) {
    pintarSemaforo("NO", "NO · ROJO", "No hay una clase con QR abierto. Pídele al docente que genere el código.");
    return { estado: "NO", motivo: "sin-clase" };
  }

  /* 2. ya_escaneo_bloque: un solo escaneo por clase */
  if (yaEscaneo(clase.id, estudiante.id)) {
    pintarSemaforo("NO", "NO · ROJO", "Acción bloqueada: el código QR solo se puede escanear 1 vez por clase.");
    return { estado: "NO", motivo: "doble-escaneo" };
  }

  /* 3. token correcto y ventana de tiempo activa */
  var token = String(tokenLeido || "").trim().toUpperCase();
  if (!token) {
    PIA.toast("Escribe o lee un código QR.", "mal");
    return null;
  }
  if (token !== String(clase.token || "").toUpperCase()) {
    pintarSemaforo("NO", "NO · ROJO", "Código inválido: no corresponde al QR de " + clase.asignatura + ".");
    return { estado: "NO", motivo: "token" };
  }
  if (!enVentana(clase)) {
    pintarSemaforo("NO", "NO · ROJO", "Código expirado: la ventana de " + MINUTOS_VENTANA + " minutos ya cerró.");
    return { estado: "NO", motivo: "ventana" };
  }

  /* 3b. se guarda la asistencia y se suma al contador del mes */
  var registro = PIA.insertar("asistencias", {
    id_sesion: clase.id,
    id_estudiante: estudiante.id,
    estudiante: estudiante.nombre,
    asignatura: clase.asignatura,
    fecha: PIA.hoy(),
    hora: horaAhora(),
    estado: "ASISTIO",
    token: token,
    observacion: "Escaneo válido dentro de la ventana"
  });
  sumarAsistencia(estudiante.id);

  /* 4 y salida: semáforo verde, porcentaje actualizado y comprobante */
  var actualizado = usuarioPorId(estudiante.id);
  pintarSemaforo("SI", "SI · VERDE (Asistencia Confirmada)", clase.asignatura + " · bloque " + clase.bloque + " · " + horaAhora());
  pintarComprobante(registro, clase, actualizado);
  PIA.toast("Asistencia registrada. ¡Bien!");
  pintarEscaner();
  return { estado: "SI", registro: registro };
}

/** Botón de simulación: usa el campo de texto como si fuera la cámara. */
function simularEscaneo() {
  registrarAsistenciaQR(PIA.valor("tokenSimulado"));
}

/** Copia el token de la clase abierta al campo de simulación. */
function usarTokenVigente() {
  var s = sesionActual();
  if (!s) return;
  var est = usuarioPorId(s.id);
  if (!est) return;
  var clase = sesionVigente(est.curso);
  if (!clase) {
    PIA.toast("El docente todavía no ha abierto ninguna clase.", "warn");
    return;
  }
  PIA.poner("tokenSimulado", clase.token);
  PIA.toast("Token de " + clase.asignatura + " copiado. Ahora escanéalo.");
}

/** Enciende la cámara trasera del celular (HTML5 MediaDevices). */
function activarCamara() {
  var caja = document.getElementById("camaraCaja");
  var video = document.getElementById("camara");
  if (!caja || !video) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    PIA.toast("Este navegador no abre la cámara. Usa la simulación de abajo.", "warn");
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
    .then(function (corriente) {
      corrienteCamara = corriente;
      video.srcObject = corriente;
      caja.className = "";
      PIA.toast("Cámara activada: apunta al QR del tablero.");
    })
    .catch(function () {
      PIA.toast("No se pudo abrir la cámara. Usa la simulación de abajo.", "mal");
    });
}

/** Apaga la cámara y oculta la vista previa. */
function detenerCamara() {
  if (corrienteCamara) {
    corrienteCamara.getTracks().forEach(function (t) { t.stop(); });
    corrienteCamara = null;
  }
  var caja = document.getElementById("camaraCaja");
  if (caja) caja.className = "oculto";
}

/** Pinta la ficha del estudiante, la clase abierta y sus marcas. */
function pintarEscaner() {
  var s = sesionActual();
  if (!s) return;
  var est = usuarioPorId(s.id);
  if (!est) return;
  pintarSesion();
  var clase = sesionVigente(est.curso);
  var caja = document.getElementById("claseActual");
  if (caja) {
    if (!clase) {
      caja.innerHTML = "<div class='aviso warn'>No hay una clase con QR abierto en este momento. Cuando el docente abra la sesión aparecerá aquí.</div>";
    } else {
      var restantes = minutosRestantes(clase);
      caja.innerHTML = "<div class='aviso ok'><b>" + PIA.esc(clase.asignatura) + "</b> · bloque " + clase.bloque + "<br>" +
        "<span class='pequeno'>" + PIA.esc(clase.docente) + " · curso " + PIA.esc(clase.curso) + " · cierra a las " + PIA.esc(clase.hora_cierre) + "</span></div>" +
        (restantes > 0
          ? "<p class='pequeno gris'>Quedan <b>" + restantes + "</b> minutos de ventana.</p>"
          : "<p class='pequeno' style='color:var(--peligro)'>La ventana ya cerró: pídele al docente que abra la clase otra vez.</p>");
    }
  }
  var pct = porcentajeAsistencia(est.asistidas_mes, est.programadas_mes);
  ponerTexto("kPorcentaje", pct + "%");
  ponerTexto("kAsistidas", Number(est.asistidas_mes || 0));
  ponerTexto("kProgramadas", Number(est.programadas_mes || 0));
  var cont = document.getElementById("tablaHoy");
  if (!cont) return;
  var mias = PIA.listar("asistencias").filter(function (a) { return Number(a.id_estudiante) === Number(est.id); });
  mias.sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); });
  cont.innerHTML = PIA.tabla(["Clase", "Fecha", "Hora", "Semáforo"],
    mias.slice(0, 8).map(function (a) {
      return [PIA.esc(a.asignatura), PIA.fecha(a.fecha), PIA.esc(a.hora), badgeSemaforo(a.estado)];
    }),
    { vacio: "Todavía no tienes marcas de asistencia." });
}

/* Arranque de la página del escáner. */
document.addEventListener("DOMContentLoaded", function () {
  if (!document.getElementById("semaforo")) return;
  var s = exigirSesion("estudiante");
  if (!s) return;
  pintarEscaner();
});

/* ==========================================================================
   panel-docente.js
   --------------------------------------------------------------------------
   Generador del QR de la clase, planilla en vivo y cierre de la ventana.
   El cierre aplica el paso 5 del algoritmo: a quien no escaneó se le registra
   la inasistencia y se le avisa al acudiente.
   ========================================================================== */

"use strict";

/* La sesión que el docente quiere mirar en la planilla. */
var sesionElegida = null;

/** Siglas de una asignatura para el token: Pensamiento Computacional -> PC. */
function siglasAsignatura(nombre) {
  var limpio = PIA.normalizar(nombre).replace(/[^a-z ]/g, "");
  var palabras = limpio.split(" ").filter(Boolean);
  var siglas = "";
  for (var i = 0; i < palabras.length && siglas.length < 4; i++) siglas += palabras[i].charAt(0);
  return siglas.toUpperCase() || "CLA";
}

/** Token del QR de una clase: QR-MAT10-20261027-B1. */
function armarToken(asignatura, bloque) {
  var fecha = PIA.hoy().replace(/-/g, "");
  return "QR-" + siglasAsignatura(asignatura) + "10-" + fecha + "-B" + bloque;
}

/** Dibuja el patrón del QR a partir del token, con sus tres esquinas fijas. */
function pintarQR(token) {
  var caja = document.getElementById("qrCaja");
  if (!caja) return;
  var lado = 21;
  var semilla = 7;
  var texto = String(token || "TDL-EASY");
  for (var i = 0; i < texto.length; i++) semilla = (semilla * 31 + texto.charCodeAt(i)) % 99991;

  function fijo(fila, col) {
    var esquinas = [[0, 0], [0, lado - 7], [lado - 7, 0]];
    for (var k = 0; k < esquinas.length; k++) {
      var f = esquinas[k][0], c = esquinas[k][1];
      if (fila >= f && fila < f + 7 && col >= c && col < c + 7) {
        var borde = fila === f || fila === f + 6 || col === c || col === c + 6;
        var centro = fila >= f + 2 && fila <= f + 4 && col >= c + 2 && col <= c + 4;
        return borde || centro;
      }
    }
    return null;
  }

  var celdas = "";
  for (var f2 = 0; f2 < lado; f2++) {
    for (var c2 = 0; c2 < lado; c2++) {
      var marca = fijo(f2, c2);
      var negro = marca === null ? ((f2 * 7 + c2 * 13 + semilla + f2 * c2) % 5) < 2 : marca;
      celdas += "<i style='display:block;background:" + (negro ? "#0f172a" : "#ffffff") + "'></i>";
    }
  }
  caja.innerHTML = "<div style='display:inline-block;background:#fff;padding:10px;border:1px solid var(--linea);border-radius:12px'>" +
    "<div style='display:grid;grid-template-columns:repeat(21,1fr);width:252px;height:252px;gap:1px'>" + celdas + "</div></div>" +
    "<p class='mono' style='font-size:14px;margin:10px 0 2px;word-break:break-all'>" + PIA.esc(texto) + "</p>" +
    "<p class='pequeno gris'>Vale " + MINUTOS_VENTANA + " minutos y un solo escaneo por estudiante.</p>";
}

/** La sesión que se muestra en la planilla. */
function sesionParaMostrar() {
  var lista = PIA.listar("sesiones");
  if (!lista.length) return null;
  if (sesionElegida) {
    for (var i = 0; i < lista.length; i++) {
      if (Number(lista[i].id) === Number(sesionElegida)) return lista[i];
    }
  }
  return lista[lista.length - 1];
}

/** Llena el selector de sesiones de clase. */
function pintarSelectorSesiones(lista, sesion) {
  var sel = document.getElementById("sSesion");
  if (!sel) return;
  var opciones = "<option value=''>Última sesión</option>";
  for (var i = lista.length - 1; i >= 0; i--) {
    var s = lista[i];
    opciones += "<option value='" + s.id + "'" + (sesion && Number(s.id) === Number(sesion.id) ? " selected" : "") + ">" +
      PIA.esc(s.asignatura) + " · " + PIA.fecha(s.fecha) + " · B" + s.bloque + " · " + PIA.esc(s.estado) + "</option>";
  }
  sel.innerHTML = opciones;
}

/** Cuántos escanearon y cuántos quedaron en rojo en una sesión. */
function resumenSesion(sesion) {
  var regs = PIA.listar("asistencias").filter(function (a) { return Number(a.id_sesion) === Number(sesion.id); });
  return {
    asistio: regs.filter(function (a) { return a.estado === "ASISTIO"; }).length,
    falto: regs.filter(function (a) { return a.estado === "FALTO"; }).length,
    total: estudiantesDelCurso(sesion.curso).length
  };
}

/** Pinta la planilla del salón para la sesión elegida. */
function pintarPlanilla(sesion) {
  var cont = document.getElementById("planilla");
  if (!cont) return;
  if (!sesion) {
    cont.innerHTML = "<div class='vacio'>Todavía no hay sesiones de clase.</div>";
    return;
  }
  var estudiantes = estudiantesDelCurso(sesion.curso);
  cont.innerHTML = PIA.tabla(["Estudiante", "Semáforo", "Hora", "Mes", ""],
    estudiantes.map(function (e) {
      var reg = registroDe(sesion.id, e.id);
      var pct = porcentajeAsistencia(e.asistidas_mes, e.programadas_mes);
      return [
        PIA.esc(e.nombre) + "<br><span class='pequeno gris mono'>" + PIA.esc(e.documento) + "</span>",
        badgeSemaforo(reg ? reg.estado : ""),
        reg ? PIA.esc(reg.hora) : "—",
        "<b style='color:" + colorPorcentaje(pct) + "'>" + pct + "%</b>",
        reg ? "" : "<button class='btn pq' onclick='marcarFalta(" + sesion.id + "," + e.id + ")'>Marcar falta</button>"
      ];
    }),
    { vacio: "Este curso no tiene estudiantes registrados." });
}

/** Pinta la tabla de sesiones de la semana. */
function pintarTablaSesiones(lista) {
  var cont = document.getElementById("tablaSesiones");
  if (!cont) return;
  var filas = lista.slice().reverse().slice(0, 8).map(function (s) {
    var r = resumenSesion(s);
    return [
      "<span class='mono'>" + PIA.esc(s.codigo) + "</span>",
      PIA.esc(s.asignatura),
      PIA.fecha(s.fecha) + "<br><span class='pequeno gris'>B" + s.bloque + " · " + PIA.esc(s.hora_apertura) + " a " + PIA.esc(s.hora_cierre) + "</span>",
      "<span class='badge ok'>" + r.asistio + " ✔</span> <span class='badge mal'>" + r.falto + " ✕</span>",
      badgeSesion(s.estado),
      "<button class='btn pq' onclick='verSesion(" + s.id + ")'>Ver planilla</button>"
    ];
  });
  cont.innerHTML = PIA.tabla(["Código", "Asignatura", "Fecha", "Marcas", "Estado", ""], filas,
    { vacio: "Aún no hay sesiones de clase." });
}

/** Pinta todo el panel: indicadores, QR, planilla y sesiones. */
function pintarPanelDocente() {
  var lista = PIA.listar("sesiones");
  var sesion = sesionParaMostrar();
  pintarSelectorSesiones(lista, sesion);

  var estudiantes = estudiantesDelCurso("10°05");
  var regsHoy = PIA.listar("asistencias").filter(function (a) { return a.fecha === PIA.hoy(); });
  ponerTexto("kSesiones", lista.filter(function (x) { return x.fecha === PIA.hoy(); }).length);
  ponerTexto("kAsistenciasHoy", regsHoy.filter(function (a) { return a.estado === "ASISTIO"; }).length);
  ponerTexto("kFaltasHoy", regsHoy.filter(function (a) { return a.estado === "FALTO"; }).length);
  var suma = 0;
  estudiantes.forEach(function (e) { suma += porcentajeAsistencia(e.asistidas_mes, e.programadas_mes); });
  ponerTexto("kPromedio", (estudiantes.length ? Math.round(suma / estudiantes.length) : 0) + "%");

  var qr = document.getElementById("qrCaja");
  if (qr) {
    if (sesion && sesion.estado === "ABIERTA") pintarQR(sesion.token);
    else qr.innerHTML = "<div class='aviso'>Genera el QR de la clase con el botón de arriba. Mientras la ventana esté abierta, la planilla se llena sola.</div>";
  }
  var nota = document.getElementById("notaSesion");
  if (nota && sesion) {
    nota.textContent = sesion.codigo + " · " + sesion.estado + " · apertura " + sesion.hora_apertura + " · cierre " + sesion.hora_cierre;
  }
  pintarPlanilla(sesion);
  pintarTablaSesiones(lista);
}

/** Cambia la sesión que se está mirando. */
function elegirSesion(valor) {
  sesionElegida = valor ? Number(valor) : null;
  pintarPanelDocente();
}

/** Lleva la planilla a una sesión concreta. */
function verSesion(id) {
  sesionElegida = Number(id);
  pintarPanelDocente();
  var caja = document.getElementById("planilla");
  if (caja) caja.scrollIntoView({ behavior: "smooth", block: "center" });
}

/** Abre la sesión de clase y genera el token del QR. */
function abrirSesion() {
  var s = sesionActual();
  if (!s || s.rol !== "docente") { PIA.toast("Solo el docente puede abrir una sesión.", "mal"); return; }
  var asignatura = PIA.valor("sAsignatura");
  var bloque = Number(PIA.valor("sBloque")) || 1;
  if (!asignatura) { PIA.toast("Elige la asignatura.", "mal"); return; }
  var curso = PIA.valor("sCurso") || "10°05";
  var token = armarToken(asignatura, bloque);

  /* una sola clase abierta a la vez por curso */
  PIA.listar("sesiones").forEach(function (x) {
    if (x.curso === curso && x.estado === "ABIERTA") PIA.actualizar("sesiones", x.id, { estado: "CERRADA" });
  });

  var ahora = horaAhora();
  var sesion = PIA.insertar("sesiones", {
    codigo: token,
    token: token,
    asignatura: asignatura,
    docente: s.nombre,
    curso: curso,
    bloque: bloque,
    fecha: PIA.hoy(),
    hora_apertura: ahora,
    hora_cierre: sumarMinutos(ahora, MINUTOS_VENTANA),
    estado: "ABIERTA"
  });
  sesionElegida = sesion.id;
  PIA.toast("Sesión abierta: " + token);
  pintarPanelDocente();
}

/** Paso 5: cierra la ventana y registra la inasistencia de quien no escaneó. */
function cerrarVentanaDocente() {
  var sesion = sesionParaMostrar();
  if (!sesion) { PIA.toast("No hay una sesión para cerrar.", "mal"); return; }
  if (sesion.estado === "CERRADA") { PIA.toast("Esa sesión ya está cerrada.", "warn"); return; }
  if (!confirm("¿Cerrar la ventana y registrar la falta de quienes no escanearon?")) return;

  var estudiantes = estudiantesDelCurso(sesion.curso);
  var faltas = 0;
  estudiantes.forEach(function (e) {
    if (yaEscaneo(sesion.id, e.id)) return;
    PIA.insertar("asistencias", {
      id_sesion: sesion.id,
      id_estudiante: e.id,
      estudiante: e.nombre,
      asignatura: sesion.asignatura,
      fecha: sesion.fecha,
      hora: horaAhora(),
      estado: "FALTO",
      token: sesion.token,
      observacion: "No escaneó dentro de la ventana"
    });
    enviarNotificacionAcudiente(e, "Su hijo(a) no registró ingreso a la clase de " + sesion.asignatura + " del " + PIA.fecha(sesion.fecha) + ".");
    faltas++;
  });
  PIA.actualizar("sesiones", sesion.id, { estado: "CERRADA" });
  PIA.toast(faltas ? "Ventana cerrada: " + faltas + " inasistencia(s) y alertas enviadas." : "Ventana cerrada: todos escanearon.");
  pintarPanelDocente();
}

/** Marca una falta a mano, por ejemplo si el estudiante no tenía celular. */
function marcarFalta(idSesion, idEstudiante) {
  var sesion = PIA.listar("sesiones").filter(function (s) { return Number(s.id) === Number(idSesion); })[0];
  var estudiante = usuarioPorId(idEstudiante);
  if (!sesion || !estudiante) return;
  if (registroDe(sesion.id, estudiante.id)) { PIA.toast("Ese estudiante ya tiene una marca en esta clase.", "warn"); return; }
  if (!confirm("¿Registrar la falta de " + estudiante.nombre + " y avisar al acudiente?")) return;
  PIA.insertar("asistencias", {
    id_sesion: sesion.id,
    id_estudiante: estudiante.id,
    estudiante: estudiante.nombre,
    asignatura: sesion.asignatura,
    fecha: sesion.fecha,
    hora: horaAhora(),
    estado: "FALTO",
    token: sesion.token,
    observacion: "Registro manual del docente"
  });

/* ==========================================================================
   portal-acudiente.js
   --------------------------------------------------------------------------
   Lo que ve la familia: el semáforo del día, las clases a las que faltó y el
   porcentaje semanal y mensual de asistencia. Cierra el ciclo del algoritmo:
   el acudiente se entera el mismo día.
   ========================================================================== */

"use strict";

/** Fecha local en formato aaaa-mm-dd (sin pasar por UTC). */
function aTextoFecha(d) {
  var m = d.getMonth() + 1, dia = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (dia < 10 ? "0" : "") + dia;
}

/** Lunes y domingo de la semana de una fecha. */
function rangoSemana(fecha) {
  var d = new Date(String(fecha).slice(0, 10) + "T00:00:00");
  var dia = d.getDay();
  var atras = dia === 0 ? 6 : dia - 1;
  return {
    desde: aTextoFecha(new Date(d.getFullYear(), d.getMonth(), d.getDate() - atras)),
    hasta: aTextoFecha(new Date(d.getFullYear(), d.getMonth(), d.getDate() - atras + 6))
  };
}

/** Día de referencia: hoy si hay clases, o el último día que tuvo clases. */
function fechaReferencia() {
  var sesiones = PIA.listar("sesiones");
  var hoy = PIA.hoy();
  for (var i = 0; i < sesiones.length; i++) if (sesiones[i].fecha === hoy) return hoy;
  var mayor = "";
  for (var j = 0; j < sesiones.length; j++) if (String(sesiones[j].fecha) > mayor) mayor = String(sesiones[j].fecha);
  return mayor || hoy;
}

/** Los estudiantes asociados al acudiente que tiene la sesión abierta. */
function hijosDelAcudiente(sesion) {
  var ids = (sesion.estudiantes || []).map(function (x) { return Number(x); });
  return PIA.listar("usuarios").filter(function (u) {
    if (u.rol !== "estudiante") return false;
    if (ids.length) return ids.indexOf(Number(u.id)) !== -1;
    return u.acudiente_correo && u.acudiente_correo === sesion.correo;
  });
}

/** Asistencias y clases programadas de la semana de referencia. */
function asistenciaSemana(estudiante) {
  var rango = rangoSemana(fechaReferencia());
  var sesiones = PIA.listar("sesiones").filter(function (s) {
    return s.curso === estudiante.curso && String(s.fecha) >= rango.desde && String(s.fecha) <= rango.hasta;
  });
  var ids = sesiones.map(function (s) { return Number(s.id); });
  var asistio = PIA.listar("asistencias").filter(function (a) {
    return Number(a.id_estudiante) === Number(estudiante.id) &&
      ids.indexOf(Number(a.id_sesion)) !== -1 && a.estado === "ASISTIO";
  }).length;
  return {
    desde: rango.desde, hasta: rango.hasta,
    programadas: sesiones.length, asistidas: asistio,
    pct: sesiones.length ? porcentajeAsistencia(asistio, sesiones.length) : null
  };
}

/** Pinta el portal completo del acudiente. */
function pintarPortal() {
  var s = sesionActual();
  if (!s) return;
  pintarSesion();

  var hijos = hijosDelAcudiente(s);
  var sel = document.getElementById("hijo");
  var actual = sel && sel.value ? Number(sel.value) : (hijos.length ? Number(hijos[0].id) : 0);
  if (sel) {
    var opciones = "";
    hijos.forEach(function (h) {
      opciones += "<option value='" + h.id + "'" + (Number(h.id) === actual ? " selected" : "") + ">" +
        PIA.esc(h.nombre) + " · " + PIA.esc(h.curso || "") + "</option>";
    });
    sel.innerHTML = opciones || "<option value=''>Sin estudiantes asociados</option>";
    actual = Number(sel.value) || actual;
  }

  var hijo = null;
  hijos.forEach(function (h) { if (Number(h.id) === actual) hijo = h; });
  if (!hijo) hijo = hijos[0] || null;

  var ficha = document.getElementById("fichaEstudiante");
  if (!hijo) {
    if (ficha) ficha.innerHTML = "<div class='aviso mal'>Tu usuario no tiene estudiantes asociados. Pídele al docente que actualice el registro.</div>";
    return;
  }

  var pctMes = porcentajeAsistencia(hijo.asistidas_mes, hijo.programadas_mes);
  var semana = asistenciaSemana(hijo);
  if (ficha) {
    ficha.innerHTML = "<p class='ayuda'>Curso " + PIA.esc(hijo.curso) + " · acudiente " + PIA.esc(hijo.acudiente || "") +
      " · " + PIA.esc(hijo.acudiente_correo || "") + "</p>" +
      "<div class='fila'><span class='badge neutro'>Documento " + PIA.esc(hijo.documento) + "</span>" +
      "<span class='badge neutro'>Año lectivo 2026</span>" +
      "<span class='badge info'>Semana del " + PIA.fecha(semana.desde) + " al " + PIA.fecha(semana.hasta) + "</span></div>";
  }

  ponerTexto("kMes", pctMes + "%");
  ponerTexto("kSemana", semana.pct === null ? "—" : semana.pct + "%");

  var delDia = PIA.listar("sesiones").filter(function (x) {
    return x.curso === hijo.curso && x.fecha === fechaReferencia();
  });
  ponerTexto("kClases", delDia.length);
  var alertas = PIA.listar("alertas").filter(function (a) { return Number(a.id_estudiante) === Number(hijo.id); });
  ponerTexto("kAlertas", alertas.length);

  var semaforo = document.getElementById("semaforoHoy");
  if (semaforo) {
    semaforo.innerHTML = PIA.tabla(["Clase", "Hora", "Semáforo", "Observación"],
      delDia.map(function (x) {
        var reg = registroDe(x.id, hijo.id);
        return [
          PIA.esc(x.asignatura) + "<br><span class='pequeno gris'>Bloque " + x.bloque + " · " + PIA.fecha(x.fecha) + "</span>",
          PIA.esc(x.hora_apertura) + " a " + PIA.esc(x.hora_cierre),
          badgeSemaforo(reg ? reg.estado : ""),
          reg ? PIA.esc(reg.observacion || "") : "El docente aún no cierra la ventana"
        ];
      }),
      { vacio: "Ese día no hubo clases registradas." });
  }

  var cajaAlertas = document.getElementById("alertasAcudiente");
  if (cajaAlertas) {
    var ordenadas = alertas.slice().sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); });
    cajaAlertas.innerHTML = PIA.tabla(["Fecha", "Mensaje", "Estado"],
      ordenadas.slice(0, 6).map(function (a) {
        return [PIA.fecha(a.fecha) + "<br><span class='pequeno gris'>" + PIA.esc(a.hora) + "</span>",
          PIA.esc(a.mensaje), "<span class='badge warn'>" + PIA.esc(a.estado) + "</span>"];
      }),
      { vacio: "No hay alertas para este estudiante. Buena señal." });
  }

  var detalle = document.getElementById("detalleSemana");
  if (detalle) {
    var deLaSemana = PIA.listar("sesiones").filter(function (x) {
      return x.curso === hijo.curso && String(x.fecha) >= semana.desde && String(x.fecha) <= semana.hasta;
    });
    detalle.innerHTML = PIA.tabla(["Fecha", "Asignatura", "Bloque", "Estado del estudiante"],
      deLaSemana.map(function (x) {
        var reg = registroDe(x.id, hijo.id);
        return [PIA.fecha(x.fecha), PIA.esc(x.asignatura), "B" + x.bloque, badgeSemaforo(reg ? reg.estado : "")];
      }),
      { vacio: "Esta semana no tiene clases registradas." });
  }
}

/* Arranque del portal del acudiente. */
document.addEventListener("DOMContentLoaded", function () {
  if (!document.getElementById("semaforoHoy")) return;
  var s = exigirSesion("acudiente");
  if (!s) return;
  pintarPortal();
});

  hoja.textContent = css;
  document.head.appendChild(hoja);

  function pintar(i) {
    var pagina = paginas[i];
    var cuerpo = pagina.cuerpo;
    Object.keys(imagenes).forEach(function (nombre) {
      cuerpo = cuerpo.split(nombre).join(imagenes[nombre]);
    });
    document.body.className = pagina.layout || "layout-top";
    var COMILLA = String.fromCharCode(34);
    pantalla.innerHTML = "<div class=" + COMILLA + "pia-pagina" + COMILLA + ">" + cuerpo + "</div>";

    /* se vuelve a ejecutar el JavaScript del proyecto para esta página */
    var viejo = document.getElementById("piaJsVivo");
    if (viejo) viejo.parentNode.removeChild(viejo);
    var nuevo = document.createElement("script");
    nuevo.id = "piaJsVivo";
    nuevo.textContent = js;
    document.body.appendChild(nuevo);

    /* se avisa que la página cargó, para que los módulos pinten sus datos */
    setTimeout(function () {
      document.dispatchEvent(new Event("DOMContentLoaded"));
      window.dispatchEvent(new Event("load"));
    }, 40);

    /* los enlaces del menú cambian de página dentro del mismo archivo */
    var enlaces = pantalla.querySelectorAll(".menu a, .menu-tabs a");
    Array.prototype.forEach.call(enlaces, function (a) {
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        var destino = a.getAttribute("href");
        for (var j = 0; j < paginas.length; j++) {
          if (paginas[j].archivo === destino) { ir(j); return; }
        }
      });
    });
    window.scrollTo(0, 0);
  }

  function ir(i) {
    var botones = barra.querySelectorAll("button");
    Array.prototype.forEach.call(botones, function (b, j) {
      if (j === i) b.classList.add("activo"); else b.classList.remove("activo");
    });
    pintar(i);
  }

  window.PIA_ir = function (archivo) {
    for (var j = 0; j < paginas.length; j++) if (paginas[j].archivo === archivo) return ir(j);
  };

  paginas.forEach(function (p, i) {
    var b = document.createElement("button");
    b.textContent = p.nombre;
    if (i === 0) b.className = "activo";
    b.onclick = function () { ir(i); };
    barra.appendChild(b);
  });

  var info = document.createElement("span");
  info.className = "aviso";
  info.textContent = paginas.length + " páginas · un solo archivo";
  barra.appendChild(info);

  pintar(0);
})();</script>
</body>
</html>
