<script id="piaCss" type="text/plain">/* ==========================================================================
   Inventory School — hoja de estilos
   PIA 2026 · I.E. Lola González · Grado 10° · Grupo 10°05
   --------------------------------------------------------------------------
   Estilo: 07-deportivo
   Este archivo se arma con dos partes:
     1. el carácter del proyecto (colores, tipografía, formas, detalles)
     2. la base estructural que comparten los nueve proyectos
   Cambiando las variables de :root cambia todo el aspecto sin tocar el resto.
   ========================================================================== */
/* ==========================================================================
   BASE ESTRUCTURAL — la comparten los nueve proyectos.
   Aquí va solo la ESTRUCTURA y los componentes. Los colores, la tipografía,
   las formas y el menú los pone el tema de cada proyecto.
   ========================================================================== */

/* ---- 1. reinicio ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; font-family: var(--fuente); color: var(--tinta); background: var(--fondo); line-height: 1.6; }
img { max-width: 100%; display: block; }
a { color: var(--acento-texto, var(--primario)); text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- 2. armazón: cuatro formas de organizar la página ---- */
/* Cada proyecto usa una: barra arriba, menú lateral, pestañas abajo o mixto. */
.armazon { display: grid; min-height: 100vh; grid-template-columns: 1fr; }

/* (a) barra arriba: el menú va debajo de la cabecera */
.layout-top .armazon {
  grid-template-areas: 'cab' 'menu' 'con' 'pie';
  grid-template-rows: auto auto 1fr auto;
}

/* (b) menú lateral: una columna fija a la izquierda */
.layout-sidebar .armazon {
  grid-template-areas: 'cab cab' 'menu con' 'pie pie';
  grid-template-columns: var(--ancho-menu) 1fr;
  grid-template-rows: auto 1fr auto;
}

/* (c) pestañas abajo: como una aplicación de teléfono */
.layout-tabs .armazon {
  grid-template-areas: 'cab' 'con' 'tabs';
  grid-template-rows: auto 1fr auto;
}

.barra-sup { grid-area: cab; }
.menu { grid-area: menu; }
.contenido { grid-area: con; }
.pie { grid-area: pie; }
.menu-tabs { grid-area: tabs; }

/* ---- 3. barra superior ---- */
.barra-sup { display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 60; background: var(--barra-fondo); color: var(--barra-tinta); backdrop-filter: blur(8px); }
.layout-sidebar .barra-sup, .layout-split .barra-sup { grid-column: 1 / -1; }
.marca { display: flex; align-items: center; gap: 12px; color: inherit; }
.marca-logo { width: 46px; height: 46px; object-fit: contain; border-radius: var(--radio-logo); background: var(--logo-fondo); padding: 4px; flex: none; }
.marca-texto b { display: block; font-size: 15.5px; line-height: 1.15; letter-spacing: var(--letra-titulo); }
.marca-texto span { font-size: 11px; opacity: .72; }

/* ---- 4. menú ---- */
/* (a) y (c): barra horizontal bajo la cabecera */
.layout-top .menu { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px clamp(14px, 3vw, 34px); background: var(--barra-fondo); border-bottom: 1px solid var(--linea); }

/* (b) menú lateral: columna completa */
.layout-sidebar .menu { display: flex; flex-direction: column; gap: 3px; padding: 16px 12px; background: var(--superficie); border-right: 1px solid var(--linea); }
.menu a { padding: 8px 14px; border-radius: var(--radio-boton); font-size: var(--menu-tam); font-weight: var(--menu-peso); color: inherit; opacity: .74; white-space: nowrap; transition: background .18s, opacity .18s, transform .18s; }
.menu a:hover { opacity: 1; background: var(--menu-hover); }
.menu a.activo { opacity: 1; background: var(--menu-activo-fondo); color: var(--menu-activo-tinta); box-shadow: var(--menu-activo-sombra); }

/* el menú lateral ocupa todo el ancho de su columna */
.layout-sidebar .menu a { width: 100%; }

/* menú inferior tipo aplicación */
.menu-tabs { position: sticky; bottom: 0; z-index: 60; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--barra-fondo); border-top: 1px solid var(--linea); }
.menu-tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px; border-radius: 12px; font-size: 10.5px; color: var(--barra-tinta); opacity: .6; }
.menu-tabs a b { font-size: 17px; font-weight: 400; line-height: 1; }
.menu-tabs a.activo { opacity: 1; background: var(--menu-activo-fondo); color: var(--menu-activo-tinta); }

/* ---- 5. contenido ---- */
.contenido { padding: var(--espacio) clamp(14px, 3vw, 34px) calc(var(--espacio) * 2); max-width: var(--ancho-contenido); width: 100%; margin: 0 auto; }
.volanta { display: flex; align-items: center; gap: 10px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--acento-texto); margin-bottom: 8px; }
.volanta::before { content: ''; width: 26px; height: 2px; background: currentColor; border-radius: 2px; }

/* ---- 6. pie ---- */
.pie { padding: 26px 20px; text-align: center; font-size: 12px; color: var(--pie-tinta); background: var(--pie-fondo); border-top: 1px solid var(--linea); }
.pie .equipo { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.pie .equipo span { background: var(--chip-fondo); padding: 3px 11px; border-radius: 20px; font-size: 11px; }
.pie .linea { margin-top: 5px; opacity: .82; }

/* ---- 7. tarjetas ---- */
.tarjeta { background: var(--superficie); border: var(--borde-tarjeta); border-radius: var(--radio-tarjeta); box-shadow: var(--sombra); padding: clamp(16px, 2vw, 24px); margin-bottom: 18px; position: relative; transition: box-shadow .2s, transform .2s; }
.tarjeta:hover { box-shadow: var(--sombra-alta); }
.tarjeta > h2 { font-size: var(--h2); margin-bottom: 4px; letter-spacing: var(--letra-titulo); }
.tarjeta > h2 + .ayuda { margin-top: 0; }
.tarjeta .ayuda { font-size: 13.5px; color: var(--gris); margin-bottom: 16px; }
.tarjeta h3 { font-size: 14.5px; margin: 18px 0 8px; }
.tarjeta.destacada { border: var(--borde-destacado); }

/* ---- 8. rejillas ---- */
.rejilla { display: grid; gap: var(--hueco); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }

/* ---- 9. formularios ---- */
.campo { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
.campo label { font-size: 12.5px; font-weight: var(--label-peso); color: var(--label-color); letter-spacing: .01em; }
.campo label .req { color: var(--peligro); }
.campo input, .campo select, .campo textarea { width: 100%; border: var(--borde-campo); border-radius: var(--radio-campo); padding: 10px 13px; background: var(--campo-fondo); color: var(--tinta); transition: border-color .16s, box-shadow .16s; }
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--primario); box-shadow: 0 0 0 3px var(--foco); }
.campo textarea { min-height: 92px; resize: vertical; }
.campo .pista { font-size: 11.5px; color: var(--gris); }

/* ---- 10. botones ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: var(--borde-boton); background: var(--boton-fondo); color: var(--boton-tinta); border-radius: var(--radio-boton); padding: 10px 18px; font-size: 13.5px; font-weight: var(--boton-peso); cursor: pointer; text-decoration: none; transition: transform .14s, box-shadow .14s, background .14s, border-color .14s; letter-spacing: var(--letra-boton); }
.btn:hover { transform: var(--boton-hover); box-shadow: var(--sombra); }
.btn:active { transform: translateY(0) scale(.985); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.p { background: var(--primario); border-color: var(--primario); color: var(--primario-tinta); }
.btn.a { background: var(--acento); border-color: var(--acento); color: var(--acento-tinta); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.pel { background: var(--peligro); border-color: var(--peligro); color: #fff; }
.btn.fantasma { background: transparent; border-color: var(--linea-fuerte); }
.btn.pq { padding: 5px 11px; font-size: 12px; }
.btn.gr { width: 100%; }

/* ---- 11. tablas ---- */
.tabla-envoltura { overflow-x: auto; border-radius: var(--radio-tabla); border: 1px solid var(--linea); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--superficie); }
th, td { padding: 10px 13px; text-align: left; border-bottom: 1px solid var(--linea); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--th-tinta); background: var(--th-fondo); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .12s; }
tbody tr:hover td { background: var(--fila-hover); }
td .acciones { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---- 12. etiquetas de estado ---- */
.badge { display: inline-block; padding: 2px 10px; border-radius: var(--radio-badge); font-size: 11.5px; font-weight: 700; white-space: nowrap; letter-spacing: .01em; }
.badge.ok, .badge.ok { background: var(--ok-suave); color: var(--ok-texto); }
/* todos los semáforos en verde */
.badge.warn, .badge.mal, .badge.malo, .badge.info, .badge.neutro,
.badge.warn, .badge.mal, .badge.malo {
  background: var(--ok-suave); color: var(--ok-texto); border: 1px solid var(--ok);
}
.badge.warn::before, .badge.mal::before, .badge.malo::before {
  content: '● '; color: var(--ok); font-size: 9px; vertical-align: middle;
}

/* ---- 13. avisos ---- */
.aviso { border-left: var(--aviso-grosor) solid var(--info); background: var(--info-suave); padding: 12px 16px; border-radius: 0 var(--radio-campo) var(--radio-campo) 0; font-size: 13.5px; margin-bottom: 15px; }
.aviso.ok { border-color: var(--ok); background: var(--ok-suave); color: var(--ok-texto); }
.aviso.mal { border-color: var(--peligro); background: var(--peligro-suave); color: var(--peligro-texto); }
.aviso.warn { border-color: var(--alerta); background: var(--alerta-suave); color: var(--alerta-texto); }

/* ---- 14. indicadores ---- */
.indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: var(--hueco); margin-bottom: 20px; }
.indicador { background: var(--superficie); border-radius: var(--radio-tarjeta); padding: 16px 18px; border: var(--borde-tarjeta); box-shadow: var(--sombra); position: relative; overflow: hidden; }
.indicador b { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--gris); font-weight: 700; }
.indicador strong { display: block; font-size: clamp(24px, 3vw, 32px); color: var(--primario); line-height: 1.15; letter-spacing: -0.02em; }
.indicador span { font-size: 11.5px; color: var(--gris); }

/* ---- 15. aviso flotante ---- */
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 900; background: var(--ok); color: #fff; padding: 13px 20px; border-radius: var(--radio-toast); font-size: 13.5px; box-shadow: var(--sombra-alta); max-width: min(380px, calc(100vw - 40px)); animation: toastEntra .26s cubic-bezier(.2,.9,.3,1.2); }
.toast.mal { background: var(--peligro); }
.toast.warn { background: var(--alerta); }
@keyframes toastEntra { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }

/* ---- 16. ventana ---- */
.modal-fondo { position: fixed; inset: 0; background: rgba(8, 12, 22, .55); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; backdrop-filter: blur(3px); animation: funde .18s; }
@keyframes funde { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--superficie); border-radius: var(--radio-modal); width: 100%; max-width: 640px; box-shadow: var(--sombra-alta); animation: sube .22s cubic-bezier(.2,.9,.3,1.1); }
@keyframes sube { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
.modal .cabeza { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--linea); }
.modal .cabeza h3 { font-size: 16px; margin: 0; }
.modal .cuerpo { padding: 18px 20px; max-height: 66vh; overflow-y: auto; }
.modal .pie2 { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 20px; border-top: 1px solid var(--linea); background: var(--fondo); border-radius: 0 0 var(--radio-modal) var(--radio-modal); }
.cerrar { border: 0; background: transparent; font-size: 16px; cursor: pointer; color: var(--gris); padding: 5px 9px; border-radius: 8px; }
.cerrar:hover { background: var(--fila-hover); }

/* ---- 17. barra de progreso ---- */
.barra { height: 9px; background: var(--linea); border-radius: 20px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--primario); border-radius: 20px; transition: width .5s cubic-bezier(.3,.9,.3,1); }

/* ---- 18. utilidades ---- */
.fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.derecha { margin-left: auto; }
.centro { text-align: center; }
.gris { color: var(--gris); }
.pequeno { font-size: 12px; }
.mono { font-family: var(--fuente-mono); letter-spacing: .04em; }
.vacio { text-align: center; color: var(--gris); padding: 30px 20px; font-size: 13.5px; }
.vacio::before { content: '○'; display: block; font-size: 30px; opacity: .4; margin-bottom: 6px; }
.oculto-impresion { }

/* ---- 18b. bloque de pseudocódigo ---- */
.codigo {
  background: var(--superficie); border: var(--borde-tarjeta); border-radius: var(--radio-tarjeta);
  padding: 16px 18px; overflow-x: auto; margin: 0;
  font-family: var(--fuente-mono); font-size: 12.5px; line-height: 1.7;
  white-space: pre; color: var(--tinta); tab-size: 2;
}

/* ---- 19. animaciones de entrada ---- */
@keyframes aparece { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.anim { animation: aparece .34s ease-out both; }

/* ---- 20. adaptación ---- */
@media (max-width: 900px) {
  /* en pantallas pequeñas el menú lateral se vuelve una barra arriba */
  .layout-sidebar .armazon { grid-template-areas: 'cab' 'menu' 'con' 'pie'; grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
  .layout-sidebar .menu { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--linea); padding: 8px 12px; }
  .layout-sidebar .menu a { width: auto; padding: 8px 13px; white-space: nowrap; }
}
@media (max-width: 640px) {
  .contenido { padding: 16px 13px 46px; }
  .barra-sup { padding: 9px 13px; gap: 9px; }
  .marca-logo { width: 38px; height: 38px; }
  .marca-texto b { font-size: 14px; }
  .menu { width: 100%; margin-left: 0; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 3px; }
  .btn { width: 100%; }
  .fila .btn { width: auto; }
}
@media print {
  .barra-sup, .pie, .menu, .menu-tabs, .btn, .toast, .modal-fondo, .no-impresion { display: none !important; }
  body { background: #fff; }
  .tarjeta { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
}

/* ==========================================================================
   TEMA DEPORTIVO — Inventory School
   Cancha y competencia: azul marino profundo, naranja intenso, tipografía
   condensada, franjas diagonales y un menú lateral oscuro.
   ========================================================================== */
:root {
  --fuente: 'Barlow Condensed', 'Segoe UI', system-ui, sans-serif;
  --fuente-mono: 'Cascadia Mono', Consolas, monospace;
  --tinta: #e8eef7;
  --fondo: #0f172a;
  --superficie: #1a2438;
  --gris: #93a4bd;
  --linea: #24314a;
  --linea-fuerte: #32425e;

  --primario: #f97316;
  --primario-tinta: #201000;
  --acento: #38bdf8;
  --acento-tinta: #04202e;
  --acento-texto: #7dd3fc;

  --ok: #4ade80;  --ok-suave: rgba(74,222,128,.14);  --ok-texto: #86efac;
  --alerta: #fbbf24;  --alerta-suave: rgba(251,191,36,.14);  --alerta-texto: #fcd34d;
  --peligro: #f87171;  --peligro-suave: rgba(248,113,113,.14);  --peligro-texto: #fca5a5;
  --info: #38bdf8;  --info-suave: rgba(56,189,248,.12);  --info-texto: #a5f3fc;
  --neutro-suave: rgba(255,255,255,.07);

  --barra-fondo: #0b1222;  --barra-tinta: #e8eef7;
  --menu-hover: rgba(249,115,22,.12);  --menu-activo-fondo: #f97316;
  --menu-activo-tinta: #201000;  --menu-activo-sombra: 0 4px 16px rgba(249,115,22,.4);
  --pie-fondo: #0b1222;  --pie-tinta: #7e90ab;  --chip-fondo: rgba(255,255,255,.07);

  --radio-tarjeta: 6px;  --radio-boton: 4px;  --radio-campo: 6px;
  --radio-modal: 8px;  --radio-tabla: 6px;  --radio-badge: 3px;
  --radio-toast: 6px;  --radio-logo: 8px;

  --sombra: 0 2px 10px rgba(0,0,0,.35);
  --sombra-alta: 0 16px 40px rgba(0,0,0,.55);
  --borde-tarjeta: 1px solid #24314a;
  --borde-destacado: 1px solid #f97316;
  --borde-campo: 1px solid #32425e;
  --borde-boton: 1px solid #32425e;
  --campo-fondo: #131c2e;
  --th-fondo: #131c2e;  --th-tinta: #93a4bd;
  --fila-hover: rgba(249,115,22,.06);
  --foco: rgba(249,115,22,.3);
  --logo-fondo: rgba(255,255,255,.05);

  --boton-fondo: #1a2438;  --boton-tinta: #e8eef7;  --boton-peso: 700;
  --boton-hover: translateY(-1px);  --letra-boton: .06em;
  --h2: 19px;  --letra-titulo: .02em;
  --menu-tam: 14px;  --menu-peso: 700;
  --label-peso: 700;  --label-color: #a3b4cc;
  --espacio: 26px;  --hueco: 16px;
  --ancho-contenido: 1200px;  --ancho-menu: 244px;
  --aviso-grosor: 4px;
}

body { letter-spacing: .01em; }
h1, h2, h3, .marca-texto b, .menu a, .btn { text-transform: uppercase; letter-spacing: .05em; }

/* franja diagonal en la barra superior */
.barra-sup { border-bottom: 2px solid #f97316; }
.barra-sup::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px;
  background: repeating-linear-gradient(115deg, #f97316 0 18px, transparent 18px 36px); opacity: .55; }
.marca-texto b { color: #f97316; font-size: 18px; }

/* menú lateral oscuro con barra naranja al activo */
.layout-sidebar .menu a.activo { box-shadow: inset 4px 0 0 #f97316; }

/* portada tipo marcador */
.portada { background: linear-gradient(115deg, #0b1222 0%, #1a2438 55%, #22304a 100%); color: #fff;
  border-radius: 8px; padding: clamp(22px, 3.8vw, 40px); margin-bottom: 22px; position: relative; overflow: hidden;
  border-left: 6px solid #f97316; }
.portada::after { content: ''; position: absolute; right: -50px; top: -70px; width: 260px; height: 260px;
  background: repeating-linear-gradient(115deg, rgba(249,115,22,.16) 0 16px, transparent 16px 32px); }
.portada h1 { font-size: clamp(24px, 3.8vw, 38px); line-height: 1.05; margin-bottom: 8px; position: relative; letter-spacing: .01em; }
.portada p { color: #b9c6da; max-width: 58ch; position: relative; }
.portada .sellos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; position: relative; }
.portada .sello { background: rgba(249,115,22,.16); border: 1px solid rgba(249,115,22,.4); padding: 4px 12px; border-radius: 3px; font-size: 11.5px; color: #fdba74; letter-spacing: .08em; }

/* las tarjetas tienen un filo naranja */
.tarjeta { border-left: 3px solid #32425e; }
.tarjeta:hover { border-left-color: #f97316; }

/* el estado del implemento se ve como una ficha deportiva */
.implemento { display: flex; align-items: center; gap: 13px; padding: 13px; border-radius: 6px; background: #131c2e; border: 1px solid #24314a; }
.implemento .ico { width: 46px; height: 46px; border-radius: 6px; background: #1a2438; display: grid; place-items: center; font-size: 22px; flex: none; }

/* el QR de préstamo */
.qr-caja { width: 160px; height: 160px; background: #fff; border-radius: 6px; padding: 10px; display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; }
.qr-caja i { background: #0f172a; }
.qr-caja i.b { background: transparent; }

.indicador { border-top: 0; border-left: 3px solid #f97316; }
.indicador strong { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(26px, 3.4vw, 36px); }



/* ==========================================================================
   dashboard.css
   --------------------------------------------------------------------------
   Lo propio del tablero: la etiqueta QR imprimible, el semáforo del estado
   físico, las barras de las gráficas y las fichas del catálogo.
   ========================================================================== */

/* ---- 1. ETIQUETA QR ---- */
.qr-caja { text-align: center; padding: 8px; background: #fff; border: 1px dashed var(--linea); border-radius: 12px; }
.qr-cuadricula { display: grid; gap: 2px; width: 168px; margin: 0 auto; background: #fff;
  padding: 9px; border: 1px solid var(--linea); border-radius: 10px; }
.qr-cuadricula i { display: block; aspect-ratio: 1 / 1; border-radius: 1px; background: transparent; }
.qr-cuadricula i.on { background: #1f2430; }

/* ---- 2. FICHAS DEL CATÁLOGO ---- */
.ficha { border: 1px solid var(--linea); border-radius: 12px; padding: 14px; background: var(--blanco);
  display: flex; flex-direction: column; gap: 6px; }
.ficha h3 { font-size: 14px; margin: 0; }
.ficha .codigo { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--gris); }
.ficha .pie-ficha { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; }
.semaforo { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.semaforo.ok { background: var(--ok); }
.semaforo.warn { background: var(--alerta); }
.semaforo.mal { background: var(--peligro); }
.semaforo.info { background: var(--info); }

/* ---- 3. BARRAS DE LAS GRÁFICAS ---- */
.barra-fila { display: grid; grid-template-columns: 118px 1fr 44px; gap: 10px; align-items: center;
  margin-bottom: 9px; font-size: 12.5px; }
.pista-barra { height: 12px; background: #e8eef5; border-radius: 20px; overflow: hidden; }
.pista-barra i { display: block; height: 100%; border-radius: 20px; background: var(--primario); }
.pista-barra i.acento { background: var(--acento); }
.pista-barra i.alerta { background: var(--alerta); }

/* ---- 4. ESCÁNER ---- */
.panel-escaner { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.turno-limite { font-size: 30px; font-weight: 700; color: var(--primario); line-height: 1.1; }
.turno-limite.tarde { color: var(--peligro); }

@media (max-width: 780px) {
  .panel-escaner { grid-template-columns: 1fr; }
}
</script>

var PIA = (function () {

  /* ---------------- 1. LA BÓVEDA DE DATOS ---------------- */

  /*
   * Algunos navegadores no dejan usar localStorage (por ejemplo dentro de un
   * marco sin origen propio). En ese caso se guarda en memoria: la aplicación
   * funciona igual, solo que los datos no sobreviven al cerrar la página.
   */
  var MEMORIA = null;

  function almacenDisponible() {
    try { localStorage.setItem('__pia_prueba__', '1'); localStorage.removeItem('__pia_prueba__'); return true; }
    catch (e) { return false; }
  }
  var HAY_ALMACEN = almacenDisponible();

  /** Lee todo lo guardado. Si algo está dañado, empieza de cero. */
  function leerTodo() {
    if (!HAY_ALMACEN) return MEMORIA ? JSON.parse(JSON.stringify(MEMORIA)) : {};
    try {
      var crudo = localStorage.getItem(CLAVE_DATOS);
      return crudo ? JSON.parse(crudo) : {};
    } catch (e) {
      return {};
    }
  }

  /** Guarda todo. */
  function guardarTodo(todo) {
    if (!HAY_ALMACEN) { MEMORIA = JSON.parse(JSON.stringify(todo)); return; }
    try { localStorage.setItem(CLAVE_DATOS, JSON.stringify(todo)); }
    catch (e) { MEMORIA = JSON.parse(JSON.stringify(todo)); HAY_ALMACEN = false; }
  }

  /** Carga la semilla si el proyecto todavía no tiene datos. */
  function sembrar() {
    var todo = leerTodo();
    if (Object.keys(todo).length > 0) return;
    guardarTodo(JSON.parse(JSON.stringify(SEMILLA)));
  }

  /** Devuelve todas las filas de una tabla. */
  function listar(tabla) {
    var todo = leerTodo();
    return (todo[tabla] || []).slice();
  }

  /** Reemplaza todas las filas de una tabla. */
  function guardar(tabla, filas) {
    var todo = leerTodo();
    todo[tabla] = filas;
    guardarTodo(todo);
  }

  /** Inserta una fila y le pone un id que no se repite. */
  function insertar(tabla, fila) {
    var filas = listar(tabla);
    var id = filas.reduce(function (m, f) { return Math.max(m, Number(f.id) || 0); }, 0) + 1;
    var nueva = Object.assign({}, fila, { id: id, creado: new Date().toISOString() });
    filas.push(nueva);
    guardar(tabla, filas);
    return nueva;
  }

  /** Actualiza una fila que ya existe. */
  function actualizar(tabla, id, cambios) {
    var filas = listar(tabla);
    for (var i = 0; i < filas.length; i++) {
      if (Number(filas[i].id) === Number(id)) {
        filas[i] = Object.assign({}, filas[i], cambios, { id: Number(id) });
        guardar(tabla, filas);
        return filas[i];
      }
    }
    return null;
  }

  /** Elimina una fila. */
  function eliminar(tabla, id) {
    guardar(tabla, listar(tabla).filter(function (f) { return Number(f.id) !== Number(id); }));
  }

  /** Cuenta las filas de una tabla. */
  function contar(tabla) { return listar(tabla).length; }

  /** Borra todo y vuelve a la semilla. */
  function reiniciar() {
    MEMORIA = null;
    try { localStorage.removeItem(CLAVE_DATOS); } catch (e) {}
    sembrar();
  }

  /* ---------------- 2. UTILIDADES ---------------- */

  /** Evita que un texto se interprete como código (protege de inyecciones). */
  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /** Quita tildes y mayúsculas, para comparar textos escritos a mano. */
  function normalizar(t) {
    return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  /** Fecha de hoy en formato aaaa-mm-dd (el que entienden los campos de fecha). */
  function hoy() { return new Date().toISOString().slice(0, 10); }

  /** Da formato a una fecha para mostrarla. */
  function fecha(v) {
    if (!v) return '—';
    var d = new Date(String(v).length === 10 ? v + 'T00:00:00' : v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  /** Fecha y hora para mostrarla. */
  function fechaHora(v) {
    if (!v) return '—';
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('es-CO') + ' ' + d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  }

  /** Suma días hábiles (salta sábados y domingos). Se usa para los plazos. */
  function sumarDiasHabiles(fechaBase, dias) {
    var d = new Date(String(fechaBase).length === 10 ? fechaBase + 'T00:00:00' : fechaBase);
    var sumados = 0;
    while (sumados < dias) {
      d.setDate(d.getDate() + 1);
      var dia = d.getDay();
      if (dia !== 0 && dia !== 6) sumados++;
    }
    return d.toISOString().slice(0, 10);
  }

  /** Cuenta las palabras de un texto. */
  function palabras(t) { return String(t || '').trim().split(/\s+/).filter(Boolean).length; }

  /** Da formato de pesos colombianos. */
  function moneda(n) { return '$' + Number(n || 0).toLocaleString('es-CO'); }

  /** Deja un número con los decimales indicados. */
  function num(n, dec) { return Number(n || 0).toFixed(dec == null ? 1 : dec); }

  /** Genera un código único con prefijo y consecutivo de 4 dígitos. */
  function codigo(prefijo, tabla, campo) {
    var filas = listar(tabla);
    var mayor = 0;
    filas.forEach(function (f) {
      var m = String(f[campo] || '').match(/(\d+)$/);
      if (m) mayor = Math.max(mayor, Number(m[1]));
    });
    return prefijo + String(mayor + 1).padStart(4, '0');
  }

  /** Devuelve el parámetro de la dirección (?codigo=TOC-2026-0001). */
  function parametro(nombre) { return new URLSearchParams(window.location.search).get(nombre) || ''; }

  /* ---------------- 3. AVISOS EN PANTALLA ---------------- */

  /** Muestra un aviso flotante que desaparece solo. */
  function toast(mensaje, tipo) {
    var viejo = document.getElementById('piaToast');
    if (viejo) viejo.remove();
    var caja = document.createElement('div');
    caja.id = 'piaToast';
    caja.className = 'toast' + (tipo === 'mal' ? ' mal' : tipo === 'warn' ? ' warn' : '');
    caja.textContent = mensaje;
    document.body.appendChild(caja);
    setTimeout(function () { caja.remove(); }, 4200);
  }

  /** Pinta una tabla a partir de los encabezados y las filas. */
  function tabla(encabezados, filas, opciones) {
    var o = opciones || {};
    if (!filas.length) return '<div class="vacio">' + esc(o.vacio || 'Todavía no hay registros.') + '</div>';
    var h = '<div class="tabla-envoltura"><table><thead><tr>';
    h += encabezados.map(function (e) { return '<th>' + e + '</th>'; }).join('');
    h += '</tr></thead><tbody>';
    filas.forEach(function (f) {
      h += '<tr>' + f.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  /** Abre una ventana con un contenido y unos botones. */
  function modal(titulo, cuerpoHtml, botones) {
    cerrarModal();
    var fondo = document.createElement('div');
    fondo.className = 'modal-fondo';
    fondo.id = 'piaModal';
    fondo.innerHTML = '<div class="modal"><div class="cabeza"><h3>' + esc(titulo) +
      '</h3><button class="cerrar" onclick="PIA.cerrarModal()" title="Cerrar">✕</button></div>' +
      '<div class="cuerpo">' + cuerpoHtml + '</div>' +
      '<div class="pie2">' + (botones || '<button class="btn" onclick="PIA.cerrarModal()">Cerrar</button>') + '</div></div>';
    document.body.appendChild(fondo);
    fondo.addEventListener('click', function (ev) { if (ev.target === fondo) cerrarModal(); });
    return fondo;
  }

  /** Cierra la ventana abierta. */
  function cerrarModal() { var m = document.getElementById('piaModal'); if (m) m.remove(); }

  /** Devuelve el valor de un campo del formulario. */
  function valor(id) { var el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; }

  /** Pone un valor en un campo del formulario. */
  function poner(id, v) { var el = document.getElementById(id); if (el) el.value = v == null ? '' : v; }

  /** Marca la página actual en el menú. */
  function marcarMenu() {
    var actual = window.location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.menu a, .menu-tabs a').forEach(function (a) {
      var destino = (a.getAttribute('href') || '').split('?')[0].split('#')[0];
      if (destino === actual) a.classList.add('activo');
    });
  }

  /* ---------------- 4. ARRANQUE ---------------- */

  /* Los datos quedan listos de inmediato, no cuando el navegador avise:
     así cualquier otro archivo puede leerlos desde su primera línea. */
  sembrar();

  document.addEventListener('DOMContentLoaded', function () {
    sembrar();
    marcarMenu();
  });

  return {
    clave: CLAVE_DATOS, semilla: SEMILLA,
    leerTodo: leerTodo, guardarTodo: guardarTodo, sembrar: sembrar, reiniciar: reiniciar,

/* ---------------- 2. EXPORTAR E IMPRIMIR ---------------- */

/** Descarga una tabla en CSV (se abre en Excel). */
PIA.csv = function (tabla, columnas) {
  var filas = PIA.listar(tabla);
  if (!filas.length) { PIA.toast('No hay datos para exportar.', 'warn'); return; }
  var cols = columnas || Object.keys(filas[0]).filter(function (k) { return k !== 'creado'; });
  var lineas = [cols.join(';')];
  filas.forEach(function (f) {
    lineas.push(cols.map(function (c) {
      var v = f[c];
      if (Array.isArray(v)) v = v.join(' | ');
      return String(v == null ? '' : v).replace(/;/g, ',').replace(/[\r\n]+/g, ' ');
    }).join(';'));
  });
  var contenido = '\ufeff' + lineas.join('\r\n');
  var enlace = document.createElement('a');
  enlace.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(contenido);
  enlace.download = 'Inventory School-' + tabla + '-' + PIA.hoy() + '.csv';
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  PIA.toast('Archivo exportado: ' + enlace.download);
};

/* ---------------- 5. BÚSQUEDA Y ORDEN EN TABLAS ---------------- */

var ORDEN_ACTUAL = {};

/** Filtra las filas de una tabla por un texto, en cualquier columna. */
PIA.filtrar = function (filas, texto) {
  var t = PIA.normalizar(texto);
  if (!t) return filas;
  return filas.filter(function (f) { return PIA.normalizar(JSON.stringify(f)).indexOf(t) !== -1; });
};

/** Ordena las filas por una columna (alterna ascendente y descendente). */
PIA.ordenar = function (filas, columna) {
  var clave = ORDEN_ACTUAL.clave === columna && ORDEN_ACTUAL.dir === 'asc' ? 'desc' : 'asc';
  ORDEN_ACTUAL = { clave: columna, dir: clave };
  return filas.slice().sort(function (a, b) {
    var x = a[columna], y = b[columna];
    var num = !isNaN(Number(x)) && !isNaN(Number(y)) && x !== '' && y !== '';
    var r = num ? Number(x) - Number(y) : PIA.normalizar(x).localeCompare(PIA.normalizar(y));
    return clave === 'asc' ? r : -r;
  });
};

/* ---------------- 6. CONTADORES ANIMADOS ---------------- */

/** Anima un número desde 0 hasta su valor final. */
PIA.contar = function (idElemento, hasta, sufijo) {
  var el = document.getElementById(idElemento);
  if (!el) return;
  var meta = Number(hasta) || 0;
  var inicio = 0;
  var paso = Math.max(1, Math.ceil(meta / 26));
  var timer = setInterval(function () {
    inicio += paso;
    if (inicio >= meta) { inicio = meta; clearInterval(timer); }
    el.textContent = inicio + (sufijo || '');
  }, 22);
};

/* Palabras que se cambian para que los ejemplos no queden idénticos. */
var VARIANTES = ['Nuevo', 'Actualizado', 'Urgente', 'Revisado', 'Pendiente'];

/**
 * Crea cinco registros de ejemplo a partir de los que ya existen.
 * Toma la tabla con más datos, copia un registro y le cambia algunos valores
 * para que se vea como si alguien los hubiera escrito desde la página.
 */
PIA.crearEjemplos = function () {
  var todo = PIA.leerTodo();
  var tablas = Object.keys(todo).filter(function (t) { return Array.isArray(todo[t]) && todo[t].length; });
  if (!tablas.length) { PIA.toast('No hay datos base para crear ejemplos.', 'mal'); return; }
  /* la tabla con más registros suele ser la principal */
  tablas.sort(function (a, b) { return todo[b].length - todo[a].length; });
  var tabla = tablas[0];
  var base = todo[tabla];
  var creados = 0;

  for (var i = 0; i < 5; i++) {
    var modelo = base[i % base.length];
    var copia = JSON.parse(JSON.stringify(modelo));
    delete copia.id;
    delete copia.creado;
    var marca = VARIANTES[i % VARIANTES.length] + ' ' + (i + 1);
    Object.keys(copia).forEach(function (k) {
      var v = copia[k];
      if (typeof v !== 'string' || !v) return;
      var kl = k.toLowerCase();
      /* se cambian los textos visibles; los códigos y correos se dejan válidos */
      if (kl.indexOf('codigo') !== -1 || kl.indexOf('radicado') !== -1 || kl.indexOf('carnet') !== -1) {
        copia[k] = v.replace(/\d+$/, function (m) { return String(Number(m) + 100 + i); });
      } else if (kl.indexOf('correo') !== -1 || kl.indexOf('email') !== -1) {
        copia[k] = v.replace('@', '.' + (i + 1) + '@');
      } else if (kl.indexOf('fecha') !== -1) {
        var d = new Date(); d.setDate(d.getDate() + i + 1);
        copia[k] = d.toISOString().slice(0, 10);
      } else if (kl.indexOf('titulo') !== -1 || kl.indexOf('nombre') !== -1 || kl.indexOf('asunto') !== -1 || kl.indexOf('descripcion') !== -1 || kl.indexOf('mensaje') !== -1) {
        copia[k] = v + ' · ' + marca;
      }
    });
    PIA.insertar(tabla, copia);
    creados++;
  }

  PIA.brindis();
  PIA.toast('Se crearon ' + creados + ' ejemplos en la tabla "' + tabla + '".');
  setTimeout(function () { window.location.reload(); }, 900);
};

   inventario-crud.js
   --------------------------------------------------------------------------
   El almacén de los implementos deportivos: crear, editar, reparar, dar de
   baja y generar la etiqueta QR única de cada activo.
   Es el paso 2 del algoritmo Gestionar_Prestamo_Y_Devolucion_QR: sin código
   QR no hay forma de identificar el balón que sale de la bodega.

'use strict';

/* Los deportes que se practican en los descansos de la Lola. */
var DEPORTES = ['Fútbol', 'Microfútbol', 'Baloncesto', 'Voleibol', 'Tenis de Mesa', 'Ajedrez', 'Recreación'];

/* La escala de estado físico del activo. */

/* Los cuatro estados formales de disponibilidad (EAM / WMS). */
var DISPONIBILIDADES = ['DISPONIBLE', 'PRESTADO', 'EN_MANTENIMIENTO', 'DADO_DE_BAJA'];

/* Guarda el id del implemento que se está editando, o null si es nuevo. */
var implementoEnEdicion = null;

/** Pinta la disponibilidad como etiqueta de color. */
function badgeDisponibilidad(d) {
  var clase = d === 'DISPONIBLE' ? 'ok' : d === 'PRESTADO' ? 'info' : d === 'EN_MANTENIMIENTO' ? 'warn' : 'mal';
  return '<span class="badge ' + clase + '">' + String(d || '').replace(/_/g, ' ') + '</span>';
}

/** Pinta el estado físico como etiqueta de color. */
function badgeFisico(e) {
  var clase = e === 'Excelente' ? 'ok' : e === 'Bueno' ? 'info' : e === 'Deteriorado' ? 'warn' : 'mal';
  return '<span class="badge ' + clase + '">' + PIA.esc(e) + '</span>';
}

/** El color del semáforo de un implemento. */
function colorSemaforo(it) {
  if (it.disponibilidad === 'DISPONIBLE') return 'ok';
  if (it.disponibilidad === 'PRESTADO') return 'info';
  if (it.disponibilidad === 'EN_MANTENIMIENTO') return 'warn';
  return 'mal';
}

/** Las tres primeras letras del deporte, para el código QR. */
function prefijoDeporte(deporte) {
  var limpio = PIA.normalizar(deporte).replace(/[^a-z]/g, '');
  return (limpio.slice(0, 3) || 'gen').toUpperCase();
}

/** Genera el siguiente código QR único de un implemento. */
function codigoQRNuevo(deporte) {
  return PIA.codigo('QR-' + prefijoDeporte(deporte) + '-', 'implementos', 'codigo_qr');
}

/** Devuelve un implemento por su id. */
function buscarImplemento(id) {
  return PIA.listar('implementos').filter(function (x) { return Number(x.id) === Number(id); })[0] || null;
}

/** Guarda un implemento nuevo o actualiza el que se está editando. */
function guardarImplemento() {
  var nombre = PIA.valor('iNombre');
  var deporte = PIA.valor('iDeporte');
  var ubicacion = PIA.valor('iUbicacion');
  var fisico = PIA.valor('iFisico');
  var cantidad = Number(PIA.valor('iCantidad')) || 1;

  if (!nombre) { PIA.toast('Escribe el nombre del implemento.', 'mal'); return; }
  if (nombre.length < 4) { PIA.toast('El nombre es demasiado corto.', 'mal'); return; }
  if (!deporte) { PIA.toast('Elige el deporte.', 'mal'); return; }
  if (!ubicacion) { PIA.toast('Escribe dónde se guarda el implemento.', 'mal'); return; }
  if (!fisico) { PIA.toast('Elige el estado físico.', 'mal'); return; }
  if (cantidad < 1) { PIA.toast('La cantidad mínima es 1 unidad.', 'mal'); return; }

  if (implementoEnEdicion) {
    PIA.actualizar('implementos', implementoEnEdicion, {
      nombre: nombre, deporte: deporte, ubicacion: ubicacion,
      estado_fisico: fisico, cantidad: cantidad
    });
    PIA.toast('Implemento actualizado.');
  } else {
    PIA.insertar('implementos', {
      codigo_qr: codigoQRNuevo(deporte), nombre: nombre, deporte: deporte,
      ubicacion: ubicacion, estado_fisico: fisico, disponibilidad: 'DISPONIBLE',
      cantidad: cantidad, fecha_ingreso: PIA.hoy(), veces_prestado: 0
    });
    PIA.toast('Implemento registrado con su etiqueta QR.');
  }
  limpiarImplemento();
  refrescarTodo();
}

/** Deja el formulario listo para un implemento nuevo. */
function limpiarImplemento() {
  implementoEnEdicion = null;
  PIA.poner('iNombre', '');
  PIA.poner('iDeporte', '');
  PIA.poner('iUbicacion', '');

function editarImplemento(id) {

  implementoEnEdicion = it.id;

/* ---------------------------------------------------------------------- */
/*  LA ETIQUETA QR (sin librerías: se dibuja con la rejilla del CSS)        */
/* ---------------------------------------------------------------------- */

/**
 * Construye una matriz de puntos a partir del texto del código.
 * No es un QR real, pero conserva la forma y las tres marcas de posición,
 * que es lo que se necesita para la etiqueta impresa del prototipo.
 */
function matrizQR(texto, lado) {
  var t = String(texto || 'QR');
  var semilla = 7;
  for (var i = 0; i < t.length; i++) {
    semilla = (semilla * 31 + t.charCodeAt(i)) % 2147483647;
  }
  var x = semilla || 12345;
  var m = [];
  var f, c;
  for (f = 0; f < lado; f++) {
    m[f] = [];
    for (c = 0; c < lado; c++) {
      x = (x * 16807) % 2147483647;
      m[f][c] = (x % 10) < 5;
    }
  }
  /* las tres marcas de posición del QR */
  for (f = 0; f < 7; f++) {
    for (c = 0; c < 7; c++) {
      var borde = f === 0 || f === 6 || c === 0 || c === 6;
      var centro = f >= 2 && f <= 4 && c >= 2 && c <= 4;
      var pinta = borde || centro;
      m[f][c] = pinta;
      m[f][lado - 1 - c] = pinta;
      m[lado - 1 - f][c] = pinta;
    }
  }
  return m;
}

/** Devuelve el HTML de la rejilla de puntos de un código. */
function pintarQR(texto, lado) {
  var n = lado || 21;
  var m = matrizQR(texto, n);
  var html = '<div class="qr-cuadricula" style="grid-template-columns:repeat(' + n + ',1fr)">';
  for (var f = 0; f < n; f++) {
    for (var c = 0; c < n; c++) {
      html += '<i class="' + (m[f][c] ? 'on' : '') + '"></i>';
    }
  }
  return html + '</div>';
}

/** Abre la etiqueta QR de un implemento para imprimirla. */
function verEtiquetaQR(id) {
  var it = buscarImplemento(id);
  if (!it) return;
  var cuerpo = '<div class="qr-caja">' + pintarQR(it.codigo_qr, 21) +
    '<p class="mono" style="margin-top:10px">' + PIA.esc(it.codigo_qr) + '</p>' +
    '<p class="pequeno gris">' + PIA.esc(it.nombre) + ' · ' + PIA.esc(it.deporte) + '</p>' +
    '</div>' +
    '<p class="pequeno gris" style="margin-top:10px">Pega esta etiqueta en el implemento. El estudiante la escanea al pedirlo y al devolverlo.</p>';
  PIA.modal('Etiqueta QR · ' + it.nombre, cuerpo,
    '<button class="btn" onclick="PIA.cerrarModal()">Cerrar</button>' +
    '<button class="btn p" onclick="window.print()">Imprimir etiqueta</button>');
}

/* ==========================================================================
   prestamos-mora.js
   --------------------------------------------------------------------------
   El motor transaccional del proyecto: traduce paso a paso el algoritmo
   Gestionar_Prestamo_Y_Devolucion_QR_InventorySchool.
   Las dos constantes del PDF viven aquí: 30 minutos de descanso y 3 días de
   bloqueo pedagógico por devolución tardía.
   ========================================================================== */

'use strict';

/* Lo que dura el descanso: el préstamo debe volver en media hora. */
var TIEMPO_MAX_DESCANSO_MIN = 30;

/* Los días que el estudiante queda bloqueado si devuelve tarde. */
var DIAS_BLOQUEO_POR_MORA = 3;

/** La hora actual en formato HH:MM. */
function horaActual() {
  var d = new Date();
  var hh = d.getHours() < 10 ? '0' + d.getHours() : String(d.getHours());
  var mm = d.getMinutes() < 10 ? '0' + d.getMinutes() : String(d.getMinutes());
  return hh + ':' + mm;
}

/** Suma minutos a una hora HH:MM y devuelve HH:MM (sin pasar de un día). */
function sumarMinutos(hora, minutos) {
  var p = String(hora || '00:00').split(':');
  var total = Number(p[0]) * 60 + Number(p[1] || 0) + Number(minutos);
  total = ((total % 1440) + 1440) % 1440;
  var hh = Math.floor(total / 60);
  var mm = total % 60;
  return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
}

/** Convierte una hora HH:MM en minutos desde la medianoche. */
function minutosDe(hora) {
  var p = String(hora || '00:00').split(':');
  return Number(p[0]) * 60 + Number(p[1] || 0);
}

/** Suma días de calendario a una fecha aaaa-mm-dd. */
function sumarDias(fecha, dias) {
  var d = new Date(String(fecha) + 'T00:00:00');
  d.setDate(d.getDate() + Number(dias));
  return d.toISOString().slice(0, 10);
}

/** Busca un estudiante por su documento (paso 1 del algoritmo). */
function buscarEstudiante(documento) {
  var doc = String(documento || '').trim();
  return PIA.listar('estudiantes').filter(function (x) { return String(x.documento) === doc; })[0] || null;
}

/** Busca un implemento por su código QR (paso 2 del algoritmo). */
function buscarPorQR(codigo) {
  var qr = String(codigo || '').trim().toUpperCase();
  return PIA.listar('implementos').filter(function (x) { return String(x.codigo_qr).toUpperCase() === qr; })[0] || null;
}

/** El préstamo abierto de un estudiante, si lo tiene. */
function prestamoActivoDe(documento) {
  var doc = String(documento || '').trim();
  return PIA.listar('prestamos').filter(function (x) {
    return x.estado === 'ACTIVO' && String(x.documento) === doc;
  })[0] || null;
}

/** Todos los préstamos que siguen abiertos. */
function prestamosActivos() {
  return PIA.listar('prestamos').filter(function (x) { return x.estado === 'ACTIVO'; });
}

/** ¿El estudiante tiene una sanción vigente? */
function sancionVigente(est) {
  if (!est || !est.sancion_hasta) return false;
  return String(est.sancion_hasta) > PIA.hoy();
}

/** ¿El préstamo ya se pasó de la hora límite? */
function prestamoVencido(p) {
  if (!p || p.estado !== 'ACTIVO') return false;
  if (String(p.fecha_salida) < PIA.hoy()) return true;
  if (String(p.fecha_salida) > PIA.hoy()) return false;
  return minutosDe(horaActual()) > minutosDe(p.hora_limite);
}

/** Muestra un aviso dentro de una caja de la página. */
function avisar(caja, tipo, html) {
  if (!caja) return;
  caja.innerHTML = '<div class="aviso ' + (tipo || '') + '">' + html + '</div>';
}

/* ---------------------------------------------------------------------- */
/*  PASO 3: SOLICITAR_PRESTAMO                                             */
/* ---------------------------------------------------------------------- */
/**
 * Registra un préstamo. Recorre las validaciones del algoritmo en orden:
 * sanción activa, préstamo abierto, disponibilidad del implemento.
 */
function solicitarPrestamo() {
  var caja = document.getElementById('resultadoEscaneo');
  var documento = PIA.valor('pDocumento');
  var codigo = PIA.valor('pCodigoQR');
  var fisico = PIA.valor('pEstadoFisico');

  if (!documento) { avisar(caja, 'mal', 'Escribe el documento del estudiante.'); return null; }
  if (!codigo) { avisar(caja, 'mal', 'Escanea o escribe el código QR del implemento.'); return null; }

  /* 1. el estudiante */
  var est = buscarEstudiante(documento);
  if (!est) { avisar(caja, 'mal', 'No encontramos a ningún estudiante con el documento <b>' + PIA.esc(documento) + '</b>.'); return null; }

  /* 2. el implemento */
  var imp = buscarPorQR(codigo);
  if (!imp) { avisar(caja, 'mal', 'El código <b>' + PIA.esc(codigo) + '</b> no corresponde a ningún implemento del inventario.'); return null; }

  /* 3. las tres validaciones del algoritmo */
  if (sancionVigente(est)) {
    avisar(caja, 'mal', 'Préstamo bloqueado hasta <b>' + PIA.fecha(est.sancion_hasta) +
      '</b> por retraso previo. Mientras tanto puedes usar los implementos de tu clase de Educación Física.');
    return null;
  }
  var abierto = prestamoActivoDe(documento);
  if (abierto) {
    avisar(caja, 'mal', 'Debes devolver primero el implemento que tienes en préstamo activo (' +
      '<b>' + PIA.esc(abierto.codigo_qr) + '</b>, límite ' + PIA.esc(abierto.hora_limite) + ').');
    return null;
  }
  if (imp.disponibilidad !== 'DISPONIBLE') {
    avisar(caja, 'mal', 'El implemento <b>' + PIA.esc(imp.nombre) + '</b> no está disponible actualmente: ' +
      badgeDisponibilidad(imp.disponibilidad) + '.');
    return null;
  }

  /* el préstamo sale con la hora límite de 30 minutos */
  var salida = horaActual();
  var limite = sumarMinutos(salida, TIEMPO_MAX_DESCANSO_MIN);
  PIA.actualizar('implementos', imp.id, {
    disponibilidad: 'PRESTADO',
    estado_fisico: fisico || imp.estado_fisico,
    veces_prestado: Number(imp.veces_prestado || 0) + 1
  });
  var nuevo = PIA.insertar('prestamos', {
    codigo_qr: imp.codigo_qr, documento: est.documento, estudiante: est.nombre,
    grado: est.grado, fecha_salida: PIA.hoy(), hora_salida: salida,
    hora_limite: limite, fecha_devolucion: '', hora_devolucion: '',
    estado: 'ACTIVO', estado_entrega: fisico || imp.estado_fisico,
    estado_recibo: '', observacion: ''
  });

  avisar(caja, 'ok', 'Préstamo exitoso de <b>' + PIA.esc(imp.nombre) + '</b>.<br>' +
    'Devuélvelo antes de las <b>' + limite + '</b>. Tienes ' + TIEMPO_MAX_DESCANSO_MIN + ' minutos.');
  PIA.toast('Préstamo registrado: ' + imp.codigo_qr);
  mostrarFichaPrestamo(nuevo);
  refrescarTodo();
  return nuevo;
}

/** Pinta la ficha del préstamo recién creado, con su cuenta regresiva. */
function mostrarFichaPrestamo(p) {
  var caja = document.getElementById('resultadoEscaneo');
  if (!caja || !p) return;
  var html = '<div class="tarjeta" style="margin:0;border-left:4px solid var(--ok)">';
  html += '<div class="fila" style="justify-content:space-between">';
  html += '<div><b>' + PIA.esc(p.estudiante) + '</b><br><span class="pequeno gris">' + PIA.esc(p.grado) + ' · ' + PIA.esc(p.codigo_qr) + '</span></div>';
  html += '<div class="derecha centro"><span class="pequeno gris">Entregar antes de</span><div class="turno-limite" id="cuentaLimite">' + PIA.esc(p.hora_limite) + '</div></div>';
  html += '</div></div>';
  caja.innerHTML = html + caja.innerHTML;
  arrancarCuenta(p);
}

/** Cuenta regresiva de los 30 minutos, cuando el préstamo es de hoy. */
function arrancarCuenta(p) {
  var caja = document.getElementById('cuentaLimite');
  if (!caja) return;
  clearInterval(window.__relojPrestamo);
  var limite = minutosDe(p.hora_limite);
  var actualizar = function () {
    var restantes = limite - minutosDe(horaActual());
    if (String(p.fecha_salida) !== PIA.hoy()) restantes = 0;
    if (restantes <= 0) {
      caja.textContent = 'TIEMPO AGOTADO';
      caja.className = 'turno-limite tarde';
      clearInterval(window.__relojPrestamo);
      return;
    }
    var m = Math.floor(restantes / 60);
    var s = restantes % 60;
    caja.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  };
  actualizar();
  window.__relojPrestamo = setInterval(actualizar, 1000);
}

/* ---------------------------------------------------------------------- */
/*  PASO 4: REGISTRAR_DEVOLUCION                                          */
/* ---------------------------------------------------------------------- */
/**
 * Cierra el préstamo abierto de un implemento y decide a qué estado pasa:
 * EN_MANTENIMIENTO si volvió roto, DISPONIBLE en cualquier otro caso.
 * Si llegó tarde, aplica el bloqueo pedagógico de 3 días.
 */
function registrarDevolucion() {
  var caja = document.getElementById('resultadoEscaneo');
  var codigo = PIA.valor('pCodigoQR');
  var fisico = PIA.valor('pEstadoFisico');
  if (!codigo) { avisar(caja, 'mal', 'Escanea o escribe el código QR del implemento que devuelves.'); return null; }

  var imp = buscarPorQR(codigo);
  if (!imp) { avisar(caja, 'mal', 'El código <b>' + PIA.esc(codigo) + '</b> no existe en el inventario.'); return null; }

  var qr = String(codigo).trim().toUpperCase();
  var p = PIA.listar('prestamos').filter(function (x) {
    return x.estado === 'ACTIVO' && String(x.codigo_qr).toUpperCase() === qr;
  })[0];
  if (!p) {
    avisar(caja, 'mal', 'No hay un préstamo activo de <b>' + PIA.esc(imp.nombre) + '</b>. Revisa el código QR.');
    return null;
  }

  /* se cierra el préstamo con la hora real de la devolución */
  var ahora = horaActual();
  var tarde = String(p.fecha_salida) < PIA.hoy() || minutosDe(ahora) > minutosDe(p.hora_limite);
  PIA.actualizar('prestamos', p.id, {
    estado: 'CERRADO', fecha_devolucion: PIA.hoy(), hora_devolucion: ahora,
    estado_recibo: fisico, observacion: tarde
      ? 'Devolución tardía: se aplicó bloqueo de 3 días.'
      : 'Devolución dentro del tiempo del descanso.'
  });

  /* el estado del activo depende del estado físico reportado */
  if (fisico === 'ROTO') {
    PIA.actualizar('implementos', imp.id, { estado_fisico: 'Roto', disponibilidad: 'EN_MANTENIMIENTO' });
  } else {
    PIA.actualizar('implementos', imp.id, { estado_fisico: fisico, disponibilidad: 'DISPONIBLE' });
  }

  /* la sanción por mora */
  var est = buscarEstudiante(p.documento);
  var bloqueadoHasta = '';
  if (tarde && est) {
    bloqueadoHasta = sumarDias(PIA.hoy(), DIAS_BLOQUEO_POR_MORA);
    PIA.actualizar('estudiantes', est.id, { sancion_hasta: bloqueadoHasta });
  }

  var html = '';
  if (fisico === 'ROTO') {
    html += '<b>' + PIA.esc(imp.nombre) + '</b> pasa a <b>EN MANTENIMIENTO</b>.<br>';
  }
  if (tarde) {
    html += 'Devolución tardía registrada. Se aplica bloqueo pedagógico temporal de ' + DIAS_BLOQUEO_POR_MORA + ' días';
    if (bloqueadoHasta) html += ', hasta el <b>' + PIA.fecha(bloqueadoHasta) + '</b>.';
    else html += '.';
    avisar(caja, 'warn', html);
    PIA.toast('Devolución tardía: bloqueo de 3 días.', 'warn');
  } else {
    html += 'Devolución exitosa a las ' + ahora + '. ¡Gracias por cuidar los implementos de la Lola!';
    avisar(caja, 'ok', html);
    PIA.toast('Devolución registrada: ' + imp.codigo_qr);
  }
  refrescarTodo();
  return p;
}

/** Llena el código QR con un implemento prestado, para probar sin cámara. */
function simularEscaneo() {
  var activos = prestamosActivos();
  var caja = document.getElementById('resultadoEscaneo');
  if (activos.length) {
    var p = activos[0];
    var otro = PIA.listar('estudiantes').filter(function (e) {
      return !prestamoActivoDe(e.documento) && !sancionVigente(e);
    })[0];
    PIA.poner('pCodigoQR', p.codigo_qr);
    PIA.poner('pDocumento', otro ? otro.documento : p.documento);
    PIA.toast('Código cargado: ' + p.codigo_qr);
    return;
  }
  var libre = PIA.listar('implementos').filter(function (x) { return x.disponibilidad === 'DISPONIBLE'; })[0];
  if (!libre) { avisar(caja, 'warn', 'No hay implementos disponibles para simular.'); return; }
  PIA.poner('pCodigoQR', libre.codigo_qr);
  PIA.poner('pDocumento', '1020226147');
  PIA.toast('Código cargado: ' + libre.codigo_qr);
}

/*  LAS VISTAS DEL PRÉSTAMO                                               */

/** Pinta la tabla de préstamos activos (portada y escáner). */
function pintarPrestamos() {
  var activos = prestamosActivos();
  var cont = document.getElementById('prestamosActivos') || document.getElementById('activosPortada');
  if (!cont) return;
  cont.innerHTML = PIA.tabla(
    ['Implemento', 'Estudiante', 'Salió', 'Límite', 'Estado'],
    activos.map(function (p) {
      var vencido = prestamoVencido(p);
      return [
        '<span class="mono">' + PIA.esc(p.codigo_qr) + '</span>',
        PIA.esc(p.estudiante) + '<br><span class="pequeno gris">' + PIA.esc(p.grado) + '</span>',
        PIA.esc(p.hora_salida),
        vencido ? '<b style="color:var(--peligro)">' + PIA.esc(p.hora_limite) + '</b>' : PIA.esc(p.hora_limite),
        vencido ? '<span class="badge mal">VENCIDO</span>' : '<span class="badge info">EN TIEMPO</span>'
      ];
    }),
    { vacio: 'No hay préstamos activos: todos los implementos están en la bodega.' }
  );
}

/** Pinta el perfil completo de un estudiante. */
function pintarPerfil() {
  var cont = document.getElementById('perfil');
  if (!cont) return;
  var documento = PIA.valor('fDocumento');
  if (!documento) { cont.innerHTML = ''; return; }
  var est = buscarEstudiante(documento);
  if (!est) {
    cont.innerHTML = '<div class="aviso mal">No encontramos un estudiante con el documento <b>' + PIA.esc(documento) + '</b>.</div>';
    return;
  }
  var activo = prestamoActivoDe(est.documento);
  var historial = PIA.listar('prestamos').filter(function (x) {
    return String(x.documento) === String(est.documento) && x.estado === 'CERRADO';
  });

  var html = '<section class="tarjeta">';
  html += '<div class="fila" style="justify-content:space-between">';
  html += '<div><h2>' + PIA.esc(est.nombre) + '</h2>' +
    '<p class="ayuda" style="margin:0">Documento ' + PIA.esc(est.documento) + ' · ' + PIA.esc(est.grado) + ' · ' + PIA.esc(est.telefono) + '</p></div>';
  html += '<div>' + (sancionVigente(est)
    ? '<span class="badge mal">BLOQUEADO HASTA ' + PIA.fecha(est.sancion_hasta) + '</span>'
    : '<span class="badge ok">SIN SANCIÓN</span>') + '</div>';
  html += '</div></section>';

  html += '<div class="rejilla g2">';
  html += '<section class="tarjeta"><h2>Préstamo activo</h2>';
  if (activo) {
    var vencido = prestamoVencido(activo);
    html += '<div class="fila" style="justify-content:space-between">';
    html += '<div><b class="mono">' + PIA.esc(activo.codigo_qr) + '</b><br>' +
      '<span class="pequeno gris">Salió a las ' + PIA.esc(activo.hora_salida) + ' · entrega antes de ' + PIA.esc(activo.hora_limite) + '</span></div>';
    html += '<div class="centro"><span class="pequeno gris">Tiempo restante</span>' +
      '<div class="turno-limite' + (vencido ? ' tarde' : '') + '" id="cuentaLimite">' + (vencido ? 'TIEMPO AGOTADO' : PIA.esc(activo.hora_limite)) + '</div></div>';
    html += '</div>';
    html += '<a class="btn p" style="margin-top:12px" href="escaner-prestamo.html">Ir a devolverlo</a>';
  } else {
    html += '<p class="pequeno gris">No tienes ningún implemento en préstamo. Pide uno en el escáner QR.</p>';
    html += '<a class="btn p" style="margin-top:10px" href="escaner-prestamo.html">Pedir un implemento</a>';
  }
  html += '</section>';

  html += '<section class="tarjeta"><h2>Resumen</h2>';
  html += '<div class="indicadores" style="grid-template-columns:1fr 1fr">';
  html += '<div class="indicador"><b>Préstamos</b><strong>' + (historial.length + (activo ? 1 : 0)) + '</strong><span>en total</span></div>';
  html += '<div class="indicador"><b>Devoluciones</b><strong>' + historial.length + '</strong><span>cerradas</span></div>';
  html += '</div>';
  html += '<p class="pequeno gris">Recuerda: el préstamo dura ' + TIEMPO_MAX_DESCANSO_MIN + ' minutos y una devolución tardía bloquea ' + DIAS_BLOQUEO_POR_MORA + ' días.</p>';
  html += '</section></div>';

  html += '<section class="tarjeta"><h2>Historial</h2><p class="ayuda">Todo lo que has pedido prestado.</p>';
  html += PIA.tabla(
    ['Implemento', 'Fecha', 'Salió', 'Devolvió', 'Estado físico', 'Resultado'],
    historial.map(function (x) {
      return [
        '<span class="mono">' + PIA.esc(x.codigo_qr) + '</span>',
        PIA.fecha(x.fecha_salida),
        PIA.esc(x.hora_salida),
        PIA.esc(x.hora_devolucion || '—'),
        badgeFisico(x.estado_recibo || x.estado_entrega),
        String(x.observacion || '').indexOf('tardía') !== -1
          ? '<span class="badge warn">TARDÍA</span>'
          : '<span class="badge ok">A TIEMPO</span>'
      ];
    }),
    { vacio: 'Todavía no tienes devoluciones registradas.' }
  );
  html += '</section>';

  cont.innerHTML = html;
  if (activo && String(activo.fecha_salida) === PIA.hoy()) arrancarCuenta(activo);
}

/** Busca el perfil y lo pinta. */
function buscarPerfil() {
  var doc = PIA.valor('fDocumento');
  if (!doc) { PIA.toast('Escribe tu documento para consultar el perfil.', 'mal'); return; }
  pintarPerfil();
}

/** Carga un documento de ejemplo en el buscador. */
function verEjemplo() {
  PIA.poner('fDocumento', '1020118919');
  pintarPerfil();
}

/* Arranque de las páginas de préstamo. */
document.addEventListener('DOMContentLoaded', function () {
  pintarPrestamos();
  if (document.getElementById('perfil') && PIA.parametro('documento')) {
    PIA.poner('fDocumento', PIA.parametro('documento'));
    pintarPerfil();
  }
});
/* ==========================================================================
   estadisticas-chart.js
   --------------------------------------------------------------------------
   La analítica visual del inventario: qué deporte mueve más implementos y
   qué proporción del material está en buen estado. Son las gráficas que el
   docente de Educación Física lleva a la reunión de área.
   ========================================================================== */

'use strict';

/** Agrupa los implementos por deporte. */
function implementosPorDeporte() {
  var lista = PIA.listar('implementos');
  var mapa = {};
  lista.forEach(function (x) {
    var d = x.deporte || 'Sin deporte';
    mapa[d] = (mapa[d] || 0) + 1;
  });
  var salida = [];
  Object.keys(mapa).forEach(function (k) { salida.push({ etiqueta: k, valor: mapa[k] }); });
  salida.sort(function (a, b) { return b.valor - a.valor; });
  return salida;
}

/** Cuenta los préstamos históricos de cada deporte. */
function prestamosPorDeporte() {
  var implementos = PIA.listar('implementos');
  var prestamos = PIA.listar('prestamos');
  var mapa = {};
  prestamos.forEach(function (p) {
    var it = implementos.filter(function (x) { return x.codigo_qr === p.codigo_qr; })[0];
    var d = it ? it.deporte : 'Otro';
    mapa[d] = (mapa[d] || 0) + 1;
  });
  var salida = [];
  Object.keys(mapa).forEach(function (k) { salida.push({ etiqueta: k, valor: mapa[k] }); });
  salida.sort(function (a, b) { return b.valor - a.valor; });
  return salida;
}

/** Cuenta los implementos por estado físico. */
function implementosPorEstado() {
  var lista = PIA.listar('implementos');
  var mapa = {};
  ESTADOS_FISICOS.forEach(function (e) { mapa[e] = 0; });
  lista.forEach(function (x) { mapa[x.estado_fisico] = (mapa[x.estado_fisico] || 0) + 1; });
  var salida = [];
  Object.keys(mapa).forEach(function (k) { salida.push({ etiqueta: k, valor: mapa[k] }); });
  return salida;
}

/** Dibuja una gráfica de barras horizontales con HTML y CSS. */
function pintarBarras(contenedor, datos, claseBarra) {
  if (!contenedor) return;
  if (!datos.length) { contenedor.innerHTML = '<div class="vacio">Sin datos para graficar.</div>'; return; }
  var maximo = datos.reduce(function (m, x) { return Math.max(m, x.valor); }, 1);
  var html = '';
  datos.forEach(function (x) {
    var ancho = Math.round(x.valor / maximo * 100);
    html += '<div class="barra-fila">';
    html += '<span>' + PIA.esc(x.etiqueta) + '</span>';
    html += '<div class="pista-barra"><i class="' + (claseBarra || '') + '" style="width:' + ancho + '%"></i></div>';
    html += '<b style="text-align:right">' + x.valor + '</b>';
    html += '</div>';
  });
  contenedor.innerHTML = html;
}

/** Pinta los indicadores del panel de inventario. */
function pintarIndicadoresAdmin() {
  var lista = PIA.listar('implementos');
  var total = document.getElementById('aTotal');
  if (!total) return;
  total.textContent = lista.length;
  var buenos = lista.filter(function (x) { return x.estado_fisico === 'Excelente' || x.estado_fisico === 'Bueno'; }).length;
  document.getElementById('aBuenos').textContent = (lista.length ? Math.round(buenos / lista.length * 100) : 0) + '%';
  document.getElementById('aMantenimiento').textContent = lista.filter(function (x) { return x.disponibilidad === 'EN_MANTENIMIENTO'; }).length;
  document.getElementById('aPrestamos').textContent = PIA.listar('prestamos').length;
}

/** Pinta el tablero completo de gráficas. */
function pintarEstadisticas() {
  var graficaDeportes = document.getElementById('graficaDeportes');
  var graficaEstados = document.getElementById('graficaEstados');
  if (!graficaDeportes && !graficaEstados) return;
  pintarIndicadoresAdmin();
  var deportes = prestamosPorDeporte();
  if (!deportes.length) deportes = implementosPorDeporte();
  pintarBarras(graficaDeportes, deportes, '');
  pintarBarras(graficaEstados, implementosPorEstado(), 'acento');
}

/** Devuelve el implemento más prestado de la bodega. */
function implementoEstrella() {
  var lista = PIA.listar('implementos').slice().sort(function (a, b) {
    return Number(b.veces_prestado || 0) - Number(a.veces_prestado || 0);
  });
  return lista[0] || null;
}

/** El porcentaje de activos que están fuera de la bodega. */
function porcentajePrestado() {
  var lista = PIA.listar('implementos');
  if (!lista.length) return 0;
  var fuera = lista.filter(function (x) { return x.disponibilidad === 'PRESTADO'; }).length;
  return Math.round(fuera / lista.length * 100);
}

document.addEventListener('DOMContentLoaded', function () {
  pintarEstadisticas();

<script>(function () {
  var paginas = JSON.parse(document.getElementById("piaPaginas").textContent);
  var js = document.getElementById("piaJs").textContent;
  var css = document.getElementById("piaCss").textContent;
  var imagenes = JSON.parse(document.getElementById("piaImagenes").textContent);
  var pantalla = document.getElementById("pantalla");
  var barra = document.getElementById("barra");

  /* el CSS del proyecto se aplica una sola vez */
  var hoja = document.createElement("style");
  hoja.textContent = css;
  document.head.appendChild(hoja);

  function pintar(i) {
    var pagina = paginas[i];
    var cuerpo = pagina.cuerpo;
    Object.keys(imagenes).forEach(function (nombre) {
      cuerpo = cuerpo.split(nombre).join(imagenes[nombre]);
    });
    document.body.className = pagina.layout || "layout-top";
    var COMILLA = String.fromCharCode(34);
    pantalla.innerHTML = "<div class=" + COMILLA + "pia-pagina" + COMILLA + ">" + cuerpo + "</div>";

    /* se vuelve a ejecutar el JavaScript del proyecto para esta página */
    var viejo = document.getElementById("piaJsVivo");
    if (viejo) viejo.parentNode.removeChild(viejo);
    var nuevo = document.createElement("script");
    nuevo.id = "piaJsVivo";
    nuevo.textContent = js;
    document.body.appendChild(nuevo);

    /* se avisa que la página cargó, para que los módulos pinten sus datos */
    setTimeout(function () {
      document.dispatchEvent(new Event("DOMContentLoaded"));
      window.dispatchEvent(new Event("load"));
    }, 40);

    /* los enlaces del menú cambian de página dentro del mismo archivo */
    var enlaces = pantalla.querySelectorAll(".menu a, .menu-tabs a");
    Array.prototype.forEach.call(enlaces, function (a) {
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        var destino = a.getAttribute("href");
        for (var j = 0; j < paginas.length; j++) {
          if (paginas[j].archivo === destino) { ir(j); return; }
        }
      });
    });
    window.scrollTo(0, 0);
  }

  function ir(i) {
    var botones = barra.querySelectorAll("button");
    Array.prototype.forEach.call(botones, function (b, j) {
      if (j === i) b.classList.add("activo"); else b.classList.remove("activo");
    });
    pintar(i);
  }

  window.PIA_ir = function (archivo) {
    for (var j = 0; j < paginas.length; j++) if (paginas[j].archivo === archivo) return ir(j);
  };

  paginas.forEach(function (p, i) {
    var b = document.createElement("button");
    b.textContent = p.nombre;
    if (i === 0) b.className = "activo";
    b.onclick = function () { ir(i); };
    barra.appendChild(b);
  });

  var info = document.createElement("span");
  info.className = "aviso";
  info.textContent = paginas.length + " páginas · un solo archivo";
  barra.appendChild(info);

  pintar(0);
})();</script>
